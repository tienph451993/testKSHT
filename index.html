                                                                                <div className="p-2 bg-gray-50 flex flex-col gap-2 animate-zoom-in">
                                                                                    {(() => {
                                                                                        const availableMeasures = riskLibrary.measures
                                                                                            .filter(m => m.moi_nguy_id === r.id)
                                                                                            .filter(m => !(row.congViec || "").includes(m.noi_dung));

                                                                                        if (availableMeasures.length === 0) {
                                                                                            return <div className="text-sm text-green-700 italic font-bold p-4 text-center bg-green-50 border border-green-200 rounded">Đã dán toàn bộ biện pháp của mục này!</div>;
                                                                                        }

                                                                                        return availableMeasures.map(m => (
                                                                                            <div key={m.id} className="flex gap-3 items-center bg-white p-3 rounded-lg border border-gray-200 shadow-sm w-full transition-colors hover:border-purple-300 shrink-0">
                                                                                                <div className="flex-1 text-sm text-gray-800 break-words leading-relaxed font-medium">
                                                                                                    {m.noi_dung}
                                                                                                </div>
                                                                                                <button 
                                                                                                    onClick={() => {
                                                                                                        const textToAdd = `- ${m.noi_dung}`;
                                                                                                        const newData = [...formData.muc8_bangData];
                                                                                                        newData[index].congViec = newData[index].congViec ? `${newData[index].congViec}\n${textToAdd}` : textToAdd;
                                                                                                        setFormData({...formData, muc8_bangData: newData});
                                                                                                    }}
                                                                                                    className="bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-purple-700 active:scale-95 shrink-0 flex items-center gap-1.5 transition-all shadow"
                                                                                                >
                                                                                                    <UI_Icons.Plus size={16}/> Dán
                                                                                                </button>
                                                                                            </div>
                                                                                        ));
                                                                                    })()}
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    ));
                                                                })()}
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Ô nhập text tự động giãn nở (Auto-resize) */}
                                            <div className="grid w-full">
                                                <div className="col-start-1 row-start-1 invisible whitespace-pre-wrap break-words min-h-[100px] text-sm leading-relaxed font-medium">
                                                    {row.congViec ? row.congViec + '\n' : 'Nhập công việc và nhận diện...'}
                                                </div>
                                                <textarea 
                                                    className="col-start-1 row-start-1 w-full h-full resize-none outline-none font-medium text-blue-900 bg-transparent min-h-[100px] text-sm leading-relaxed overflow-hidden" 
                                                    value={row.congViec} 
                                                    onChange={e => { const newData = [...formData.muc8_bangData]; newData[index].congViec = e.target.value; setFormData({...formData, muc8_bangData: newData}); }}
                                                    placeholder="Nhập công việc và nhận diện..."
                                                ></textarea>
                                            </div>

                                        {/* CỘT 3: BIỆN PHÁP AN TOÀN (Cơ chế List + Dán) */}

                                                <select 
                                                    id={`sel-bp-${index}`}
                                                    className="flex-1 border rounded px-1 py-1 text-xs bg-gray-50 outline-none focus:border-blue-500"
                                                >
                                                    <option value="">-- Chọn mẫu biện pháp --</option>
                                                    {tags9a.map((t, i) => (
                                                        <option key={i} value={i}>{t.label}</option>
                                                    ))}
                                                </select>
                                                <button 
                                                    onClick={() => {
                                                        const sel = document.getElementById(`sel-bp-${index}`);
                                                        if (!sel.value) return; // Không làm gì nếu chưa chọn mẫu
                                                        
                                                        const t = tags9a[sel.value];
                                                        let textToAdd = t.content;
                                                        const ctx = getContextData();
                                                        
                                                        // Thay thế các biến {tru_chinh}, {tru}, {tuyen} tự động
                                                        textToAdd = textToAdd.replace(/{tru_chinh}/g, ctx.code || "...").replace(/{tru}/g, `${ctx.code}${ctx.sub ? "/" + ctx.sub : ""}`).replace(/{tuyen}/g, ctx.line || "...");
                                                        
                                                        // Logic xuống dòng hoặc nối tiếp
                                                        const sep = t.inline ? " " : "\n";
                                                        const newData = [...formData.muc8_bangData];
                                                        newData[index].bienPhap = newData[index].bienPhap ? newData[index].bienPhap + sep + textToAdd : textToAdd;
                                                        
                                                        setFormData({...formData, muc8_bangData: newData});
                                                    }}
                                                    className="bg-blue-600 text-white px-2 py-1 rounded text-xs font-bold hover:bg-blue-700 active:scale-95 transition-all shadow-sm flex items-center gap-1 shrink-0"
                                                >
                                                    <UI_Icons.Plus size={12}/> Dán
                                                </button>
                                            </div>
                                            {/* Ô nhập text tự động giãn nở (Auto-resize) */}
                                            <div className="grid w-full mt-2">
                                                {/* Khung tàng hình đo chiều cao cho biện pháp */}
                                                <div className="col-start-1 row-start-1 invisible whitespace-pre-wrap break-words min-h-[100px] text-sm leading-relaxed font-medium">
                                                    {row.bienPhap ? row.bienPhap + '\n' : 'Nhập biện pháp an toàn...'}
                                                </div>
                                                {/* Ô nhập liệu thực tế */}
                                                <textarea 
                                                    className="col-start-1 row-start-1 w-full h-full resize-none outline-none font-medium text-blue-900 bg-transparent min-h-[100px] text-sm leading-relaxed overflow-hidden" 
                                                    value={row.bienPhap} 
                                                    onChange={e => { const newData = [...formData.muc8_bangData]; newData[index].bienPhap = e.target.value; setFormData({...formData, muc8_bangData: newData}); }}
                                                    placeholder="Nhập biện pháp an toàn..."
                                                ></textarea>
                                            </div>
                                        </td>

                                        {/* CỘT 4: ĐƠN VỊ THỰC HIỆN (Đã đổi sang Textarea tự giãn dòng) */}
                                        <td className="border border-gray-300 p-2 align-top w-[120px] md:w-[150px]">
                                            <div className="flex flex-col gap-2 items-center w-full">
                                                
                                                {/* Ô nhập text tự động giãn nở (Auto-resize) */}
                                                <div className="grid w-full">
                                                    {/* Khung tàng hình đo chiều cao */}
                                                    <div className="col-start-1 row-start-1 invisible whitespace-pre-wrap break-words min-h-[30px] text-sm font-bold text-center">
                                                        {row.donVi ? row.donVi + '\n' : 'Đơn vị...'}
                                                    </div>
                                                    {/* Ô nhập liệu thực tế */}
                                                    <textarea 
                                                        className="col-start-1 row-start-1 w-full h-full resize-none outline-none font-bold text-blue-900 bg-transparent min-h-[30px] text-sm text-center overflow-hidden" 
                                                        value={row.donVi} 
                                                        onChange={e => { const newData = [...formData.muc8_bangData]; newData[index].donVi = e.target.value; setFormData({...formData, muc8_bangData: newData}); }}
                                                        placeholder="Đơn vị..."
                                                        rows={1}
                                                    ></textarea>
                                                </div>

                                                {/* Dropdown Gợi ý chọn nhanh */}
                                                <select 
                                                    className="w-full border rounded px-1 py-1 text-xs text-gray-500 outline-none focus:border-blue-400 text-center"
                                                    value=""
                                                    onChange={e => {
                                                        if (!e.target.value) return;
                                                        const newData = [...formData.muc8_bangData];
                                                        newData[index].donVi = e.target.value;
                                                        setFormData({...formData, muc8_bangData: newData});
                                                    }}
                                                >
                                                    <option value="">-- Gợi ý --</option>
                                                    <option value="Tổ QLVH">Tổ QLVH</option>
                                                    <option value="Tổ KD">Tổ KD</option>
                                                </select>
                                            </div>
                                        </td>

                                        {/* CỘT XÓA */}
                                        <td className="border border-gray-300 text-center align-middle">
                                            <button onClick={() => { const newData = formData.muc8_bangData.filter((_, i) => i !== index); setFormData({...formData, muc8_bangData: newData}); }} className="text-red-500 hover:bg-red-50 p-1 rounded"><UI_Icons.Trash2 size={16}/></button>
                                        </td>
                                    </tr>
                                ))}
                                <tr>
                                    <td colSpan="5" className="border border-gray-300 bg-gray-50 p-1 text-center">
                                        <button 
                                            onClick={() => setFormData({...formData, muc8_bangData: [...formData.muc8_bangData, { congViec: "", bienPhap: "", donVi: "" }]})}
                                            className="text-sm font-bold text-blue-600 flex items-center justify-center gap-1 w-full py-1 hover:bg-blue-100 rounded transition-colors"
                                        >
                                            <UI_Icons.Plus size={16}/> Thêm dòng công việc / rủi ro
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        </div> {/* Đóng thẻ div cuộn ngang Bảng 8 */}
                    </div>


                    <div className="mt-8 text-justify mb-8">Biên bản này được lập thành <input className="w-10 text-center border-b border-gray-300 font-bold" value={formData.soBan} onChange={e => setFormData({...formData, soBan: e.target.value})} /> bản và được tất cả mọi người dự họp là đại diện của các đơn vị có liên quan đến công việc đồng ý, thông qua để làm cơ sở tiến hành công việc sau này (nếu không thay đổi về những nội dung chính) và ký tên dưới đây.</div>


                    {/* CHÂN BIÊN BẢN + TRẠNG THÁI CHỮ KÝ */}
                    {(() => {
                        const formatDT = (iso) => formatVNDateTime(iso);
                        const getSig = (userId) => signatureStatus.find(s => s.user_id === userId);

                        const renderSigBox = (label, name, userId) => {
                            const sig = userId ? getSig(userId) : null;
                            return (
                                <div className="flex flex-col items-center text-center">
                                    <div className="font-bold text-xs md:text-sm uppercase mb-2">{label}</div>
                                    <div className="w-full min-h-[80px] border border-dashed border-gray-300 rounded-lg flex items-center justify-center mb-2 bg-gray-50 relative overflow-hidden">
                                        {sig?.trang_thai === 'da_ky' && sig?.profiles?.chu_ky_url ? (
                                            <img src={sig.profiles.chu_ky_url} alt="Chữ ký" className="max-h-20 max-w-full object-contain p-1"/>
                                        ) : (
                                            <span className="text-gray-300 text-xs italic">
                                                {sig?.trang_thai === 'cho_ky' ? 'Chờ ký...' : ''}
                                            </span>
                                        )}
                                    </div>
                                    {sig?.trang_thai === 'da_ky' ? (
                                        <div className="text-[10px] text-green-700 bg-green-50 border border-green-200 rounded px-2 py-1 leading-snug">
                                            <div className="font-bold">✓ Đã ký: {sig.profiles?.ho_ten}</div>
                                            <div className="text-gray-500">{sig.profiles?.email}</div>
                                            <div className="text-gray-500">{formatDT(sig.thoi_gian_ky)}</div>
                                        </div>
                                    ) : (
                                        <div className="font-bold text-xs">{name}</div>
                                    )}
                                </div>
                            );
                        };

                        return (
                            <div className="grid grid-cols-3 gap-4 mb-20">
                                {renderSigBox("ĐƠN VỊ CÔNG TÁC", formData.dvct_daiDien1, formData.dvct_userId1)}
                                {renderSigBox("ĐƠN VỊ QLVH", formData.qlvh_daiDien1, formData.qlvh_userId1)}
                                {renderSigBox("ĐƠN VỊ LIÊN QUAN KHÁC", "", null)}
                            </div>
                        );
                    })()}
                    
                    {/* Phần Chụp Ảnh Mới */}
                    <div className="mb-8 border-t-2 border-dashed pt-4 break-inside-avoid">
                        <div className="font-bold text-center mb-4 flex justify-between items-center px-4">
                            <span>HÌNH ẢNH KHẢO SÁT (Lưu nội bộ)</span>
                            <label className="camera-btn px-4 py-2 rounded-full cursor-pointer flex items-center gap-2 font-bold text-sm shadow-sm">
                                <UI_Icons.Plus size={18}/> Chụp/Tải Ảnh
                                <input type="file" accept="image/*" multiple capture="environment" className="hidden" onChange={handleImageUpload} />
                            </label>
                        </div>
                        {(!formData.hinh_anh || formData.hinh_anh.length === 0) ? (
                            <div className="text-center text-gray-400 italic py-4 bg-gray-50 rounded border border-gray-200">Chưa có hình ảnh nào.</div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {formData.hinh_anh.map((url, index) => (
                                    <div key={index} className="relative group aspect-square bg-gray-100 rounded-lg overflow-hidden border border-gray-300 shadow-sm cursor-zoom-in" onClick={() => setZoomImage(url)}>
                                        <img src={url} alt={`Ảnh ${index+1}`} className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
                                        {/* Nút xóa (cần stopPropagation để không bị kích hoạt zoom khi bấm xóa) */}
                                        <button onClick={(e) => { e.stopPropagation(); removeImage(index); }} className="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-80 hover:opacity-100 shadow-md transition-opacity"><UI_Icons.X size={14}/></button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="border-t-2 border-dashed pt-4 mt-8 break-inside-avoid"><div className="font-bold text-center mb-4">SƠ ĐỒ MỘT SỢI KẾT NỐI THIẾT BỊ, LƯỚI ĐIỆN NƠI LÀM VIỆC</div><div className="relative w-full h-80 bg-gray-50 border border-gray-300 rounded-lg overflow-hidden group">{diagramData.length > 0 ?
                    (<DiagramPreview objects={diagramData} />) : (<div className="absolute inset-0 flex flex-col items-center justify-center text-gray-400"><UI_Icons.Share2 size={48} className="mb-2"/><span>(Chưa có sơ đồ)</span></div>)}<div className="absolute inset-0 bg-black/5 group-hover:bg-black/10 transition-colors flex items-center justify-center opacity-0 group-hover:opacity-100"><button onClick={() => setShowDiagram(true)} className="bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg font-bold hover:bg-blue-700 transform hover:scale-105 transition-all flex items-center gap-2"><UI_Icons.FileText size={18}/> {diagramData.length > 0 ? "Chỉnh Sửa Sơ Đồ" : "Mở Trình Vẽ Sơ Đồ"}</button></div>{diagramData.length === 0 && (<div className="absolute inset-0 flex items-center justify-center md:hidden pointer-events-none"><div className="mt-16 pointer-events-auto"><button onClick={() => setShowDiagram(true)} className="bg-blue-100 text-blue-600 px-4 py-2 rounded text-sm font-semibold hover:bg-blue-200">Mở Trình Vẽ Sơ Đồ</button></div></div>)}</div></div>
                </div>
                <div className="h-20"></div>
            </div>
            </ToastContext.Provider>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
