    window.onerror = function(msg, src, line) { 
    if(msg.includes("ResizeObserver")) return;
    const div = document.createElement('div');
    div.style.cssText = 'padding:20px;color:red;font-size:16px';
    div.innerHTML = '<h2>Lỗi hệ thống!</h2>';
    const p1 = document.createElement('p');
    p1.textContent = msg;        // textContent không parse HTML
    const p2 = document.createElement('p');
    p2.textContent = 'Dòng: ' + line;
    div.appendChild(p1);
    div.appendChild(p2);
    document.body.innerHTML = '';
    document.body.appendChild(div);
  };
</script>

    const DiagramEditor = ({ initialData, onSave, onClose }) => {
        const [objects, setObjects] = useState(initialData || []);
        const [selectedId, setSelectedId] = useState(null);
        const [showTemplateModal, setShowTemplateModal] = useState(false);
        const [templates, setTemplates] = useState([]);
        const [loadingTemplates, setLoadingTemplates] = useState(false);
        const [viewport, setViewport] = useState({ x: 0, y: 0, scale: 1 });
        const [isPanning, setIsPanning] = useState(false);
        const [lastPanPoint, setLastPanPoint] = useState({ x: 0, y: 0 });
        const [dragState, setDragState] = useState({ isDragging: false, draggedId: null, startX: 0, startY: 0, initialObj: null, type: 'move', handle: null });

        const fitToScreen = (items) => {
            if (!items || items.length === 0) {
                setViewport({ x: window.innerWidth / 2, y: window.innerHeight / 2, scale: 1 });
                return;
            }
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            items.forEach(obj => {
                if (obj.type === 'line' || obj.type === 'arrow' || obj.type === 'measure_bracket') {
                    minX = Math.min(minX, obj.x1, obj.x2); maxX = Math.max(maxX, obj.x1, obj.x2);
                    minY = Math.min(minY, obj.y1, obj.y2); maxY = Math.max(maxY, obj.y1, obj.y2);
                } else if (obj.type === 'rect_pvlv') {
                    minX = Math.min(minX, obj.x); maxX = Math.max(maxX, obj.x + obj.width);
                    minY = Math.min(minY, obj.y); maxY = Math.max(maxY, obj.y + obj.height);
                } else if (obj.type === 'bracket') {
                    const isRot = obj.rotate === 90;
                    minX = Math.min(minX, obj.x - 20); maxX = Math.max(maxX, obj.x + (isRot ? obj.height : 20));
                    minY = Math.min(minY, obj.y); maxY = Math.max(maxY, obj.y + (isRot ? 20 : obj.height));
                } else {
                    const x = obj.x !== undefined ? obj.x : obj.cx;
                    const y = obj.y !== undefined ? obj.y : obj.cy;
                    const size = 40; 
                    minX = Math.min(minX, x - size); maxX = Math.max(maxX, x + size);
                    minY = Math.min(minY, y - size); maxY = Math.max(maxY, y + size);
                }
            });
            const padding = 40; 
            const contentWidth = maxX - minX + padding * 2;
            const contentHeight = maxY - minY + padding * 2;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight - 100; 
            let newScale = Math.min(screenW / contentWidth, screenH / contentHeight);
            newScale = Math.min(newScale, 1.2); 
            newScale = Math.max(newScale, 0.3); 
            const contentCenterX = (minX + maxX) / 2;
            const contentCenterY = (minY + maxY) / 2;
            const newX = (screenW / 2) - (contentCenterX * newScale);
            const newY = (screenH / 2) - (contentCenterY * newScale);
            setViewport({ x: newX, y: newY, scale: newScale });
        };

        
        const fetchTemplates = async () => {
            setLoadingTemplates(true);
            let cloudTemplates = [];
            try { 
                const { data, error } = await supabase.from('diagram_templates').select('*').order('created_at', { ascending: false });
                if (!error && data) cloudTemplates = data; 
            } catch(e) {}
            setTemplates(cloudTemplates);
            setLoadingTemplates(false);
        };

        const handleSaveTemplate = async () => {
            const name = prompt("Nhập tên mẫu để lưu:");
            if (!name) return;
            const newTplData = { name: name, data: objects };
            try {
                const { error } = await supabase.from('diagram_templates').insert([newTplData]);
                if (error) throw error;
                alert("Đã lưu mẫu thành công!"); fetchTemplates();
            } catch (e) { alert("Lỗi lưu mẫu: " + e.message); }
        };

        const handleDeleteTemplate = async (id, e) => {
            e.stopPropagation(); if(!confirm("Bạn có chắc muốn xóa mẫu này?")) return;
            await supabase.from('diagram_templates').delete().eq('id', id); fetchTemplates(); 
        };
        
        const handleLoadTemplate = (tpl) => { 
            if(confirm(`Dùng mẫu "${tpl.name}"?`)) { setObjects(tpl.data); setShowTemplateModal(false); setTimeout(() => fitToScreen(tpl.data), 50); } 
        };

        const openTemplateModal = () => { setShowTemplateModal(true); fetchTemplates(); };
        const screenToWorld = (screenX, screenY) => ({ x: (screenX - viewport.x) / viewport.scale, y: (screenY - viewport.y) / viewport.scale });
        
        const handlePointerDown = (e) => {
            if (e.target.closest('button')) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            if (e.touches && e.touches.length > 1) return;
            const targetIsObject = e.target.getAttribute('data-type') === 'object';
            if (targetIsObject) {
                e.stopPropagation(); const worldPos = screenToWorld(clientX, clientY); const objId = e.target.getAttribute('data-id'); const handleType = e.target.getAttribute('data-handle'); const obj = objects.find(o => o.id === objId);
                if (obj) { setSelectedId(objId); setDragState({ isDragging: true, draggedId: objId, startX: worldPos.x, startY: worldPos.y, initialObj: { ...obj }, type: handleType ? 'resize' : 'move', handle: handleType }); }
            } else { setIsPanning(true); setLastPanPoint({ x: clientX, y: clientY }); setSelectedId(null); }
        };

        const handlePointerMove = (e) => {
            e.preventDefault(); const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            if (e.touches && e.touches.length > 1) { setLastPanPoint({ x: clientX, y: clientY }); return; }
            if (isPanning) { const dx = clientX - lastPanPoint.x; const dy = clientY - lastPanPoint.y; setViewport(prev => ({ ...prev, x: prev.x + dx, y: prev.y + dy })); setLastPanPoint({ x: clientX, y: clientY }); return; }
            if (dragState.isDragging) {
                const worldPos = screenToWorld(clientX, clientY); const dx = worldPos.x - dragState.startX; const dy = worldPos.y - dragState.startY; const init = dragState.initialObj;
                setObjects(prev => prev.map(obj => { 
                    if (obj.id !== dragState.draggedId) return obj;
                    if (dragState.type === 'resize') { 
                        if (obj.type === 'rect_pvlv') { const newW = snapToGrid(init.width + (dragState.handle === 'se' ? dx : 0)); const newH = snapToGrid(init.height + (dragState.handle === 'se' ? dy : 0)); return { ...obj, width: Math.max(20, newW), height: Math.max(20, newH) }; } 
                        if (obj.type === 'bracket') { const isRot = obj.rotate === 90; const delta = isRot ? dx : dy; const newH = snapToGrid(init.height + (dragState.handle === 'se' ? delta : 0)); return { ...obj, height: Math.max(40, newH) }; }
                        if (obj.type === 'line' || obj.type === 'measure_bracket' || obj.type === 'arrow') { if (dragState.handle === 'start') return { ...obj, x1: snapToGrid(init.x1 + dx), y1: snapToGrid(init.y1 + dy) }; if (dragState.handle === 'end') return { ...obj, x2: snapToGrid(init.x2 + dx), y2: snapToGrid(init.y2 + dy) }; } 
                        return obj; 
                    }
                    if (obj.type === 'line' || obj.type === 'measure_bracket' || obj.type === 'arrow') return { ...obj, x1: snapToGrid(init.x1 + dx), y1: snapToGrid(init.y1 + dy), x2: snapToGrid(init.x2 + dx), y2: snapToGrid(init.y2 + dy) }; else if (obj.type === 'circle') return { ...obj, cx: snapToGrid(init.cx + dx), cy: snapToGrid(init.cy + dy) }; else return { ...obj, x: snapToGrid(init.x + dx), y: snapToGrid(init.y + dy) };
                }));
            }
        };
        const handlePointerUp = () => { setIsPanning(false); setDragState({ ...dragState, isDragging: false }); };
        const addObjectToCenter = (newObj) => { const centerX = (window.innerWidth / 2 - viewport.x) / viewport.scale; const centerY = (window.innerHeight / 2 - viewport.y) / viewport.scale; let updatedObj = { ...newObj }; const cx = snapToGrid(centerX); const cy = snapToGrid(centerY); if (newObj.type === 'line' || newObj.type === 'arrow') { updatedObj.x1 = cx - 60; updatedObj.y1 = cy; updatedObj.x2 = cx + 60; updatedObj.y2 = cy; } else if (newObj.type === 'circle') { updatedObj.cx = cx; updatedObj.cy = cy; } else { updatedObj.x = cx; updatedObj.y = cy; } setObjects([...objects, updatedObj]); setSelectedId(updatedObj.id); };
        
        return (
            <div className="fixed inset-0 z-[100] bg-gray-200 flex flex-col h-full w-full" style={{touchAction: 'none'}}>
                {showTemplateModal && (<div className="fixed inset-0 bg-black/50 z-[110] flex items-center justify-center p-4" onClick={() => setShowTemplateModal(false)}><div className="bg-white rounded-lg w-full max-w-md shadow-xl flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}><div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-lg"><h3 className="font-bold text-lg flex items-center gap-2"><UI_Icons.FolderOpen /> Danh sách Mẫu</h3><button onClick={() => setShowTemplateModal(false)} className="p-1 hover:bg-gray-200 rounded"><UI_Icons.X /></button></div><div className="p-4 border-b bg-blue-50"><button onClick={handleSaveTemplate} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded flex items-center justify-center gap-2"><UI_Icons.Save /> Lưu sơ đồ hiện tại thành Mẫu mới</button></div><div className="overflow-y-auto p-4 space-y-2 flex-1">{loadingTemplates ? <div className="text-center text-gray-500">Đang tải...</div> : (templates.length === 0 ? <div className="text-center text-gray-400 italic">Chưa có mẫu nào</div> : templates.map(t => (<div key={t.id} onClick={() => handleLoadTemplate(t)} className="flex items-center justify-between p-3 border rounded hover:bg-gray-100 cursor-pointer group transition-colors"><span className="font-medium text-gray-800">{t.name}</span><button onClick={(e) => handleDeleteTemplate(t.id, e)} className="text-gray-400 hover:text-red-600 p-1"><UI_Icons.Trash2 /></button></div>)))}</div><div className="p-3 border-t bg-gray-50 flex justify-end"><button onClick={() => setShowTemplateModal(false)} className="px-4 py-2 bg-white border border-gray-300 rounded hover:bg-gray-100 text-sm font-medium">Đóng</button></div></div></div>)}
                <div className="bg-blue-600 text-white p-3 shadow-md flex justify-between items-center z-10 shrink-0"><h1 className="text-sm font-bold uppercase flex items-center gap-2"><UI_Icons.Grid /> Trình Vẽ Sơ Đồ</h1><button onClick={openTemplateModal} className="bg-yellow-400 hover:bg-yellow-500 text-blue-900 px-3 py-1.5 rounded flex items-center gap-1 shadow font-bold text-xs"><UI_Icons.FolderOpen /> 📂 Mẫu Sơ Đồ</button><div className="flex gap-2"><button onClick={onClose} className="text-xs bg-white text-gray-700 hover:bg-gray-100 px-3 py-1.5 rounded flex items-center gap-1 shadow font-bold">Thoát</button><button onClick={() => { onSave(objects); onClose(); }} className="text-xs bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded flex items-center gap-1 shadow font-bold"><UI_Icons.Save /> Lưu</button></div></div>
                <div className="bg-white border-b p-2 flex gap-2 overflow-x-auto no-scrollbar shadow-sm shrink-0 items-center z-10">
                    <div className="flex gap-1 border-r pr-2 shrink-0">
                        <button onClick={() => addObjectToCenter({ id: `l_${Date.now()}`, type: 'line', strokeWidth: 2, dash: false })} className={TOOL_BTN_CLASS}><UI_Icons.Minus /> <span className="text-[9px] mt-1 font-semibold">Dây</span></button>
                        <button onClick={() => addObjectToCenter({ id: `a_${Date.now()}`, type: 'arrow', strokeWidth: 2, dash: false })} className={TOOL_BTN_CLASS}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>
                            <span className="text-[9px] mt-1 font-semibold">Mũi tên</span>
                        </button>
                        <button onClick={() => addObjectToCenter({ id: `j_${Date.now()}`, type: 'circle', r: 4, fill: 'black' })} className={TOOL_BTN_CLASS}><div className="w-3 h-3 bg-black rounded-full mb-1"></div> <span className="text-[9px] mt-1 font-semibold">Nút</span></button>
                    </div>
                    <div className="flex gap-1 border-r pr-2 shrink-0">
                        <button onClick={() => addObjectToCenter({ id: `d_${Date.now()}`, type: 'icon_device', subType: 'FCO', label: "03FCO" })} className={TOOL_BTN_CLASS}><UI_Icons.Zap /> <span className="text-[9px] mt-1 font-semibold">FCO</span></button>
                        <button onClick={() => addObjectToCenter({ id: `d_${Date.now()}`, type: 'icon_device', subType: 'LBFCO', label: "03LBFCO" })} className={TOOL_BTN_CLASS}><UI_Icons.ZapFill /> <span className="text-[9px] mt-1 font-semibold">LBFCO</span></button>
                        <button onClick={() => addObjectToCenter({ id: `d_${Date.now()}`, type: 'icon_device', subType: 'DS', label: "03DS" })} className={TOOL_BTN_CLASS}>
                            <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/><line x1="8" y1="12" x2="14" y2="6"/></svg>
                            <span className="text-[9px] mt-1 font-semibold">DS</span>
                        </button>
                        <button onClick={() => addObjectToCenter({ id: `d_${Date.now()}`, type: 'icon_device', subType: 'Recloser', label: "Recloser" })} className={TOOL_BTN_CLASS}>

                        <button onClick={() => addObjectToCenter({ id: `d_${Date.now()}`, type: 'icon_device', subType: 'LBS', label: "LBS" })} className={TOOL_BTN_CLASS}>

                            <span className="text-[9px] mt-1 font-semibold">LBS</span>
                        </button>
                    </div>
                    <div className="flex gap-1 border-r pr-2 shrink-0"><button onClick={() => addObjectToCenter({ id: `ld_${Date.now()}`, type: 'icon_load', subType: 'TBA', label: "TBA..." })} className={TOOL_BTN_CLASS}><div className="text-[10px] font-bold border border-gray-600 rounded px-1 mb-1">TBA</div> <span className="text-[9px] font-semibold">MBA</span></button><button onClick={() => addObjectToCenter({ id: `g_${Date.now()}`, type: 'icon_ground', direction: 'left' })} className={TOOL_BTN_CLASS}><svg width="14" height="14" viewBox="0 0 16 16" className="mb-1"><line x1="2" y1="2" x2="14" y2="14" stroke="black"/><circle cx="2" cy="2" r="1.5"/></svg><span className="text-[9px] font-semibold">TĐ(T)</span></button><button onClick={() => addObjectToCenter({ id: `g_${Date.now()}`, type: 'icon_ground', direction: 'right' })} className={TOOL_BTN_CLASS}><svg width="14" height="14" viewBox="0 0 16 16" className="mb-1"><line x1="14" y1="2" x2="2" y2="14" stroke="black"/><circle cx="14" cy="2" r="1.5"/></svg><span className="text-[9px] font-semibold">TĐ(P)</span></button><button onClick={() => addObjectToCenter({ id: `glv_${Date.now()}`, type: 'icon_ground_lv', direction: 'left' })} className={TOOL_BTN_CLASS}><svg width="14" height="14" viewBox="0 0 16 16" className="mb-1"><circle cx="12" cy="2" r="1.5" fill="black"/><line x1="12" y1="2" x2="6" y2="8" stroke="black" strokeWidth="1.5"/><line x1="2" y1="8" x2="10" y2="8" stroke="black" strokeWidth="1.5"/><line x1="4" y1="11" x2="8" y2="11" stroke="black" strokeWidth="1.5"/></svg><span className="text-[9px] font-semibold">HT(T)</span></button><button onClick={() => addObjectToCenter({ id: `glv_${Date.now()}`, type: 'icon_ground_lv', direction: 'right' })} className={TOOL_BTN_CLASS}><svg width="14" height="14" viewBox="0 0 16 16" className="mb-1"><circle cx="2" cy="2" r="1.5" fill="black"/><line x1="2" y1="2" x2="8" y2="8" stroke="black" strokeWidth="1.5"/><line x1="4" y1="8" x2="12" y2="8" stroke="black" strokeWidth="1.5"/><line x1="6" y1="11" x2="10" y2="11" stroke="black" strokeWidth="1.5"/></svg><span className="text-[9px] font-semibold">HT(P)</span></button></div>

                    <div className="flex gap-1 shrink-0">
                        <button onClick={() => addObjectToCenter({ id: `p_${Date.now()}`, type: 'rect_pvlv', width: 120, height: 100 })} className={TOOL_BTN_CLASS}><UI_Icons.Square className="text-red-500" strokeWidth="2" strokeDasharray="2 2" /> <span className="text-[9px] mt-1 font-semibold">PVLV</span></button>
                        <button onClick={() => {
                            const cx = snapToGrid((window.innerWidth / 2 - viewport.x) / viewport.scale);
                            const cy = snapToGrid((window.innerHeight / 2 - viewport.y) / viewport.scale);
                            setObjects([...objects, { id: `mb_${Date.now()}`, type: 'measure_bracket', x1: cx - 60, y1: cy, x2: cx + 60, y2: cy, text: "Ghi chú khoảng...", dash: false, rotate: 0 }]);
                        }} className={TOOL_BTN_CLASS}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="1.5"><path d="M4 14 Q4 10 8 10 L10 10 Q12 10 12 6 Q12 10 14 10 L16 10 Q20 10 20 14" /><text x="12" y="5" textAnchor="middle" fontSize="6" fill="#2563eb" stroke="none">T</text></svg>
                            <span className="text-[9px] mt-1 font-semibold">Khoảng</span>
                        </button>
                        <button onClick={() => addObjectToCenter({ id: `t_${Date.now()}`, type: 'text', text: "Ghi chú...", fontSize: 14, rotate: 0 })} className={TOOL_BTN_CLASS}><UI_Icons.Type /> <span className="text-[9px] mt-1 font-semibold">Chữ</span></button>
                    </div>

                </div>
                <div className="flex-1 overflow-hidden relative cursor-grab active:cursor-grabbing" onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} style={{ cursor: isPanning ? 'grabbing' : 'default' }} translate="no">
                    <svg width="100%" height="100%" style={{ backgroundColor: 'white', userSelect: 'none', WebkitUserSelect: 'none', WebkitTouchCallout: 'none' }}>
                        <defs>
                            <pattern id="grid" width={GRID_SIZE} height={GRID_SIZE} patternUnits="userSpaceOnUse" patternTransform={`translate(${viewport.x} ${viewport.y}) scale(${viewport.scale})`}>
                                <path d={`M ${GRID_SIZE} 0 L 0 0 0 ${GRID_SIZE}`} fill="none" stroke={COLORS.grid} strokeWidth="0.5"/>
                            </pattern>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#grid)" />
                        <g transform={`translate(${viewport.x}, ${viewport.y}) scale(${viewport.scale})`}>
                            {objects.map(obj => {
                                const isSelected = obj.id === selectedId;

                                if (obj.type === 'line' || obj.type === 'arrow') {
                                    const angle = Math.atan2(obj.y2 - obj.y1, obj.x2 - obj.x1) * 180 / Math.PI;

                                            {isSelected && <circle cx={obj.x1} cy={obj.y1} r="8" fill={COLORS.highlight} fillOpacity="0.5" data-id={obj.id} data-type="object" data-handle="start" />}
                                            {isSelected && <circle cx={obj.x2} cy={obj.y2} r="8" fill={COLORS.highlight} fillOpacity="0.5" data-id={obj.id} data-type="object" data-handle="end" />}
                                        </g>
                                    ); 
                                }
                                
                                if (obj.type === 'measure_bracket') {
                                    const dx = obj.x2 - obj.x1;
                                    const dy = obj.y2 - obj.y1;
                                    const d = Math.sqrt(dx*dx + dy*dy);
                                    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                                    const r = Math.min(10, d / 4); 
                                    const pathD = `M 0 0 Q 0 -${r} ${r} -${r} L ${d/2 - r} -${r} Q ${d/2} -${r} ${d/2} -${r*2} Q ${d/2} -${r} ${d/2 + r} -${r} L ${d - r} -${r} Q ${d} -${r} ${d} 0`;
                                    
                                    const isRot = obj.rotate === 90;
                                    const flipText = angle > 90 || angle < -90; 
                                    const textRot = isRot ? -angle : (flipText ? 180 : 0);
                                    
                                    // Chỉnh lại khoảng cách chuẩn 1 ô ly (5px) + bù trừ vừa đúng một nửa chiều dài chữ
                                    const textLen = (obj.text || "").length;
                                    const verticalRatio = Math.abs(Math.sin(angle * Math.PI / 180));
                                    const yPos = isRot ? -(r*2 + 5 + verticalRatio * textLen * 2.7) : -(r*2 + 5);
                                    const transformStr = textRot ? `rotate(${textRot}, ${d/2}, ${yPos})` : "";
                                    
                                    const hitBoxY = Math.min(-35, yPos - 15);
                                    const hitBoxH = Math.max(50, Math.abs(yPos) + 30);

                                    return (
                                        <g key={obj.id} transform={`translate(${obj.x1}, ${obj.y1}) rotate(${angle})`} data-id={obj.id} data-type="object" style={{ cursor: 'pointer' }}>
                                            <rect x="0" y={hitBoxY} width={d} height={hitBoxH} fill="rgba(0,0,0,0)" data-id={obj.id} data-type="object"/>
                                            <path d={pathD} fill="none" stroke="#2563eb" strokeWidth="1.5" strokeDasharray={obj.dash ? "4 4" : "none"} pointerEvents="none" />

                                            {isSelected && (

                                                    <circle cx="0" cy="0" r="8" fill={COLORS.highlight} fillOpacity="0.5" pointerEvents="auto" data-id={obj.id} data-type="object" data-handle="start" />
                                                    <circle cx={d} cy="0" r="8" fill={COLORS.highlight} fillOpacity="0.5" pointerEvents="auto" data-id={obj.id} data-type="object" data-handle="end" />
                                                </g>
                                            )}
                                        </g>
                                    );
                                }

                                if (obj.type === 'circle') return (<circle key={obj.id} cx={obj.cx} cy={obj.cy} r={isSelected ? 6 : 4} fill={isSelected ? COLORS.highlight : "black"} data-id={obj.id} data-type="object" style={{ cursor: 'pointer' }} />); 
                                
                                if (obj.type === 'icon_device') {
                                    const isRot = obj.rotate === 90;
                                    return (
                                        <g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`} data-id={obj.id} data-type="object" style={{ cursor: 'pointer' }}>
                                            <rect x="-30" y="-30" width="60" height="60" fill="rgba(0,0,0,0)" data-id={obj.id} data-type="object"/>
                                            
                                            {['FCO', 'LBFCO'].includes(obj.subType) ? (
                                                <g stroke="black" strokeWidth="2" fill="none" data-id={obj.id} data-type="object">
                                                    <line x1="-14" y1="-14" x2="14" y2="14" data-id={obj.id} data-type="object"/>
                                                    <path d="M -14 -14 A 12.5 12.5 0 0 1 0 0" data-id={obj.id} data-type="object"/>
                                                    <path d="M 0 0 A 12.5 12.5 0 0 0 14 14" fill={obj.subType === 'LBFCO' ? "black" : "none"} data-id={obj.id} data-type="object"/>
                                                </g>
                                            ) : obj.subType === 'Recloser' ? (
                                                <g stroke="black" strokeWidth="2" data-id={obj.id} data-type="object">
                                                    <rect x={isRot ? -12 : -16} y={isRot ? -16 : -12} width={isRot ? 24 : 32} height={isRot ? 32 : 24} fill="white" data-id={obj.id} data-type="object"/>
                                                    <text x="0" y="5" textAnchor="middle" fontSize="14" fontWeight="bold" stroke="none" fill="black" data-id={obj.id} data-type="object">R</text>
                                                </g>
                                            ) : obj.subType === 'LBS' ? (
                                                <g stroke="black" strokeWidth="2" data-id={obj.id} data-type="object">
                                                    <circle cx="0" cy="0" r="14" fill="white" data-id={obj.id} data-type="object"/>
                                                    <text x="0" y="5" textAnchor="middle" fontSize="14" fontWeight="bold" stroke="none" fill="black" data-id={obj.id} data-type="object">L</text>
                                                </g>

                                                <circle cx="0" cy="0" r="2" fill="black" stroke="none" data-id={obj.id} data-type="object"/>
                                                <line x1="0" y1="0" x2={barX} y2={10} data-id={obj.id} data-type="object"/>
                                                <line x1={barX - 8} y1={10} x2={barX + 8} y2={10} data-id={obj.id} data-type="object"/>
                                                <line x1={barX - 5} y1={barY + 3} x2={barX + 5} y2={13} data-id={obj.id} data-type="object"/>
                                                <line x1={barX - 2} y1={barY + 6} x2={barX + 2} y2={16} data-id={obj.id} data-type="object"/>

                                if (obj.type === 'text') return (<text key={obj.id} x={obj.x} y={obj.y} fontSize={obj.fontSize} fill={isSelected ? COLORS.highlight : "black"} transform={`rotate(${obj.rotate || 0}, ${obj.x}, ${obj.y})`} style={{fontWeight: isSelected ? 'bold' : 'normal', cursor: 'pointer'}} data-id={obj.id} data-type="object">{obj.text}</text>); 
                                if (obj.type === 'rect_pvlv') return <g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`} data-id={obj.id} data-type="object" style={{ cursor: 'pointer' }}><rect width={obj.width} height={obj.height} fill="rgba(239, 68, 68, 0.05)" stroke={COLORS.pvlv} strokeWidth="2" strokeDasharray="5 5" data-id={obj.id} data-type="object"/><text x="5" y="15" fill={COLORS.pvlv} fontSize="10" fontWeight="bold" pointerEvents="none">PVLV</text>{isSelected && <rect x={obj.width - 20} y={obj.height - 20} width="20" height="20" fill="white" stroke={COLORS.highlight} strokeWidth="2" data-id={obj.id} data-type="object" data-handle="se" style={{ cursor: 'nwse-resize' }} />}</g>; 
                                
                                if (obj.type === 'bracket') {
                                    const h = obj.height || 100;

                                    return (
                                        <g key={obj.id} transform={`translate(${obj.x}, ${obj.y}) rotate(${obj.rotate || 0}, 0, ${h/2})`} data-id={obj.id} data-type="object" style={{ cursor: 'pointer' }}>
                                            <rect x="-20" y="-10" width="40" height={h + 20} fill="rgba(0,0,0,0)" data-id={obj.id} data-type="object"/>
                                            <path d={`M -10 0 Q 0 0 0 10 L 0 ${h/2 - 10} Q 0 ${h/2} 10 ${h/2} Q 0 ${h/2} 0 ${h/2 + 10} L 0 ${h - 10} Q 0 ${h} -10 ${h}`} fill="none" stroke="#6b7280" strokeWidth="1.5" strokeDasharray="4 4" pointerEvents="none" />
                                            {isSelected && (
                                                <g pointerEvents="none">
                                                    <rect x="-20" y="-10" width="40" height={h + 20} fill="none" stroke={COLORS.highlight} strokeWidth="1" strokeDasharray="2 2" />
                                                    <rect x="-5" y={h - 5} width="10" height="10" fill="white" stroke={COLORS.highlight} strokeWidth="2" data-id={obj.id} data-type="object" data-handle="se" style={{ cursor: isRot ? 'ew-resize' : 'ns-resize', pointerEvents: 'auto' }} />

                    </svg>
                    <div className="absolute top-4 right-4 flex flex-col gap-3">
                        <button onClick={() => fitToScreen(objects)} className="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-gray-700 active:bg-gray-100" title="Về giữa"><UI_Icons.Target/></button>
                        <button onClick={() => setViewport(prev => ({ ...prev, scale: Math.min(prev.scale * 1.2, 3) }))} className="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-gray-700 active:bg-gray-100"><UI_Icons.ZoomIn/></button>
                        <button onClick={() => setViewport(prev => ({ ...prev, scale: Math.max(prev.scale / 1.2, 0.5) }))} className="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-gray-700 active:bg-gray-100"><UI_Icons.ZoomOut/></button>
                    </div>
                </div>
                {selectedId && (
                    <div className="fixed bottom-24 md:bottom-8 left-1/2 transform -translate-x-1/2 bg-white px-4 py-3 rounded-full shadow-2xl border border-gray-200 flex items-center gap-3 animate-slide-up z-50 overflow-x-auto max-w-[95%] no-scrollbar" style={{ userSelect: 'none', WebkitUserSelect: 'none', WebkitTouchCallout: 'none' }} translate="no">
                        {['text', 'icon_device', 'icon_load', 'measure_bracket'].includes(objects.find(o => o.id === selectedId)?.type) && (<button onClick={() => { const obj = objects.find(o => o.id === selectedId); const next = prompt("Nhập nội dung mới:", (obj.type === 'text' || obj.type === 'measure_bracket') ? obj.text : obj.label); if (next !== null) setObjects(prev => prev.map(o => o.id === selectedId ? ((o.type === 'text' || o.type === 'measure_bracket') ? { ...o, text: next } : { ...o, label: next }) : o)); }} className={ACTION_BTN_CLASS + " text-orange-600 border-orange-200"}><UI_Icons.Edit/> Sửa</button>)}
                        
                        {(() => {

                            const canRotate = selObj.type === 'text' || selObj.type === 'line' || selObj.type === 'arrow' || ['DS', 'LBS', 'Recloser'].includes(selObj.subType) || selObj.type === 'measure_bracket';

                                    if (o.id !== selectedId) return o;

                                        return { ...o, x1: snapToGrid(mx-dy), y1: snapToGrid(my+dx), x2: snapToGrid(mx+dy), y2: snapToGrid(my-dx) }; 
                                    }
