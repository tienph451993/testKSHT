    const DiagramPreview = ({ objects }) => {
        if (!objects || objects.length === 0) return null;
        const xs = objects.map(o => o.x || o.cx || o.x1); const ys = objects.map(o => o.y || o.cy || o.y1);
        const minX = Math.min(...xs) - 50; const maxX = Math.max(...xs) + 50; const minY = Math.min(...ys) - 50;
        const maxY = Math.max(...ys) + 50; const width = maxX - minX; const height = maxY - minY;
        
        return (
            <svg width="100%" height="100%" viewBox={`${minX} ${minY} ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
                 {objects.map(obj => {
                    if (obj.type === 'line' || obj.type === 'arrow') {
                        const angle = Math.atan2(obj.y2 - obj.y1, obj.x2 - obj.x1) * 180 / Math.PI;
                        return (
                            <g key={obj.id}>
                                <line x1={obj.x1} y1={obj.y1} x2={obj.x2} y2={obj.y2} stroke="black" strokeWidth={obj.strokeWidth} strokeDasharray={obj.dash ? "5,5" : "none"} />
                                {obj.type === 'arrow' && (
                                    <polygon points="0,0 -12,-5 -12,5" fill="black" transform={`translate(${obj.x2}, ${obj.y2}) rotate(${angle})`} />
                                )}
                            </g>
                        );
                    }

                    if (obj.type === 'circle') return <circle key={obj.id} cx={obj.cx} cy={obj.cy} r={4} fill="black" />;
                    
                    if (obj.type === 'measure_bracket') {
                        const dx = obj.x2 - obj.x1;
                        const dy = obj.y2 - obj.y1;
                        const d = Math.sqrt(dx*dx + dy*dy);
                        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                        const r = Math.min(10, d / 4);
                        const pathD = `M 0 0 Q 0 -${r} ${r} -${r} L ${d/2 - r} -${r} Q ${d/2} -${r} ${d/2} -${r*2} Q ${d/2} -${r} ${d/2 + r} -${r} L ${d - r} -${r} Q ${d} -${r} ${d} 0`;
                        
                        const isRot = obj.rotate === 90;
                        const flipText = angle > 90 || angle < -90;
                        const textRot = isRot ? -angle : (flipText ? 180 : 0);
                        
                        const textLen = (obj.text || "").length;
                        const verticalRatio = Math.abs(Math.sin(angle * Math.PI / 180));
                        const yPos = isRot ? -(r*2 + 5 + verticalRatio * textLen * 2.7) : -(r*2 + 5);
                        const transformStr = textRot ? `rotate(${textRot}, ${d/2}, ${yPos})` : "";

                        return (
                            <g key={obj.id} transform={`translate(${obj.x1}, ${obj.y1}) rotate(${angle})`}>
                                <path d={pathD} fill="none" stroke="#2563eb" strokeWidth="1.5" strokeDasharray={obj.dash ? "4 4" : "none"} />
                                <text x={d/2} y={yPos} textAnchor="middle" fontSize="12" fill="#1e3a8a" fontWeight="bold" transform={transformStr}>{obj.text}</text>
                            </g>
                        );
                    }

                    if (obj.type === 'icon_device') {
                        const isRot = obj.rotate === 90;
                        return (
                            <g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`}>
                                {['FCO', 'LBFCO'].includes(obj.subType) ? (
                                    <g stroke="black" strokeWidth="2" fill="none">
                                        <line x1="-14" y1="-14" x2="14" y2="14"/>
                                        <path d="M -14 -14 A 12.5 12.5 0 0 1 0 0"/>
                                        <path d="M 0 0 A 12.5 12.5 0 0 0 14 14" fill={obj.subType === 'LBFCO' ? "black" : "none"} />
                                    </g>
                                ) : obj.subType === 'Recloser' ? (
                                    <g stroke="black" strokeWidth="2">
                                        <rect x={isRot ? -12 : -16} y={isRot ? -16 : -12} width={isRot ? 24 : 32} height={isRot ? 32 : 24} fill="white"/>
                                        <text x="0" y="5" textAnchor="middle" fontSize="14" fontWeight="bold" stroke="none" fill="black">R</text>
                                    </g>
                                ) : obj.subType === 'LBS' ? (
                                    <g stroke="black" strokeWidth="2">
                                        <circle cx="0" cy="0" r="14" fill="white"/>
                                        <text x="0" y="5" textAnchor="middle" fontSize="14" fontWeight="bold" stroke="none" fill="black">L</text>
                                    </g>
                                ) : obj.subType === 'DS' ? (
                                    <g stroke="black" strokeWidth="2" fill="none">
                                        <line x1={isRot ? 0 : -26} y1={isRot ? -26 : 0} x2={isRot ? 0 : -10} y2={isRot ? -10 : 0}/>
                                        <line x1={isRot ? 0 : 10} y1={isRot ? 10 : 0} x2={isRot ? 0 : 26} y2={isRot ? 26 : 0}/>
                                        <line x1={isRot ? 0 : -10} y1={isRot ? -10 : 0} x2={isRot ? 13 : 8} y2={isRot ? 8 : -13}/>
                                    </g>
                                ) : (
                                    <g stroke="black" strokeWidth="2">
                                        <rect x="-15" y="-15" width="30" height="30" fill="white"/>
                                        <line x1="-15" y1="-15" x2="15" y2="15"/>
                                        <line x1="15" y1="-15" x2="-15" y2="15"/>
                                    </g>
                                )}
                                {['DS', 'LBS', 'Recloser'].includes(obj.subType) ? (
                                    <text x={isRot ? 18 : 0} y={isRot ? 4 : -22} textAnchor={isRot ? "start" : "middle"} fontSize="12" fontWeight="bold">{obj.label}</text>
                                ) : (
                                    <text x="18" y="4" fontSize="12" fontWeight="bold">{obj.label}</text>
                                )}
                            </g>
                        );
                    }

                    if (obj.type === 'icon_load') return (
                        <g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`}>
                            {obj.subType === 'TBA' ? (
                                <g stroke="black" strokeWidth="2" fill="none">
                                    <circle cx="0" cy="0" r="13.5" fill="white"/>
                                    <polygon points="0,-13.5 11.68,6.75 -11.68,6.75"/>
                                </g>
                            ) : (
                                <rect x="-15" y="-20" width="30" height="40" fill="white" stroke="black" strokeWidth="2"/>
                            )}
                            <text x="18" y="4" fontSize="12" fontWeight="bold">{obj.label}</text>
                        </g>
                    );

                    if (obj.type === 'icon_ground') {
                        const dx = obj.direction === 'left' ? -20 : 20;
                        return (
                            <g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`}>
                                <line x1={dx} y1={-20} x2="0" y2="0" stroke="black" strokeWidth="2"/>
                                <circle cx={dx} cy={-20} r="3" fill="black"/>
                                <line x1="-15" y1="0" x2="15" y2="0" stroke="black" strokeWidth="2"/>
                                <line x1="-10" y1="4" x2="10" y2="4" stroke="black" strokeWidth="2"/>
                                <line x1="-5" y1="8" x2="5" y2="8" stroke="black" strokeWidth="2"/>
                            </g>
                        );
                    }
                    if (obj.type === 'icon_ground_lv') {
                        const isLeft = obj.direction === 'left';
                        const barX = isLeft ? -10 : 10;
                        return (
                            <g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`} stroke="black" strokeWidth="1.5">
                                <circle cx="0" cy="0" r="2" fill="black" stroke="none"/>
                                <line x1="0" y1="0" x2={barX} y2={10}/>
                                <line x1={barX-8} y1={10} x2={barX+8} y2={10}/>
                                <line x1={barX-5} y1={13} x2={barX+5} y2={13}/>
                                <line x1={barX-2} y1={16} x2={barX+2} y2={16}/>
                            </g>
                        );
                    }
                    if (obj.type === 'text') return <text key={obj.id} x={obj.x} y={obj.y} fontSize={obj.fontSize} fill="black" transform={`rotate(${obj.rotate||0}, ${obj.x}, ${obj.y})`}>{obj.text}</text>;
                    if (obj.type === 'rect_pvlv') return <g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`}><rect width={obj.width} height={obj.height} fill="rgba(239, 68, 68, 0.05)" stroke={COLORS.pvlv} strokeWidth="2" strokeDasharray="5 5"/><text x="5" y="15" fill={COLORS.pvlv} fontSize="10" fontWeight="bold">PVLV</text></g>;
                    
                    if (obj.type === 'bracket') {
                        const h = obj.height || 100;
                        return (
                            <g key={obj.id} transform={`translate(${obj.x}, ${obj.y}) rotate(${obj.rotate || 0}, 0, ${h/2})`}>
                                <path d={`M -10 0 Q 0 0 0 10 L 0 ${h/2 - 10} Q 0 ${h/2} 10 ${h/2} Q 0 ${h/2} 0 ${h/2 + 10} L 0 ${h - 10} Q 0 ${h} -10 ${h}`} fill="none" stroke="#6b7280" strokeWidth="1.5" strokeDasharray="4 4" />
                            </g>
                        );
                    }
                    return null;
                })}
            </svg>
        );
    };



    const TimeSelect = ({ value, onChange }) => {
        const [hour, minute] = value ? value.split(':') : ['07', '00'];
        const hours = Array.from({length: 24}, (_, i) => i.toString().padStart(2, '0'));
        const minutes = Array.from({length: 60}, (_, i) => i.toString().padStart(2, '0'));
        const handleChange = (type, val) => {
            let newH = hour, newM = minute;
            if (type === 'h') newH = val;
            if (type === 'm') newM = val;
            onChange(`${newH}:${newM}`);
        };
        return (
            <div className="inline-flex items-center border-b-2 border-gray-300 hover:border-blue-500 bg-transparent gap-0 transition-colors">
                <select value={hour} onChange={(e) => handleChange('h', e.target.value)} className="appearance-none bg-transparent font-bold text-center outline-none cursor-pointer p-1 text-gray-800 hover:bg-gray-100 rounded">
                    {hours.map(h => <option key={h} value={h}>{h}</option>)}
                </select>
                <span className="font-bold px-0.5">:</span>
                <select value={minute} onChange={(e) => handleChange('m', e.target.value)} className="appearance-none bg-transparent font-bold text-center outline-none cursor-pointer p-1 text-gray-800 hover:bg-gray-100 rounded">
                    {minutes.map(m => <option key={m} value={m}>{m}</option>)}
                </select>
            </div>
        );
    };

    const QuickInputSection = ({ title, value, onChange, templates, placeholder, contextData }) => {
        // 1. Tạo tham chiếu để tương tác với thanh cuộn
        const scrollRef = useRef(null);

        // 2. Thêm sự kiện: Khi lăn chuột tại vùng này -> chuyển thành lăn ngang
        useEffect(() => {
            const el = scrollRef.current;
            if (el) {
                const onWheel = (e) => {
                    if (e.deltaY === 0) return;
                    e.preventDefault();
                    el.scrollLeft += e.deltaY; 
                };
                el.addEventListener('wheel', onWheel, { passive: false });
                return () => el.removeEventListener('wheel', onWheel);
            }
        }, []);

        const addTemplate = (templateObj) => {
            // Logic lấy nội dung từ object mẫu
            let textToAdd = templateObj.content || templateObj; // Hỗ trợ cả object cũ và mới

            if (contextData) {
                const fullPoleCode = `${contextData.code}${contextData.sub ? "/" + contextData.sub : ""}`;
                const mainPoleCode = contextData.code || "...";
                
                textToAdd = textToAdd
                    .replace(/{tru_chinh}/g, mainPoleCode)
                    .replace(/{tru}/g, fullPoleCode)
                    .replace(/{tuyen}/g, contextData.line || "...");
            }
            
            // Logic nối chuỗi: Nếu inline=true thì dùng dấu phẩy, ngược lại xuống dòng
            const separator = templateObj.inline ? " " : "\n";
            const newValue = value ? value + separator + textToAdd : textToAdd;
            
            onChange(newValue);
        };

        return (
            <div className="mb-4">
                <label className="section-title block text-gray-800">{title}</label>
                <div ref={scrollRef} className="flex gap-2 overflow-x-auto no-scrollbar mb-2 pb-1 cursor-grab active:cursor-grabbing">
                    {templates.map((t, i) => (
                        <button key={i} onClick={() => addTemplate(t)} className="tag-btn flex-shrink-0">
                            <UI_Icons.Plus size={12}/> {t.label}
                        </button>
                    ))}
                    <button onClick={() => onChange("")} className="tag-btn flex-shrink-0 bg-red-50 text-red-600 border-red-200">Xóa</button>
                </div>
                <textarea className="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" rows="4" value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}></textarea>
            </div>
        );
    }; // <--- BẠN HAY BỊ THIẾU DẤU NÀY

    // --- MODAL XEM ẢNH (QUẢN LÝ) ---
    const ImageGalleryModal = ({ images, onClose, onZoom }) => {
        if (!images) return null;
        return (
            <div className="fixed inset-0 z-[10000] bg-black/90 flex flex-col" onClick={onClose}>
                <div className="p-4 flex justify-between items-center text-white shrink-0 bg-black/50 backdrop-blur-sm">
                    <h3 className="font-bold text-lg flex items-center gap-2"><UI_Icons.Share2/> Hình ảnh hiện trường ({images.length})</h3>
                    <button onClick={onClose} className="p-2 bg-white/20 rounded-full hover:bg-white/30 transition-colors"><UI_Icons.X/></button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4 content-start">
                    {images.length === 0 ? (
                        <div className="col-span-full text-center text-gray-500 mt-20 flex flex-col items-center">
                            <UI_Icons.Share2 size={48} className="mb-2 opacity-50"/>
                            <span>Không có hình ảnh nào</span>
                        </div>
                    ) : (
                        images.map((url, i) => (
                            <div key={i} className="relative rounded-lg overflow-hidden border border-gray-700 aspect-square group cursor-pointer" onClick={(e) => { e.stopPropagation(); onZoom(url); }}>
                                <img src={url} className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" alt="Evidence" loading="lazy"/>
                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-end p-2 pointer-events-none">
                                    <div className="text-white text-xs font-bold flex items-center gap-1"><UI_Icons.ZoomIn size={16}/> Xem to</div>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            </div>
        );
    };


    // --- COMPONENT QUẢN LÝ THƯ VIỆN (ĐÃ BỔ SUNG CẤP ĐIỆN ÁP) ---
    const RiskManagerModal = ({ isOpen, onClose, onRefresh, existingRisks }) => {
        const [mode, setMode] = useState('create');
        const [selectedRiskId, setSelectedRiskId] = useState(""); 
        const [expandedRiskId, setExpandedRiskId] = useState(null); 
        
        const [name, setName] = useState("");
        const [capDienAp, setCapDienAp] = useState(""); // STATE MỚI: "" = Chung, "TA" = Trung áp, "HA" = Hạ áp
        const [measure, setMeasure] = useState("");
        
        const [existingMeasures, setExistingMeasures] = useState([]);
        const [loading, setLoading] = useState(false);
        const [detailLoading, setDetailLoading] = useState(false);

        useEffect(() => { 
            if (isOpen) { 
                setMode('create'); setSelectedRiskId(""); setExpandedRiskId(null);
                setName(""); setMeasure(""); setCapDienAp("");
                setExistingMeasures([]);
            } 
        }, [isOpen]);

        useEffect(() => {
            const fetchDetailsForUpdate = async () => {
                if (mode === 'update' && selectedRiskId) {
                    setLoading(true);
                    const { data: mData } = await supabase.from('dm_bien_phap').select('*').eq('moi_nguy_id', selectedRiskId).order('id');
                    if (mData) setExistingMeasures(mData);
                    setLoading(false);
                } else if (mode === 'update') {
                    setExistingMeasures([]);
                }
            };
            fetchDetailsForUpdate();
        }, [selectedRiskId, mode]);

        const fetchRiskDetails = async (id) => {
            const { data: mData } = await supabase.from('dm_bien_phap').select('*').eq('moi_nguy_id', id).order('id');
            if (mData) setExistingMeasures(mData);
        };

        const handleToggleDetail = async (riskId) => {
            if (expandedRiskId === riskId) { setExpandedRiskId(null); } 
            else {
                setExpandedRiskId(riskId); setDetailLoading(true);
                await fetchRiskDetails(riskId); setDetailLoading(false);
            }
        };

        const handleDeleteDetail = async (table, id) => {
            if(!confirm("Xóa dòng chi tiết này?")) return;
            const { error } = await supabase.from(table).delete().eq('id', id);
            if (error) alert("Lỗi xóa: " + error.message);
            else if (table === 'dm_bien_phap') setExistingMeasures(prev => prev.filter(i => i.id !== id));
        };

        const handleDeleteRisk = async (id, riskName, e) => {
            e.stopPropagation(); 
            if(!confirm(`CẢNH BÁO: Xóa loại công việc "${riskName}" sẽ xóa tất cả dữ liệu bên trong nó. Tiếp tục?`)) return;
            setLoading(true);
            try {
                await supabase.from('dm_bien_phap').delete().eq('moi_nguy_id', id);
                const { error } = await supabase.from('dm_moi_nguy').delete().eq('id', id);
                if (error) throw error;
                alert("Đã xóa thành công!"); onRefresh();
            } catch (err) { alert("Lỗi khi xóa: " + err.message); } 
            finally { setLoading(false); }
        };

        const handleUpdateLocal = (type, index, val) => {
            if (type === 'measure') { const newArr = [...existingMeasures]; newArr[index].noi_dung = val; setExistingMeasures(newArr); }
        };

        const handleSave = async () => {
            setLoading(true); 
            let targetRiskId = selectedRiskId;

            if (mode === 'create') {
                if (!name.trim()) { alert("Vui lòng nhập loại công việc!"); setLoading(false); return; }
                // ĐÃ THÊM CỘT CAP_DIEN_AP VÀO LÚC LƯU
                const { data, error } = await supabase.from('dm_moi_nguy').insert([{ ten_moi_nguy: name.trim(), cap_dien_ap: capDienAp }]).select();
                if (error) { alert("Lỗi lưu: " + error.message); setLoading(false); return; }
                targetRiskId = data[0].id;
            } else if (mode === 'update') { 
                if (!targetRiskId) { alert("Vui lòng chọn loại công việc!"); setLoading(false); return; } 
                for (const item of existingMeasures) { await supabase.from('dm_bien_phap').update({ noi_dung: item.noi_dung }).eq('id', item.id); }
            }

            const measureInserts = measure.split('\n').map(l => l.trim()).filter(l => l).map(m => ({ moi_nguy_id: targetRiskId, noi_dung: m }));
            if (measureInserts.length > 0) await supabase.from('dm_bien_phap').insert(measureInserts);

            alert("Đã lưu thành công!"); onRefresh(); 
            if(mode === 'create') { setName(""); setMeasure(""); setCapDienAp(""); }
            setLoading(false);
        };

        // --- HÀM IMPORT EXCEL MỚI: 3 CỘT & BỎ TIÊU ĐỀ ---
        const handleImportExcel = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setLoading(true);
            try {
                const data = await file.arrayBuffer();
                const wb = window.XLSX.read(data, { type: 'array' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                
                // Đọc dữ liệu ra mảng 2 chiều
                const rowsData = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                // 1. LUÔN BỎ QUA DÒNG ĐẦU TIÊN (TIÊU ĐỀ)
                const startIndex = 1; 

                // 2. Gộp dữ liệu theo Loại công việc
                // Cấu trúc: grouped[tên_loại] = { cap: "TA/HA", measures: ["bp1", "bp2"] }
                const grouped = {};
                for (let i = startIndex; i < rowsData.length; i++) {
                    const row = rowsData[i];
                    if (!row || row.length === 0 || !row[0]) continue;

                    const loai = row[0].toString().trim();
                    const bienPhap = row[1] ? row[1].toString().trim() : "";
                    const capDienApRaw = row[2] ? row[2].toString().trim().toUpperCase() : "";
                    
                    // Chuẩn hóa cấp điện áp: Nếu cột C có chữ "TRUNG" hoặc "TA" -> TA, có chữ "HẠ" hoặc "HA" -> HA
                    let capDienApFinal = "";
                    if (capDienApRaw.includes("TRUNG") || capDienApRaw === "TA") capDienApFinal = "TA";
                    else if (capDienApRaw.includes("HẠ") || capDienApRaw === "HA") capDienApFinal = "HA";

                    if (loai) {
                        if (!grouped[loai]) {
                            grouped[loai] = { cap: capDienApFinal, measures: [] };
                        }
                        if (bienPhap && !grouped[loai].measures.includes(bienPhap)) {
                            grouped[loai].measures.push(bienPhap);
                        }
                    }
                }

                let count = 0;
                // 3. Bắt đầu đẩy dữ liệu lên Supabase
                for (const loaiName in grouped) {
                    const info = grouped[loaiName];
                    
                    // Thêm vào bảng dm_moi_nguy (có cột cap_dien_ap)
                    const { data: mnData, error: mnErr } = await supabase.from('dm_moi_nguy').insert([
                        { ten_moi_nguy: loaiName, cap_dien_ap: info.cap }
                    ]).select();
                    
                    if (mnErr) throw mnErr;
                    
                    const newMnId = mnData[0].id;
                    const measuresPayload = info.measures.map(bp => ({ 
                        moi_nguy_id: newMnId, 
                        noi_dung: bp 
                    }));
                    
                    if (measuresPayload.length > 0) {
                        const { error: bpErr } = await supabase.from('dm_bien_phap').insert(measuresPayload);
                        if (bpErr) throw bpErr;
                    }
                    count++;
                }
                
                alert(`Đã nhập thành công ${count} nhóm Loại công việc vào thư viện!`);
                onRefresh();
                setMode('list'); 
            } catch (err) {
                alert("Lỗi nhập Excel: " + err.message);
            } finally {
                setLoading(false);
                e.target.value = ""; 
            }
        };

        const renderRiskRow = (r) => {
            const isExpanded = expandedRiskId === r.id;
            return (
                <div key={r.id} className="border rounded bg-white shadow-sm overflow-hidden mb-2 transition-all">
                    <div className={`flex justify-between items-center p-3 cursor-pointer hover:bg-gray-50 ${isExpanded ? 'bg-blue-50 border-b border-blue-100' : ''}`} onClick={() => handleToggleDetail(r.id)}>
                        <div className="flex items-center gap-2">
                            {isExpanded ? <UI_Icons.Minus size={14}/> : <UI_Icons.Plus size={14}/>}
                            <div>
                                <div className="font-bold text-sm text-gray-800 flex items-center gap-2">
                                    {r.ten_moi_nguy}
                                    {r.cap_dien_ap === 'TA' && <span className="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded border border-red-200">TA</span>}
                                    {r.cap_dien_ap === 'HA' && <span className="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded border border-green-200">HA</span>}
                                </div>
                            </div>
                        </div>
                        <button onClick={(e) => handleDeleteRisk(r.id, r.ten_moi_nguy, e)} className="text-gray-400 hover:text-red-500 p-2 rounded transition-colors" title="Xóa toàn bộ"><UI_Icons.Trash2 size={18}/></button>
                    </div>
                    {isExpanded && (
                        <div className="p-3 bg-gray-50 text-sm animate-zoom-in">
                            {detailLoading ? (<div className="text-center text-gray-500 py-2">Đang tải chi tiết...</div>) : (
                                <div>
                                    <div className="font-bold text-gray-700 mb-1 border-b border-gray-200 pb-1">Biện pháp kiểm soát:</div>
                                    {existingMeasures.length === 0 ? <div className="text-gray-400 italic text-xs">Chưa có dữ liệu</div> : (
                                        <ul className="list-disc list-inside space-y-1 text-gray-700">
                                            {existingMeasures.map(m => <li key={m.id} className="pl-1">{m.noi_dung}</li>)}
                                        </ul>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-black/50 z-[150] flex items-center justify-center p-4" onClick={onClose}>
                <div className="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                    <div className="p-4 border-b bg-blue-600 text-white rounded-t-lg flex justify-between items-center">
                        <h3 className="font-bold text-lg flex items-center gap-2"><UI_Icons.Database /> Quản Lý Thư Viện Mối Nguy</h3>
                        <button onClick={onClose}><UI_Icons.X size={20}/></button>
                    </div>
                    
                    <div className="p-4 overflow-y-auto flex-1 space-y-4">
                        <div className="flex border rounded overflow-hidden mb-4 shadow-sm bg-gray-100 p-1 gap-1">
                            <button className={`flex-1 py-1.5 rounded font-bold text-xs transition-all ${mode === 'create' ? 'bg-white text-blue-700 shadow' : 'text-gray-500 hover:bg-gray-200'}`} onClick={() => setMode('create')}>Tạo Mới</button>
                            <button className={`flex-1 py-1.5 rounded font-bold text-xs transition-all ${mode === 'update' ? 'bg-white text-blue-700 shadow' : 'text-gray-500 hover:bg-gray-200'}`} onClick={() => setMode('update')}>Sửa ND</button>
                            <button className={`flex-1 py-1.5 rounded font-bold text-xs transition-all ${mode === 'list' ? 'bg-white text-blue-700 shadow' : 'text-gray-500 hover:bg-gray-200'}`} onClick={() => setMode('list')}>Danh Sách</button>
                            <button className={`flex-1 py-1.5 rounded font-bold text-xs transition-all ${mode === 'import' ? 'bg-green-600 text-white shadow' : 'text-green-600 hover:bg-green-100'}`} onClick={() => setMode('import')}>+ Excel</button>
                        </div>

                        {mode === 'create' && (
                            <div className="space-y-3 bg-gray-50 p-3 rounded border">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Loại công việc *</label>
                                    <input className="w-full border rounded p-2 focus:border-blue-500 outline-none" value={name} onChange={e => setName(e.target.value)} placeholder="VD: Trèo trụ, làm việc trên cao" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Cấp điện áp (Bộ lọc)</label>
                                    <select className="w-full border rounded p-2 focus:border-blue-500 outline-none font-semibold text-blue-800" value={capDienAp} onChange={e => setCapDienAp(e.target.value)}>
                                        <option value="">⚡ Chung (Luôn hiển thị ở mọi Tab)</option>
                                        <option value="TA">🔴 Trung Áp (Chỉ hiện khi chọn Tab TA)</option>
                                        <option value="HA">🔵 Hạ Áp (Chỉ hiện khi chọn Tab HA)</option>
                                    </select>
                                </div>
                            </div>
                        )}

                        {mode === 'update' && (
                            <div className="bg-yellow-50 p-3 rounded border border-yellow-200">
                                <label className="block text-sm font-bold text-gray-700 mb-1">Chọn loại công việc cần sửa *</label>
                                <select className="w-full border rounded p-2 font-bold text-blue-800 outline-none" value={selectedRiskId} onChange={e => setSelectedRiskId(e.target.value)}>
                                    <option value="">-- Chọn loại công việc --</option>
                                    {existingRisks.map(r => (<option key={r.id} value={r.id}>{r.ten_moi_nguy} {r.cap_dien_ap ? `[${r.cap_dien_ap}]` : ""}</option>))}
                                </select>
                            </div>
                        )}

                        {mode === 'list' && (
                            <div className="space-y-6">
                                <div>
                                    <div className="bg-blue-100 text-blue-800 px-3 py-1.5 font-bold text-sm rounded mb-2 sticky top-0 z-10 border border-blue-200">Danh sách Loại công việc</div>
                                    <div className="space-y-1">
                                        {existingRisks.length === 0 ? <div className="text-gray-400 italic text-xs ml-2">Chưa có dữ liệu</div> : existingRisks.map(r => renderRiskRow(r))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {mode === 'import' && (
                            <div className="space-y-4 bg-green-50 p-4 rounded border border-green-200">
                                <div className="text-sm text-gray-800">
                                    <p className="font-bold mb-2">Hướng dẫn cấu trúc file Excel (.xlsx):</p>
                                    <ul className="list-disc pl-5 space-y-1">
                                        <li><b>Cột A:</b> Loại công việc (VD: Thay sứ)</li>
                                        <li><b>Cột B:</b> Biện pháp an toàn</li>
                                        <li><b>Cột C:</b> Cấp điện áp (Nhập: <b>TA</b> hoặc <b>HA</b>)</li>
                                        <li><i>Lưu ý: Dòng 1 luôn bị bỏ qua. Hệ thống sẽ tự gộp nếu trùng tên Loại công việc.</i></li>
                                    </ul>
                                </div>
                                <div className="flex items-center justify-center w-full">
                                    <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-green-400 border-dashed rounded-lg cursor-pointer bg-white hover:bg-green-100 transition-colors">
                                        <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                            <UI_Icons.Download size={32} className="text-green-600 mb-2" />
                                            <p className="text-sm font-bold text-green-700">Bấm để tải lên file Excel</p>
                                        </div>
                                        <input type="file" className="hidden" accept=".xlsx, .xls" onChange={handleImportExcel} disabled={loading} />
                                    </label>
                                </div>
                                {loading && <div className="text-center text-green-700 font-bold text-sm animate-pulse">Đang nạp dữ liệu...</div>}
                            </div>
                        )}

                        {(mode === 'create' || mode === 'update') && (
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">Mối nguy & biện pháp kiểm soát:</label>
                                {mode === 'update' && existingMeasures.length > 0 && (
                                    <div className="mb-2 space-y-2 max-h-40 overflow-y-auto border p-2 rounded bg-gray-50">
                                        {existingMeasures.map((item, i) => (
                                            <div key={item.id} className="flex gap-2 items-center">
                                                <input className="flex-1 border rounded px-2 py-1 text-sm text-gray-700 outline-none focus:border-blue-400" value={item.noi_dung} onChange={(e) => handleUpdateLocal('measure', i, e.target.value)} />
                                                <button onClick={() => handleDeleteDetail('dm_bien_phap', item.id)} className="text-red-500 hover:bg-red-100 p-1 rounded"><UI_Icons.Trash2 size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <textarea className="w-full border rounded p-2 focus:ring-2 focus:ring-blue-200 outline-none" rows="3" placeholder="Nhập mối nguy và biện pháp (xuống dòng để tách thành nhiều mục)..." value={measure} onChange={e => setMeasure(e.target.value)}></textarea>
                            </div>
                        )}
                    </div>

                    <div className="p-4 border-t flex justify-end gap-2 bg-gray-50 rounded-b-lg">
                        <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-200 transition-colors">Đóng</button>
                        {(mode === 'create' || mode === 'update') && (
                            <button onClick={handleSave} disabled={loading} className="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 shadow-md transition-all active:scale-95 flex items-center gap-2">
                                {loading ? <div className="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> : <UI_Icons.Save size={18}/>}
                                Lưu Lại
                            </button>
                        )}
                    </div>
                </div>
            </div>
        );
    };



    const RiskSelectModal = ({ isOpen, onClose, title, options, selectedValues, onSave }) => {
        const [items, setItems] = useState([]);
        useEffect(() => { if (isOpen) setItems(selectedValues ? selectedValues.split(';').map(x => x.trim()).filter(x => x !== '') : []); }, [isOpen, selectedValues]);
        const toggleOption = (val) => setItems(prev => prev.includes(val) ? prev.filter(i => i !== val) : [...prev, val]);
        const handleSave = () => { onSave(items.join('; ')); onClose(); };
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 bg-black/50 z-[120] flex items-center justify-center p-4" onClick={onClose}>
                <div className="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                    <div className="p-4 border-b bg-blue-50 flex justify-between items-center"><h3 className="font-bold text-blue-800">{title}</h3><button onClick={onClose}><UI_Icons.X/></button></div>
                    <div className="p-4 overflow-y-auto flex-1 space-y-2">
                        <div className="mb-2"><div className="font-bold text-sm mb-1">Đã chọn:</div>{items.map((it, i) => (<div key={i} className="flex gap-2 mb-1"><textarea className="flex-1 border rounded p-1 text-sm" rows="1" value={it} onChange={e => { const n = [...items]; n[i] = e.target.value; setItems(n); }} /><button onClick={() => setItems(items.filter((_, idx) => idx !== i))} className="text-red-500"><UI_Icons.Trash2 size={16}/></button></div>))}</div>
                        <button onClick={() => setItems([...items, ""])} className="text-sm text-blue-600 font-bold flex items-center gap-1"><UI_Icons.Plus size={14}/> Thêm dòng</button>
                        <hr className="my-2"/>
                        <div className="font-bold text-sm mb-1">Gợi ý:</div>
                        <div className="space-y-1">{options.map((opt, i) => (<label key={i} className="flex gap-2 p-2 hover:bg-gray-100 rounded cursor-pointer"><input type="checkbox" checked={items.includes(opt.noi_dung)} onChange={() => toggleOption(opt.noi_dung)} /><span className="text-sm">{opt.noi_dung}</span></label>))}</div>
                    </div>
                    <div className="p-3 border-t flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 border rounded">Hủy</button><button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded font-bold">Lưu</button></div>
                </div>
            </div>
        );
    };

    // --- COMPONENT QUẢN LÝ DỮ LIỆU NỀN (NỘI DUNG, NHÂN VIÊN, TRỤ, XÃ) ---
    const TemplateManagerModal = ({ isOpen, onClose, onRefresh }) => {
        const [activeTab, setActiveTab] = useState('noi_dung');
        const [items, setItems] = useState([]);
        const [loading, setLoading] = useState(false);

        // State cho chức năng sửa (Edit)
        const [editingId, setEditingId] = useState(null); 
        const [editData, setEditData] = useState({});  

        // State Thêm Mới
        const [newForm, setNewForm] = useState({});

        const fetchItems = async () => {
            setLoading(true);
            let res;
            if (activeTab === 'noi_dung') res = await supabase.from('dm_mau_cong_viec').select('*').eq('loai', 'noi_dung').order('id', { ascending: true });
            else if (activeTab === 'poles') res = await supabase.from('poles').select('*').order('id', { ascending: false }).limit(100);
            else if (activeTab === 'communes') res = await supabase.from('communes').select('*').order('id', { ascending: false });
            
            if (res && !res.error) setItems(res.data || []);
            setLoading(false);
        };

        useEffect(() => {
            if (isOpen) {
                fetchItems();
                setEditingId(null);
                setNewForm({});
            }
        }, [isOpen, activeTab]);

        // --- XỬ LÝ THÊM MỚI ---
        const handleAdd = async () => {
            let table = activeTab, payload = {};
            if (activeTab === 'noi_dung') {
                if (!newForm.noi_dung?.trim()) return alert("Vui lòng nhập nội dung!");
                table = 'dm_mau_cong_viec';
                payload = { loai: 'noi_dung', noi_dung: newForm.noi_dung.trim() };
            } else if (activeTab === 'poles') {
                if (!newForm.code?.trim()) return alert("Vui lòng nhập Mã Trụ!");
                payload = { code: newForm.code.trim(), line_name: newForm.line_name?.trim() };
            } else if (activeTab === 'communes') {
                if (!newForm.name?.trim()) return alert("Vui lòng nhập Tên Xã / Phường!");
                payload = { name: newForm.name.trim() };
            }

            const { error } = await supabase.from(table).insert([payload]);
            if (error) alert("Lỗi thêm: " + error.message);
            else { setNewForm({}); fetchItems(); if(onRefresh) onRefresh(); }
        };

        // --- XỬ LÝ XÓA ---
        const handleDelete = async (id) => {
            if (!confirm("Bạn có chắc chắn muốn xóa dữ liệu này?")) return;
            const table = activeTab === 'noi_dung' ? 'dm_mau_cong_viec' : activeTab;
            const { error } = await supabase.from(table).delete().eq('id', id);
            if (error) alert("Lỗi xóa: " + error.message);
            else { fetchItems(); if(onRefresh) onRefresh(); }
        };

        // --- XỬ LÝ SỬA ---
        const startEdit = (item) => {
            setEditingId(item.id);
            setEditData({ ...item }); // Copy toàn bộ dữ liệu dòng hiện tại
        };

        const saveEdit = async (id) => {
            const table = activeTab === 'noi_dung' ? 'dm_mau_cong_viec' : activeTab;
            
            // Lọc bỏ id và các trường hệ thống trước khi update
            const payload = { ...editData };
            delete payload.id; delete payload.created_at; delete payload.loai;

            const { error } = await supabase.from(table).update(payload).eq('id', id);
            if (error) alert("Lỗi cập nhật: " + error.message);
            else { setEditingId(null); fetchItems(); if(onRefresh) onRefresh(); }
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-black/50 z-[160] flex items-center justify-center p-4" onClick={onClose}>
                <div className="bg-white rounded-lg shadow-2xl w-full max-w-3xl flex flex-col h-[90vh] md:h-[80vh]" onClick={e => e.stopPropagation()}>
                    {/* HEADER */}
                    <div className="p-3 md:p-4 border-b bg-gradient-to-r from-purple-700 to-purple-500 text-white rounded-t-lg flex justify-between items-center shrink-0">
                        <h3 className="font-bold text-sm md:text-base flex items-center gap-2 uppercase tracking-wide">
                            <UI_Icons.Database size={18}/> Quản Lý Cơ Sở Dữ Liệu Nền
                        </h3>
                        <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full transition-colors"><UI_Icons.X size={20}/></button>
                    </div>
                    
                    {/* TABS MENU */}
                    <div className="p-2 flex gap-2 bg-purple-50 border-b overflow-x-auto no-scrollbar shrink-0 shadow-inner">
                        <button onClick={() => setActiveTab('noi_dung')} className={`px-4 py-2 whitespace-nowrap text-xs md:text-sm font-bold rounded-md transition-all ${activeTab === 'noi_dung' ? 'bg-purple-600 text-white shadow-md' : 'bg-white border border-gray-300 text-gray-600 hover:bg-purple-100 hover:text-purple-700'}`}>Mục 5. Nội dung</button>
                        <button onClick={() => setActiveTab('poles')} className={`px-4 py-2 whitespace-nowrap text-xs md:text-sm font-bold rounded-md transition-all ${activeTab === 'poles' ? 'bg-purple-600 text-white shadow-md' : 'bg-white border border-gray-300 text-gray-600 hover:bg-purple-100 hover:text-purple-700'}`}>Trụ & Tuyến</button>
                        <button onClick={() => setActiveTab('communes')} className={`px-4 py-2 whitespace-nowrap text-xs md:text-sm font-bold rounded-md transition-all ${activeTab === 'communes' ? 'bg-purple-600 text-white shadow-md' : 'bg-white border border-gray-300 text-gray-600 hover:bg-purple-100 hover:text-purple-700'}`}>Xã / Phường</button>
                    </div>

                    {/* LIST DỮ LIỆU */}
                    <div className="p-3 overflow-y-auto flex-1 space-y-2 bg-gray-100">
                        {loading ? <div className="text-center text-gray-500 font-bold py-10 flex flex-col items-center"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mb-3"></div>Đang tải dữ liệu...</div> : (
                            items.length === 0 ? <div className="text-center text-gray-400 italic py-10">Chưa có dữ liệu trong mục này</div> : 
                            items.map(item => (
                                <div key={item.id} className={`flex flex-col md:flex-row justify-between md:items-center p-3 border rounded-lg shadow-sm ${editingId === item.id ? 'bg-yellow-50 border-yellow-400 ring-1 ring-yellow-400' : 'bg-white hover:border-purple-300'} group transition-all gap-3`}>
                                    
                                    {/* CHẾ ĐỘ SỬA BÊN TRONG LIST */}
                                    {editingId === item.id ? (
                                        <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                            {activeTab === 'noi_dung' && <input className="col-span-full border border-blue-400 rounded px-2 py-1.5 text-sm outline-none" value={editData.noi_dung||""} onChange={e => setEditData({...editData, noi_dung: e.target.value})} />}
                                            

                                            {activeTab === 'poles' && <>
                                                <input className="border border-blue-400 rounded px-2 py-1.5 text-sm outline-none font-bold text-blue-700" placeholder="Mã trụ" value={editData.code||""} onChange={e => setEditData({...editData, code: e.target.value})} />
                                                <input className="border border-blue-400 rounded px-2 py-1.5 text-sm outline-none md:col-span-2" placeholder="Tên tuyến" value={editData.line_name||""} onChange={e => setEditData({...editData, line_name: e.target.value})} />
                                            </>}

                                            {activeTab === 'communes' && <input className="col-span-full border border-blue-400 rounded px-2 py-1.5 text-sm outline-none font-bold text-blue-700" placeholder="Tên xã" value={editData.name||""} onChange={e => setEditData({...editData, name: e.target.value})} />}
                                        </div>
                                    ) : (
                                    /* CHẾ ĐỘ XEM TRONG LIST */
                                        <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-1 text-sm cursor-pointer" onClick={() => startEdit(item)}>
                                            {activeTab === 'noi_dung' && <div className="col-span-full font-medium text-gray-800">{item.noi_dung}</div>}
                                            
                                            
                                            {activeTab === 'poles' && <>
                                                <div className="font-bold text-blue-800">{item.code}</div>
                                                <div className="text-gray-700 font-medium md:col-span-2">{item.line_name}</div>
                                            </>}
                                            
                                            {activeTab === 'communes' && <div className="col-span-full font-bold text-blue-800">{item.name}</div>}
                                        </div>
                                    )}

                                    {/* NÚT THAO TÁC */}
                                    <div className="flex gap-2 justify-end shrink-0 border-t md:border-t-0 pt-2 md:pt-0">
                                        {editingId === item.id ? (
                                            <>
                                                <button onClick={() => saveEdit(item.id)} className="bg-green-600 text-white hover:bg-green-700 px-4 py-1.5 rounded text-xs font-bold flex items-center gap-1 shadow-sm"><UI_Icons.Save size={14}/> Lưu</button>
                                                <button onClick={() => setEditingId(null)} className="bg-gray-200 text-gray-700 hover:bg-gray-300 px-3 py-1.5 rounded text-xs font-bold">Hủy</button>
                                            </>
                                        ) : (
                                            <>
                                                <button onClick={() => startEdit(item)} className="text-blue-600 hover:bg-blue-100 p-2 rounded-lg bg-blue-50 md:bg-transparent transition-colors" title="Chỉnh sửa"><UI_Icons.Edit size={16}/></button>
                                                <button onClick={() => handleDelete(item.id)} className="text-red-500 hover:bg-red-100 p-2 rounded-lg bg-red-50 md:bg-transparent transition-colors" title="Xóa"><UI_Icons.Trash2 size={16}/></button>
                                            </>
                                        )}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>


                    {/* FORM THÊM MỚI Ở DƯỚI ĐÁY */}
                    <div className="p-3 md:p-4 bg-gray-50 rounded-b-lg shrink-0 z-10 border-t-2 border-gray-200">
                        <div className="text-xs font-bold text-purple-700 mb-2 uppercase tracking-wider flex items-center gap-1">
                            <UI_Icons.Plus size={14}/> 
                            Thêm mới {activeTab === 'poles' ? 'Trụ/Tuyến' : activeTab === 'communes' ? 'Xã/Phường' : 'Mẫu nội dung'}
                        </div>
                        <div className="flex flex-col md:flex-row gap-2">
                            
                            {activeTab === 'noi_dung' && <input className="flex-1 border border-purple-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 shadow-inner" placeholder="Nhập nội dung mẫu..." value={newForm.noi_dung||""} onChange={e => setNewForm({...newForm, noi_dung: e.target.value})} onKeyDown={e => e.key === 'Enter' && handleAdd()}/>}
                            

                            {activeTab === 'poles' && <>
                                <input className="w-full md:w-48 border border-purple-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 shadow-inner font-bold text-blue-800" placeholder="Mã trụ (VD: 477CD/12)" value={newForm.code||""} onChange={e => setNewForm({...newForm, code: e.target.value})} />
                                <input className="flex-1 border border-purple-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 shadow-inner" placeholder="Tên tuyến (VD: 477 Cái Dầu)" value={newForm.line_name||""} onChange={e => setNewForm({...newForm, line_name: e.target.value})} onKeyDown={e => e.key === 'Enter' && handleAdd()}/>
                            </>}

                            {activeTab === 'communes' && <input className="flex-1 border border-purple-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 shadow-inner" placeholder="Tên xã / phường..." value={newForm.name||""} onChange={e => setNewForm({...newForm, name: e.target.value})} onKeyDown={e => e.key === 'Enter' && handleAdd()}/>}

                            <button onClick={handleAdd} className="bg-purple-600 text-white px-6 py-2 rounded-lg font-bold text-sm hover:bg-purple-700 shadow-md flex items-center justify-center gap-2 shrink-0 active:scale-95 transition-all">
                                <UI_Icons.Save size={16}/> LƯU
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // --- COMPONENT TẠO TÀI KHOẢN MỚI (CẬP NHẬT TÊN VÀ QUYỀN) ---
    const CreateAccountModal = ({ isOpen, onClose }) => {
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [hoTen, setHoTen] = useState("");
        const [chucVu, setChucVu] = useState("");
        const [donVi, setDonVi] = useState("");
        const [role, setRole] = useState("user");
        const [loading, setLoading] = useState(false);

        if (!isOpen) return null;

        const handleCreateAccount = async () => {
            if (!email || !password || !hoTen) {
                return alert("Vui lòng nhập đầy đủ Họ Tên, Email và Mật khẩu!");
            }
            if (password.length < 6) {
                return alert("Mật khẩu phải có ít nhất 6 ký tự!");
            }

            const { data: sessionData } = await supabase.auth.getSession();
            const adminSession = sessionData?.session;

            setLoading(true);
            try {
                // 1. Tạo tài khoản Auth
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { 
                            ho_ten: hoTen, 
                            role: role,
                            chuc_vu: chucVu,
                            don_vi: donVi
                        }
                    }
                });
                if (error) throw error;

                await supabase.auth.signOut();
                await supabase.auth.setSession({
                    access_token: adminSession.access_token,
                    refresh_token: adminSession.refresh_token
                });

                alert("Đã tạo tài khoản thành công!");
                setHoTen("");
                setEmail("");
                setPassword("");
                setChucVu("");
                setDonVi("");
                setRole("user");
                onClose();
            } catch (error) {
                alert("Lỗi khi tạo tài khoản: " + error.message);
            } finally {
                setLoading(false);
            }
        };

        return (
            <div className="fixed inset-0 bg-black/50 z-[10000] flex items-center justify-center p-4 animate-zoom-in" onClick={onClose}>
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
                    <div className="p-4 bg-green-600 text-white flex justify-between items-center">
                        <h3 className="font-bold text-lg flex items-center gap-2">
                            <UI_Icons.UserPlus size={20} /> Tạo Tài Khoản Mới
                        </h3>
                        <button onClick={onClose} className="hover:bg-green-700 p-1 rounded-full transition-colors">
                            <UI_Icons.X size={20} />
                        </button>
                    </div>
                    
                    <div className="p-6 space-y-4">
                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">Họ và Tên *</label>
                            <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 font-medium" placeholder="Nhập tên nhân viên..." value={hoTen} onChange={e => setHoTen(e.target.value)} />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">Chức vụ</label>
                                <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 font-medium" placeholder="Nhân viên, KSV..." value={chucVu} onChange={e => setChucVu(e.target.value)} />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">Đơn vị</label>
                                <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 font-medium" placeholder="Điện lực Châu Phú..." value={donVi} onChange={e => setDonVi(e.target.value)} />
                            </div>
                        </div>
                        
                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">Email đăng nhập *</label>
                            <input type="email" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 font-medium" placeholder="nguyenvana@gmail.com" value={email} onChange={e => setEmail(e.target.value)} />
                        </div>
                        
                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">Mật khẩu *</label>
                            <input type="password" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 font-medium" placeholder="Ít nhất 6 ký tự" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>

                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">Phân quyền *</label>
                            <select className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-green-500 font-bold text-blue-800 bg-gray-50" value={role} onChange={e => setRole(e.target.value)}>
                                <option value="user">Nhân viên (User)</option>
                                <option value="admin">Quản trị viên (Admin)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div className="p-4 border-t bg-gray-50 flex justify-end gap-2">
                        <button onClick={onClose} className="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-200 font-bold transition-colors">Hủy</button>
                        <button 
                            onClick={handleCreateAccount} 
                            disabled={loading}
                            className="px-6 py-2 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 active:scale-95 transition-all shadow-md flex items-center gap-2"
                        >
                            {loading ? "Đang xử lý..." : "Lưu Tài Khoản"}
                        </button>
                    </div>
                </div>
            </div>
        );
    };


// --- COMPONENT QUẢN LÝ DANH SÁCH TÀI KHOẢN ---
    const AccountManagerModal = ({ isOpen, onClose, currentUserId }) => {
        const [accounts, setAccounts] = useState([]);
        const [loading, setLoading] = useState(false);

        useEffect(() => {
            if (isOpen) fetchAccounts();
        }, [isOpen]);

        const fetchAccounts = async () => {
            setLoading(true);
            const { data, error } = await supabase.from('profiles').select('*').order('ho_ten', { ascending: true });
            if (!error && data) setAccounts(data);
            setLoading(false);
        };

        const handleUpdateRole = async (id, newRole) => {
            if (id === currentUserId) {
                return alert("Bạn không thể tự hạ quyền Admin của chính mình!");
            }
            if(!confirm("Thay đổi quyền của tài khoản này?")) return;

            const { error } = await supabase.from('profiles').update({ role: newRole }).eq('id', id);
            if (error) {
                alert("Lỗi cập nhật: " + error.message);
            } else {
                fetchAccounts(); // Tải lại danh sách
            }
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-black/50 z-[10000] flex items-center justify-center p-4 animate-zoom-in" onClick={onClose}>
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[85vh] overflow-hidden" onClick={e => e.stopPropagation()}>
                    <div className="p-4 bg-purple-600 text-white flex justify-between items-center">
                        <h3 className="font-bold text-lg flex items-center gap-2">
                            <UI_Icons.Users size={20} /> Quản Lý Danh Sách Tài Khoản
                        </h3>
                        <button onClick={onClose} className="hover:bg-purple-700 p-1 rounded-full transition-colors">
                            <UI_Icons.X size={20} />
                        </button>
                    </div>
                    
                    <div className="p-4 overflow-y-auto flex-1 bg-gray-50">
                        {loading ? <div className="text-center py-10 text-gray-500 font-bold">Đang tải...</div> : (
                            <div className="space-y-3">
                                {accounts.map(acc => (
                                    <div key={acc.id} className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all hover:border-purple-300">
                                        <div>
                                            <div className="font-bold text-blue-800 text-base flex items-center gap-2">
                                                {acc.ho_ten || "Chưa cập nhật tên"}
                                                {acc.id === currentUserId && <span className="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full border border-blue-200">Bạn</span>}
                                            </div>
                                            <div className="text-sm text-gray-500 flex items-center gap-1 mt-1">
                                                <UI_Icons.FileText size={12}/> {acc.email || "Email không xác định"}
                                            </div>
                                            {(acc.chuc_vu || acc.don_vi) && (
                                                <div className="text-xs text-gray-400 mt-0.5">
                                                    {[acc.chuc_vu, acc.don_vi].filter(Boolean).join(' · ')}
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex items-center gap-2 shrink-0 border-t md:border-t-0 pt-2 md:pt-0">
                                            <span className="text-sm font-bold text-gray-700">Quyền:</span>
                                            <select 
                                                className={`border rounded-lg px-3 py-1.5 outline-none font-bold text-sm transition-colors cursor-pointer ${acc.role === 'admin' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`}
                                                value={acc.role || 'user'}
                                                onChange={(e) => handleUpdateRole(acc.id, e.target.value)}
                                                disabled={acc.id === currentUserId}
                                            >
                                                <option value="user">User</option>
                                                <option value="admin">Admin</option>
                                            </select>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    <div className="p-3 border-t flex justify-end">
                        <button onClick={onClose} className="px-5 py-2 bg-gray-200 text-gray-800 font-bold rounded-lg hover:bg-gray-300 transition-colors">Đóng</button>
                    </div>
                </div>
            </div>
        );
    };

    // --- COMPONENT KÝ OTP (TÁCH RIÊNG ĐỂ TÁI SỬ DỤNG) ---
    const OtpSignModal = ({ isOpen, signatureRequest, currentUserId, onClose, onSuccess }) => {
        const [otpInput, setOtpInput] = useState("");
        const [verifying, setVerifying] = useState(false);
        const [errorMsg, setErrorMsg] = useState("");

        useEffect(() => {
            if (isOpen) { setOtpInput(""); setErrorMsg(""); }
        }, [isOpen]);

        const vaiTroLabel = (vt) => ({
            dvct: "Đơn vị công tác",
            qlvh: "Đơn vị QLVH",
            lien_quan: "Đơn vị liên quan"
        }[vt] || vt);

        const handleConfirm = async () => {
            if (otpInput.length !== 6) { setErrorMsg("Nhập đủ 6 chữ số!"); return; }
            setVerifying(true); setErrorMsg("");
            try {
                // Lấy profile của user hiện tại (RLS cho phép đọc dòng của chính mình)
                const { data: myProfile } = await supabase
                    .from('profiles')
                    .select('chu_ky_url, ho_ten, email')
                    .eq('id', currentUserId)
                    .maybeSingle();

                const { data: myTotp } = await supabase
                    .from('user_totp')
                    .select('totp_secret, totp_enabled')
                    .eq('user_id', currentUserId)
                    .maybeSingle();

                if (!myTotp?.totp_enabled) {
                    setErrorMsg("Bạn chưa kích hoạt xác thực 2 lớp! Vào Hồ Sơ để bật.");
                    setVerifying(false); return;
                }
                if (!myProfile?.chu_ky_url) {
                    setErrorMsg("Bạn chưa upload chữ ký! Vào Hồ Sơ để thêm.");
                    setVerifying(false); return;
                }

                // Verify TOTP
                const totp = new OTPAuth.TOTP({ secret: OTPAuth.Secret.fromBase32(myTotp.totp_secret) });
                const delta = totp.validate({ token: otpInput, window: 3 });
                if (delta === null) {
                    setErrorMsg("Mã OTP không đúng! Thử lại."); setVerifying(false); return;
                }

                // Chống replay
                const tokenHash = currentUserId + "_" + otpInput + "_" + Math.floor(Date.now() / 30000);
                const { data: usedToken } = await supabase
                    .from('used_otp_tokens').select('id')
                    .eq('user_id', currentUserId).eq('token_hash', tokenHash)
                    .maybeSingle();
                if (usedToken) {
                    setErrorMsg("Mã OTP này đã được sử dụng! Vui lòng chờ mã mới.");
                    setVerifying(false); return;
                }
                await supabase.from('used_otp_tokens').insert({ user_id: currentUserId, token_hash: tokenHash });

                // Cập nhật signature_request
                const signedAt = new Date().toISOString();
                const { error } = await supabase.from('signature_requests')
                    .update({ trang_thai: 'da_ky', thoi_gian_ky: signedAt })
                    .eq('id', signatureRequest.id).eq('user_id', currentUserId);
                if (error) throw error;

                // Báo cho parent biết đã ký xong, kèm thông tin để hiển thị popup xác nhận
                onSuccess({
                    bien_ban: signatureRequest.bien_ban_khao_sat,
                    bien_ban_id: signatureRequest.bien_ban_id,
                    vai_tro: signatureRequest.vai_tro,
                    vai_tro_label: vaiTroLabel(signatureRequest.vai_tro),
                    thoi_gian_ky: signedAt,
                    ho_ten: myProfile.ho_ten
                });
            } catch (e) {
                setErrorMsg("Lỗi: " + e.message);
            } finally {
                setVerifying(false);
            }
        };

        if (!isOpen || !signatureRequest) return null;

        return (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[20000] animate-zoom-in">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-5 space-y-4">
                    <h4 className="font-bold text-gray-800 text-center text-base">Xác Nhận Ký Biên Bản</h4>
                    <div className="bg-gray-50 rounded-lg p-3 text-sm text-center border">
                        <div className="font-bold text-gray-700">{signatureRequest.bien_ban_khao_sat?.ma_tru || "Biên bản #" + signatureRequest.bien_ban_id}</div>
                        <div className="text-gray-500 text-xs mt-1">Vai trò: {vaiTroLabel(signatureRequest.vai_tro)}</div>
                    </div>
                    <div className="text-sm text-gray-600 text-center">Nhập mã 6 số từ <b>Google Authenticator</b> để xác nhận:</div>
                    <input
                        type="number"
                        className="w-full border-2 border-red-300 rounded-lg p-3 text-center text-2xl font-bold tracking-widest outline-none focus:border-red-500"
                        placeholder="000000"
                        value={otpInput}
                        onChange={e => setOtpInput(e.target.value.slice(0, 6))}
                        onKeyDown={e => e.key === 'Enter' && handleConfirm()}
                        autoFocus
                    />
                    {errorMsg && (
                        <div className="text-xs text-red-600 bg-red-50 border border-red-200 rounded p-2 text-center font-bold">
                            {errorMsg}
                        </div>
                    )}
                    <div className="flex gap-2">
                        <button onClick={onClose} className="flex-1 py-2 border border-gray-300 rounded-lg font-bold text-gray-600 hover:bg-gray-50">Hủy</button>
                        <button
                            onClick={handleConfirm}
                            disabled={verifying || otpInput.length !== 6}
                            className="flex-1 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 disabled:opacity-50 flex items-center justify-center gap-2"
                        >
                            {verifying ? <><div className="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> Đang xác minh...</> : "Xác Nhận Ký"}
                        </button>
                    </div>
                </div>
            </div>
        );
    };

// --- POPUP XÁC NHẬN ĐÃ KÝ THÀNH CÔNG ---
    const SignedSuccessModal = ({ isOpen, signedInfo, onClose, onViewReport }) => {

        const ngayThucHien = bb.ngay_thuc_hien

            : "---";

                                <div className="text-sm font-bold text-gray-800 flex-1">{bb.ma_tru || "---"}</div>

                            {bb.ten_tuyen && (
                                <div className="flex items-start gap-2">
                                    <div className="text-xs font-bold text-gray-500 uppercase w-24 shrink-0 pt-0.5">Công việc:</div>

                            <div className="flex items-start gap-2 border-t border-gray-100 pt-2 mt-2">

                    {/* FOOTER - 2 nút */}
                    <div className="p-4 bg-white border-t flex gap-2">

                            className="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-lg transition-colors"
                        >
                            Đóng
                        </button>
                        <button 
                            onClick={() => { onClose(); onViewReport(signedInfo.bien_ban_id); }} 
                            className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md"
