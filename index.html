                                    new TableCell({ children: [createPara("ĐƠN VỊ CÔNG TÁC", true, 24, AlignmentType.CENTER)] }),
                                    new TableCell({ children: [createPara("ĐƠN VỊ QLVH", true, 24, AlignmentType.CENTER)] }),
                                    new TableCell({ children: [createPara("ĐƠN VỊ LIÊN QUAN KHÁC", true, 24, AlignmentType.CENTER)] })
                                ] }),
                                new TableRow({ children: [
                                    // CỘT 1: DVCT
                                    new TableCell({ children: [
                                        ...(dvctSig ? [
                                            new Paragraph({
                                                alignment: AlignmentType.CENTER,
                                                children: [new window.docx.ImageRun({ data: dvctSig, transformation: { width: 120, height: 60 } })]
                                            }),
                                            createPara(sourceForm.dvct_daiDien1, true, 24, AlignmentType.CENTER)
                                        ] : [
                                            createPara("(Ký, ghi rõ họ tên)", false, 24, AlignmentType.CENTER, true),
                                            createPara("", false, 24), createPara("", false, 24), createPara("", false, 24),
                                            createPara(sourceForm.dvct_daiDien1, true, 24, AlignmentType.CENTER)
                                        ])
                                    ] }),
                                    // CỘT 2: QLVH
                                    new TableCell({ children: [
                                        ...(qlvhSig ? [
                                            new Paragraph({
                                                alignment: AlignmentType.CENTER,
                                                children: [new window.docx.ImageRun({ data: qlvhSig, transformation: { width: 120, height: 60 } })]
                                            }),
                                            createPara(sourceForm.qlvh_daiDien1, true, 24, AlignmentType.CENTER)
                                        ] : [
                                            createPara("(Ký, ghi rõ họ tên)", false, 24, AlignmentType.CENTER, true),
                                            createPara("", false, 24), createPara("", false, 24), createPara("", false, 24),
                                            createPara(sourceForm.qlvh_daiDien1, true, 24, AlignmentType.CENTER)
                                        ])
                                    ] }),
                                    // CỘT 3: LIÊN QUAN
                                    new TableCell({ children: [
                                        createPara("(Ký, ghi rõ họ tên)", false, 24, AlignmentType.CENTER, true),
                                        createPara("", false, 24), createPara("", false, 24), createPara("", false, 24),
                                        createPara("", true, 24, AlignmentType.CENTER)
                                    ] })
                                ] })
                            ]
                        }),

                        
                        createPara("", false, 24), createPara("", false, 24),
                        createPara("SƠ ĐỒ MỘT SỢI KẾT NỐI THIẾT BỊ, LƯỚI ĐIỆN NƠI LÀM VIỆC", true, 24, AlignmentType.CENTER),
                        createPara("(Kèm theo Biên bản khảo sát hiện trường)", false, 24, AlignmentType.CENTER, true),
                        diagramImage ? new Paragraph({ children: [ new window.docx.ImageRun({ data: diagramImage, transformation: { width: imgWidth, height: imgHeight } }) ], alignment: AlignmentType.CENTER }) : createPara("(Chưa có sơ đồ)", false, 24, AlignmentType.CENTER, true)
                    ]
                }]
            });
            Packer.toBlob(doc).then(blob => { saveAs(blob, filename); });
        };

        const [signatureStatus, setSignatureStatus] = useState([]);

        const fetchSignatureStatus = async (bienBanId) => {
            if (!bienBanId) return;
            const { data: sigRows } = await supabase
                .from('signature_requests')
                .select('id, user_id, vai_tro, thu_tu, trang_thai, thoi_gian_ky')
                .eq('bien_ban_id', bienBanId)
                .order('vai_tro')
                .order('thu_tu');

            let data = sigRows || [];
            if (data.length > 0) {
                const ids = data.map(s => s.user_id);
                const { data: profs } = await supabase
                    .from('profiles')
                    .select('id, ho_ten, email, chu_ky_url')
                    .in('id', ids);
                data = data.map(s => ({
                    ...s,
                    profiles: (profs || []).find(p => p.id === s.user_id) || {}
                }));
            }
            if (data) setSignatureStatus(data);
        };

        // Realtime cập nhật khi ai ký
        useEffect(() => {
            if (!currentReportId) { setSignatureStatus([]); return; }
            fetchSignatureStatus(currentReportId);
            const channel = supabase
                .channel('sig-status-' + currentReportId)
                .on('postgres_changes', {
                    event: '*', schema: 'public', table: 'signature_requests',
                    filter: `bien_ban_id=eq.${currentReportId}`
                }, () => fetchSignatureStatus(currentReportId))
                .subscribe();
            return () => supabase.removeChannel(channel);
        }, [currentReportId]);


      const handleSaveCloud = async () => {
            if (!confirm("Bạn có đồng ý lưu biên bản này và thoát ra màn hình chính không?")) return;
            
            // Kiểm tra dữ liệu bắt buộc
            if (!formData.loc_poleCode) { 
                alert("Vui lòng nhập Mã trụ trước khi lưu!"); 
                return;
            }

            // --- 1. TẠO CHUỖI ĐỊA ĐIỂM ĐẦY ĐỦ (Dùng làm ma_tru) ---
            const truStart = formData.loc_poleCode || "...";
            const subStart = formData.loc_subCode ? "/" + formData.loc_subCode : "";
            const tuyen = formData.loc_lineName || "...";
            
            let fullLocation = "";
            if (formData.is_range) {
                // Chế độ Từ... Đến...
                const truEnd = formData.loc_poleCode_to || "...";
                const subEnd = formData.loc_subCode_to ? "/" + formData.loc_subCode_to : "";
                fullLocation = `Từ trụ ${truStart}${subStart} đến trụ ${truEnd}${subEnd} tuyến ${tuyen}`;
            } else {
                // Chế độ Tại...
                fullLocation = `Tại trụ ${truStart}${subStart} tuyến ${tuyen}`;
            }

            // --- 2. KHAI BÁO PAYLOAD (Đây là phần bạn bị thiếu/lỗi) ---
            const payload = { 
                ma_tru: fullLocation,               // Lưu địa điểm hiển thị vào cột mã trụ
                ten_tuyen: formData.muc5_noiDung,   // Lưu nội dung công việc vào cột tên tuyến
                du_lieu_form: formData,             // Lưu toàn bộ dữ liệu gốc
                du_lieu_so_do: diagramData,         // Lưu sơ đồ
                updated_at: new Date().toISOString(),
                ngay_thuc_hien: formData.muc7_ngay  // Lưu ngày thực hiện để sắp xếp
            };
            
            // --- 3. GỌI SUPABASE ---
            let error;
            let newlyInsertedId = null;
            if (currentReportId) { 
                // Nếu đang sửa -> Update
                const res = await supabase.from('bien_ban_khao_sat').update(payload).eq('id', currentReportId); 
                error = res.error; 
            } else { 
            // Nếu tạo mới -> Insert, lấy luôn data trả về
            const res = await supabase.from('bien_ban_khao_sat').insert([payload]).select('id').single(); 
            error = res.error;
            if (res.data?.id) newlyInsertedId = res.data.id;
            }

            // --- 4. XỬ LÝ KẾT QUẢ ---
            if (error) {
                showToast("Lỗi khi lưu: " + error.message, "error");
            } else {
                // --- 5. TẠO SIGNATURE_REQUESTS CHO CÁC NGƯỜI CÓ TÀI KHOẢN ---
                // Lấy bien_ban_id: nếu đang sửa thì dùng currentReportId, nếu tạo mới thì dùng ID vừa insert
                let bienBanId = currentReportId || newlyInsertedId;

                if (bienBanId) {
                    // 1. Lấy danh sách signer ĐÃ KÝ - tuyệt đối không động đến
                    const { data: signedReqs } = await supabase
                        .from('signature_requests')
                        .select('user_id, vai_tro, thu_tu')
                        .eq('bien_ban_id', bienBanId)
                        .eq('trang_thai', 'da_ky');
                    const signed = signedReqs || [];
                    const keyOf = (s) => `${s.user_id}|${s.vai_tro}|${s.thu_tu}`;
                    const signedKeys = new Set(signed.map(keyOf));

                    // 2. Gom danh sách signer mới từ form
                    const formSigners = [
                        formData.dvct_userId1 && { user_id: formData.dvct_userId1, vai_tro: 'dvct', thu_tu: 1 },
                        formData.dvct_userId2 && { user_id: formData.dvct_userId2, vai_tro: 'dvct', thu_tu: 2 },
                        formData.qlvh_userId1 && { user_id: formData.qlvh_userId1, vai_tro: 'qlvh', thu_tu: 1 },
                        formData.qlvh_userId2 && { user_id: formData.qlvh_userId2, vai_tro: 'qlvh', thu_tu: 2 },
                        formData.qlvh_userId3 && { user_id: formData.qlvh_userId3, vai_tro: 'qlvh', thu_tu: 3 },
                    ].filter(Boolean);

                    // 3. XÓA TOÀN BỘ cho_ky cũ (RLS đã cho phép sau khi thêm sig_delete_by_owner)
                    await supabase.from('signature_requests')
                        .delete()
                        .eq('bien_ban_id', bienBanId)
                        .eq('trang_thai', 'cho_ky');

                    // 4. INSERT lại cho_ky mới, bỏ qua người đã ký
                    const toInsert = formSigners
                        .filter(s => !signedKeys.has(keyOf(s)))
                        .map(s => ({
                            bien_ban_id: bienBanId,
                            user_id: s.user_id,
                            vai_tro: s.vai_tro,
                            thu_tu: s.thu_tu,
                            trang_thai: 'cho_ky'
                        }));

                    if (toInsert.length > 0) {
                        const { error: insertErr } = await supabase
                            .from('signature_requests').insert(toInsert);
                        if (insertErr) console.error("Lỗi tạo signature_requests:", insertErr);
                    }
                }

                showToast("Đã lưu biên bản thành công!");
                setIsReadOnly(false);
                setShowReportList(true);
            }
        };

        const handleLoadReport = async (id, readOnly = false) => {
            const { data, error } = await supabase.from('bien_ban_khao_sat').select('*').eq('id', id).single();
            if (error) { showToast("Lỗi tải biên bản: " + error.message, "error"); }
            else if (data) {
                fetchSignatureStatus(id);
                const savedForm = data.du_lieu_form || {};
                setFormData({ 
                    ...DEFAULT_FORM_DATA, 
                    ...savedForm,
                    phieu_dgrr_ngay: savedForm.phieu_dgrr_ngay || getTodayISO(),
                    muc7_ngay: savedForm.muc7_ngay || getTodayISO()
                }); 
                setDiagramData(data.du_lieu_so_do || []); 
                setCurrentReportId(data.id);
                setCurrentMaDinhDanh(data.ma_dinh_danh || "");
                setIsReadOnly(readOnly);
                setShowReportList(false);
            }
        };

        const handleCopyReport = async (id) => {
            const { data, error } = await supabase.from('bien_ban_khao_sat').select('*').eq('id', id).single();
            if (error) { alert("Lỗi tải biên bản: " + error.message); return; }
            if (!data) return;

            const savedForm = data.du_lieu_form || {};

            // Giữ nguyên nội dung, reset những thứ cần điền lại
            setFormData({
                ...DEFAULT_FORM_DATA,
                ...savedForm,
                // Reset vị trí trụ + tuyến — người dùng tự điền lại
                loc_poleCode: "",
                loc_subCode: "",
                loc_poleCode_to: "",
                loc_subCode_to: "",
                loc_lineName: "",
                loc_commune: "",
                // Reset Mục 4 địa điểm
                muc4_diaDiem: "Tại",
                // Reset Mục 6 phạm vi
                muc6_phamVi: "",
                // Reset ngày về hôm nay
                ngay: getTodayVN().ngay,
                thang: getTodayVN().thang,
                nam: getTodayVN().nam,
                muc7_ngay: getTodayISO(),
                phieu_dgrr_ngay: getTodayISO(),
                // Reset ảnh — ảnh cũ thuộc biên bản gốc
                hinh_anh: [],
            });

            // Giữ sơ đồ nếu có (thường sơ đồ cũng giống nhau)
            setDiagramData(data.du_lieu_so_do || []);

            // Reset các trường liên quan đến biên bản mới
            setCurrentReportId(null);
            setCurrentMaDinhDanh("");
            setIsReadOnly(false);
            setSignatureStatus([]);
            setShowReportList(false);
        };

        const handleCreateNew = () => {
            // Reset sạch sẽ về mặc định
            setFormData({ ...DEFAULT_FORM_DATA, phieu_dgrr_ngay: getTodayISO(), muc7_ngay: getTodayISO() });
            setDiagramData([]); setCurrentReportId(null); setCurrentMaDinhDanh(""); 
            setIsReadOnly(false);
            setShowReportList(false);
        };

        // --- XỬ LÝ ẢNH (Upload lên Supabase) ---
        const handleImageUpload = async (e) => {
            const allFiles = Array.from(e.target.files);
            if (allFiles.length === 0) return;

            const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/heic'];
            const allowedExts = ['jpg', 'jpeg', 'png', 'webp', 'heic'];
            const files = allFiles.filter(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                if (!allowedTypes.includes(file.type) || !allowedExts.includes(ext)) {
                    alert(`File "${file.name}" không hợp lệ! Chỉ chấp nhận JPG, PNG, WEBP, HEIC.`);
                    return false;
                }
                if (file.size > 5 * 1024 * 1024) {
                    alert(`File "${file.name}" quá lớn! Tối đa 5MB.`);
                    return false;
                }
                return true;
            });
            if (files.length === 0) return;

            const bucketName = 'survey_images';
            
            // Upload từng ảnh
            const uploadPromises = files.map(async (file) => {
                const fileExt = file.name.split('.').pop().toLowerCase();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                const filePath = `${fileName}`;

                try {
                    const { data, error } = await supabase.storage.from(bucketName).upload(filePath, file);
                    
                    if (error) {
                        console.error("Upload lỗi:", error);
                        if (error.message.includes("Bucket not found")) {
                            alert("Chưa tạo Bucket! Hãy vào Supabase > Storage > Tạo bucket tên 'survey_images' và set Public.");
                        } else if (error.message.includes("policy")) {
                            alert("Lỗi quyền truy cập! Hãy vào Supabase > Storage > Policies > Tạo policy cho phép INSERT public.");
                        }
                        return null;
                    }

                    // Lấy URL public
                    const { data: publicUrlData } = supabase.storage.from(bucketName).getPublicUrl(filePath);
                    return publicUrlData.publicUrl;
                } catch (err) {
                    console.error("Lỗi hệ thống upload:", err);
                    return null;
                }
            });

            // Chờ tất cả ảnh upload xong
            const uploadedUrls = (await Promise.all(uploadPromises)).filter(url => url !== null);
            
            // Cập nhật state
            setFormData(prev => ({
                ...prev,
                hinh_anh: [...(prev.hinh_anh || []), ...uploadedUrls]
            }));
        };

        // --- HÀM XÓA ẢNH (ĐÃ SỬA: XÓA CẢ TRÊN CLOUD) ---
        const removeImage = async (index) => {
            const urlToDelete = formData.hinh_anh[index];
            
            // 1. Xác nhận trước khi xóa (tránh bấm nhầm)
            if(!confirm("Bạn chắc chắn muốn xóa ảnh này?")) return;

            // 2. Xóa file trên Supabase Storage TRƯỚC
            if (urlToDelete) {
                try {
                    const bucketName = 'survey_images';
                    const parts = urlToDelete.split(`${bucketName}/`);
                    if (parts.length > 1) {
                        const filePath = parts.pop();
                        const { error } = await supabase.storage.from(bucketName).remove([filePath]);
                        if (error) throw error;
                    }
                } catch (err) {
                    console.error("Lỗi xóa file cloud:", err);
                    alert("Xóa ảnh trên cloud thất bại! Vui lòng thử lại.");
                    return; // Dừng lại, không xóa trên UI
                }
            }

            // 3. Xóa khỏi giao diện SAU KHI cloud thành công
            const newImages = [...(formData.hinh_anh || [])];
            newImages.splice(index, 1);
            setFormData({ ...formData, hinh_anh: newImages });

        };

        const handleRiskTypeChange = (listKey, index, e) => {
            const riskId = parseInt(e.target.value); const riskObj = riskLibrary.risks.find(r => r.id === riskId); const newRisks = [...formData[listKey]];
            newRisks[index] = { ...newRisks[index], riskId: riskId, moiNguy: riskObj ? riskObj.ten_moi_nguy : "", bac: riskObj ? riskObj.bac_rr_mac_dinh : "", moTa: "", bienPhap: "" };
            setFormData({ ...formData, [listKey]: newRisks });
        };
        const openRiskModal = (listKey, index, field) => { const currentRow = formData[listKey][index]; const riskId = currentRow.riskId; if (!riskId) { alert("Vui lòng chọn 'Nhận diện mối nguy' trước."); return; } let options = field === 'moTa' ? riskLibrary.descriptions.filter(d => d.moi_nguy_id === riskId) : riskLibrary.measures.filter(m => m.moi_nguy_id === riskId); setModalConfig({ isOpen: true, rowIndex: index, type: field, listType: listKey, options: options, title: field === 'moTa' ? `Mô tả: ${currentRow.moiNguy}` : `Biện pháp: ${currentRow.moiNguy}`, currentValue: currentRow[field] }); };
        const saveModalSelection = (value) => { const { listType, rowIndex, type } = modalConfig; const newRisks = [...formData[listType]]; newRisks[rowIndex][type] = value; setFormData({ ...formData, [listType]: newRisks }); };
        const updateRiskRowManual = (listKey, index, field, value) => { const newRisks = [...formData[listKey]]; newRisks[index][field] = value; setFormData({ ...formData, [listKey]: newRisks }); };
        const addRiskRow = (type) => { const listKey = type === 'ATLD' ? 'ruiRo_ATLD' : 'ruiRo_VSLD'; setFormData({ ...formData, [listKey]: [...formData[listKey], { riskId: "", moiNguy: "", moTa: "", bac: "", bienPhap: "" }] }); };
        const removeRiskRow = (type, index) => { const listKey = type === 'ATLD' ? 'ruiRo_ATLD' : 'ruiRo_VSLD'; const newRisks = formData[listKey].filter((_, i) => i !== index); setFormData({...formData, [listKey]: newRisks}); };


        // Hàm chọn người ký từ profiles — tự link chức vụ, đơn vị, user_id
        const handleProfileChange = (nameKey, posKey, unitKey, userIdKey, value) => {
            const found = dbProfiles.find(p => p.ho_ten === value);
            const updates = { [nameKey]: value };
            if (found) {
                if (userIdKey) updates[userIdKey] = found.id;
                if (posKey && found.chuc_vu) updates[posKey] = found.chuc_vu;
                if (unitKey && found.don_vi) updates[unitKey] = found.don_vi;
            } else {
                // Nhập tay, xóa user_id đi
                if (userIdKey) updates[userIdKey] = null;
            }
            setFormData(prev => ({ ...prev, ...updates }));
        };

        // Nếu chưa đăng nhập thì hiện màn hình Login
        if (!isAuthenticated) return <LoginScreen onLogin={handleLogin} loading={isCheckingAuth} />;

        return (
            <ToastContext.Provider value={showToast}>
            <ToastContainer toasts={toasts} removeToast={removeToast} />
            <div className="pb-20">
                {/* --- MODAL PHÓNG TO ẢNH (MỚI - TOÀN MÀN HÌNH ĐEN) --- */}
                {zoomImage && (
                    <div className="fixed inset-0 z-[99999] bg-black flex flex-col items-center justify-center animate-zoom-in" onClick={() => setZoomImage(null)}>
                        {/* Toolbar trên cùng */}
                        <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent z-[99999] text-white">
                            <span className="text-sm font-medium opacity-70">Chạm vào nền để đóng</span>
                            <div className="flex gap-4">
                                <a href={zoomImage} target="_blank" className="flex items-center gap-1 font-bold text-blue-300 hover:text-white border border-blue-300 rounded px-3 py-1.5 text-xs bg-black/50 backdrop-blur-md" onClick={(e) => e.stopPropagation()}>
                                    <UI_Icons.Share2 size={16}/> Mở Ảnh Gốc (Zoom nét)
                                </a>
                                <button onClick={() => setZoomImage(null)} className="bg-white/20 rounded-full p-2 hover:bg-red-500 transition-colors backdrop-blur-md"><UI_Icons.X size={24}/></button>
                            </div>
                        </div>
                        
                        {/* Ảnh hiển thị full không padding, giữ nguyên tỉ lệ */}
                        <div className="w-full h-full flex items-center justify-center p-0 m-0 overflow-hidden">
                            <img 
                                src={zoomImage} 
                                className="max-w-full max-h-full object-contain" 
                                alt="Zoom View" 
                                onClick={(e) => e.stopPropagation()} // Bấm vào ảnh ko bị đóng
                            />
                        </div>
                    </div>
                )}

                {showDiagram && <DiagramEditor initialData={diagramData} onSave={(data) => setDiagramData(data)} onClose={() => setShowDiagram(false)} />}
                <RiskSelectModal isOpen={modalConfig.isOpen} onClose={() => setModalConfig({...modalConfig, isOpen: false})} title={modalConfig.title} options={modalConfig.options} selectedValues={modalConfig.currentValue} onSave={saveModalSelection} />
                
                {/* Modal Tạo Tài Khoản */}
                <CreateAccountModal isOpen={showCreateAccountModal} onClose={() => setShowCreateAccountModal(false)} />
                <ProfilePage
                    isOpen={showProfileModal}
                    onClose={() => setShowProfileModal(false)}
                    currentUserId={currentUserId}
                    currentUser={currentUser}
                />

                {/* Modal nhập OTP để ký */}
                <OtpSignModal
                    isOpen={!!signingRequest}
                    signatureRequest={signingRequest}
                    currentUserId={currentUserId}
                    onClose={() => setSigningRequest(null)}
                    onSuccess={(info) => { setSigningRequest(null); setSignedInfo(info); }}
                />

                {/* Modal xác nhận sau khi ký thành công */}
                <SignedSuccessModal
                    isOpen={!!signedInfo}
                    signedInfo={signedInfo}
                    onClose={() => setSignedInfo(null)}
                    onViewReport={(id) => { setSignedInfo(null); handleLoadReport(id, true); }}
                />
                
                {/* Modal Quản Lý Tài Khoản */}
                <AccountManagerModal isOpen={showAccountManagerModal} onClose={() => setShowAccountManagerModal(false)} currentUserId={currentUserId} />

                {/* Đã thêm onLogout và currentUser vào đây */}
                <ReportListPage 
                    isOpen={showReportList} 
                    onCreateNew={handleCreateNew} 
                    onLoad={handleLoadReport} 
                    onExport={handleExportDocx} 
                    onZoom={(url) => setZoomImage(url)} 
                    onLogout={handleLogout}
                    onOpenCreateAccount={() => setShowCreateAccountModal(true)}
                    onOpenAccountManager={() => setShowAccountManagerModal(true)}
                    onOpenProfile={() => setShowProfileModal(true)}
                    onSign={(sigReq) => setSigningRequest(sigReq)}
                    onCopy={handleCopyReport}
                    showToast={showToast}
                    pendingCount={pendingCount}
                    currentUser={currentUser}
                    currentUserId={currentUserId}
                    currentUserRole={currentUserRole}
                    dbProfiles={dbProfiles}
                />
                <RiskManagerModal isOpen={showRiskManager} onClose={() => setShowRiskManager(false)} onRefresh={refreshAllBackgroundData} existingRisks={riskLibrary.risks} />

                {/* Modal Quản lý Mẫu công việc */}
                <TemplateManagerModal 
                    isOpen={showTemplateManager} 
                    onClose={() => setShowTemplateManager(false)} 
                    onRefresh={refreshAllBackgroundData} 
                />

                {/* FOOTER - CHẾ ĐỘ CHỈ ĐỌC (Xem để ký) */}
                {isReadOnly ? (
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-between items-center z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                        <div className="text-xs text-gray-500 font-medium">
                            <span className="text-amber-600 font-bold flex items-center gap-1">
                                <UI_Icons.FileText size={14}/> Đang xem: {formData.loc_poleCode || "---"}
                            </span>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => { setIsReadOnly(false); setShowReportList(true); }} 
                                className="bg-gray-100 text-gray-600 px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-gray-200 border border-gray-300 text-xs md:text-sm"
                            >
                                <UI_Icons.X size={16}/> Đóng
                            </button>
                            <button 
                                onClick={() => handleExportDocx(null)} 
                                className="bg-blue-50 text-blue-700 border border-blue-200 px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-blue-100 text-xs md:text-sm"
                            >
                                <UI_Icons.Download size={16}/> <span className="hidden md:inline">Tải Word</span>
                            </button>
                            {/* Nút Ký chỉ hiện nếu user còn yêu cầu chờ ký trên biên bản này */}
                            {(() => {
                                const myReq = signatureStatus.find(s => s.user_id === currentUserId && s.trang_thai === 'cho_ky');
                                if (!myReq) return null;
                                return (
                                    <button 
                                        onClick={() => setSigningRequest({
                                            ...myReq,
                                            bien_ban_id: currentReportId,
                                            bien_ban_khao_sat: { 
                                                ma_tru: formData.loc_poleCode, 
                                                ten_tuyen: formData.muc5_noiDung, 
                                                ngay_thuc_hien: formData.muc7_ngay 
                                            }
                                        })} 
                                        className="bg-red-600 text-white px-5 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-red-700 active:scale-95 transition-all shadow-md"
                                    >
                                        <UI_Icons.Edit size={18}/> KÝ NGAY
                                    </button>
                                );
                            })()}
                        </div>
                    </div>
                ) : (
                    /* FOOTER - CHẾ ĐỘ SỬA/TẠO MỚI (giữ nguyên như cũ) */
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-between items-center z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                        <div className="text-xs text-gray-500 font-medium">{currentReportId ? <span className="text-blue-600 font-bold">Đang sửa: {formData.loc_poleCode}</span> : "Đang tạo mới"}</div>
                        <div className="flex gap-2">
                            <button 
                                onClick={async () => { 
                                    if(confirm("Dữ liệu chưa lưu sẽ mất. Bạn chắc chắn muốn thoát?")) {
                                        // NẾU ĐANG TẠO MỚI (Chưa có ID) -> Xóa sạch ảnh vừa up để tránh rác
                                        if (!currentReportId && formData.hinh_anh.length > 0) {
                                            const bucketName = 'survey_images';
                                            const pathsToDelete = formData.hinh_anh.map(url => url.split(`${bucketName}/`).pop());
                                            await supabase.storage.from(bucketName).remove(pathsToDelete);
                                            console.log("Đã dọn dẹp ảnh rác do hủy tạo mới");
                                        }
                                        setIsReadOnly(false);
                                        setShowReportList(true); 
                                    }
                                }}
                                className="bg-gray-100 text-gray-600 px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-gray-200 border border-gray-300 text-xs md:text-sm"
                            >
                                Hủy/Thoát
                            </button>

                            {/* --- NÚT QUẢN LÝ MẪU MỚI --- */}
                            <button 
                                onClick={() => setShowTemplateManager(true)} 
                                className="bg-purple-100 text-purple-700 px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-purple-200 border border-purple-300" 
                                title="Chỉnh sửa list Nội dung & Phạm vi"
                            >
                                <UI_Icons.Edit size={18}/> <span className="hidden md:inline">List Mẫu</span>
                            </button>

                            <button onClick={() => setShowRiskManager(true)} className="bg-orange-100 text-orange-700 px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-orange-200 border border-orange-300" title="Quản lý Mối Nguy"><UI_Icons.Plus size={18}/> <span className="hidden md:inline">Mối Nguy</span></button>
                            <button onClick={handleSaveCloud} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-green-700 active:scale-95 transition-all shadow-md"><UI_Icons.Save size={18}/> Lưu & Thoát</button>
                            <button onClick={() => handleExportDocx(null)} className="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-blue-700 shadow-md"><UI_Icons.Download size={18}/></button>
                        </div>
                    </div>
                )}

                {/* Banner cảnh báo chế độ chỉ đọc */}
                {isReadOnly && (
                    <div className="fixed top-0 left-0 right-0 bg-gradient-to-r from-amber-500 to-orange-500 text-white py-2 px-4 text-center text-sm font-bold shadow-md z-50 flex items-center justify-center gap-2">
                        <UI_Icons.FileText size={16}/> CHẾ ĐỘ XEM (CHỈ ĐỌC) - Không thể chỉnh sửa
                    </div>
                )}

                <div 
                    className="a4-paper"
                    style={isReadOnly ? { 
                        pointerEvents: 'none', 
                        userSelect: 'text',
                        marginTop: '40px',
                        opacity: 0.97
                    } : {}}

                    {currentMaDinhDanh && (
                        <div className="text-xs text-gray-400 font-mono text-right mb-2">

                        </div>
                    )}

                            <button 
                                onClick={() => setFormData({...formData, is_range: false})} 
                                className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all flex items-center gap-1.5 ${!formData.is_range ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                📍 Một trụ đơn
                            </button>
                            <button 
                                onClick={() => setFormData({...formData, is_range: true})} 
                                className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all flex items-center gap-1.5 ${formData.is_range ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                📏 Khoảng trụ (Từ... Đến...)
                            </button>
                        </div>

                        {/* Lưới nhập liệu */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4 mb-4">
                            
                            {/* Thời gian & Khu vực */}
                            <div className="flex flex-col gap-1.5">
                                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">Thời gian & Xã/Phường</label>
                                <div className="flex gap-2 items-center border border-gray-300 rounded-lg p-2 bg-gray-50 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 focus-within:bg-white transition-all">
                                    <UI_Icons.Target size={16} className="text-gray-400 shrink-0"/>
                                    <TimeSelect value={formData.gioKhaoSat} onChange={(val) => setFormData({...formData, gioKhaoSat: val})} />
                                    <span className="text-gray-300 font-light text-lg">|</span>
                                    <select className="flex-1 bg-transparent font-bold text-blue-800 outline-none text-sm w-full truncate" value={formData.loc_commune} onChange={e => setFormData({...formData, loc_commune: e.target.value})}>
                                        <option value="">-- Chọn xã --</option>
                                        {dbCommunes.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                                    </select>
                                </div>
                            </div>

                            {/* Tuyến */}
                            <div className="flex flex-col gap-1.5">
                                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">Thuộc tuyến lưới điện</label>
                                <div className="flex gap-2 items-center border border-gray-300 rounded-lg p-2 bg-gray-50 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 focus-within:bg-white transition-all">
                                    <UI_Icons.Zap size={16} className="text-gray-400 shrink-0"/>
                                    <input 
                                        list="line-list" 
                                        className="flex-1 bg-transparent font-bold text-blue-800 outline-none text-sm w-full" 
                                        value={formData.loc_lineName} 
                                        onChange={e => {
                                            const selectedLine = e.target.value;
                                            // Tìm xem tuyến này tương ứng với mã trụ gốc nào trong DB
                                            const foundPole = dbPoles.find(p => p.line_name === selectedLine);
                                            
                                            setFormData({
                                                ...formData, 
                                                loc_lineName: selectedLine,
                                                // Nếu tìm thấy, tự động điền mã trụ vào cả ô bắt đầu và ô kết thúc
                                                loc_poleCode: foundPole ? foundPole.code : formData.loc_poleCode,
                                                loc_poleCode_to: foundPole ? foundPole.code : formData.loc_poleCode_to
                                            });
                                        }} 
                                        placeholder="Ví dụ: 478 Cái Dầu..." 
                                    />
                                </div>
                            </div>

                            {/* Trụ bắt đầu */}
                            <div className="flex flex-col gap-1.5">
                                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">{formData.is_range ? "Bắt đầu từ trụ" : "Vị trí tại trụ"}</label>
                                <div className="flex gap-2 items-center border border-gray-300 rounded-lg p-2 bg-gray-50 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 focus-within:bg-white transition-all">
                                    <span className="font-bold text-gray-600 text-sm">Trụ</span>
                                    <input list="pole-list" className="w-16 md:w-20 bg-transparent font-bold text-blue-800 outline-none text-sm text-center border-b border-gray-400 focus:border-blue-600" value={formData.loc_poleCode} onChange={handlePoleChange} placeholder="Mã..." />
                                    <span className="font-bold text-gray-400">/</span>
                                    <input className="flex-1 bg-transparent font-bold text-blue-800 outline-none text-sm border-b border-gray-400 focus:border-blue-600" value={formData.loc_subCode} onChange={e => setFormData({...formData, loc_subCode: e.target.value})} placeholder="Số nhánh (nếu có)..." />
                                </div>
                            </div>

                            {/* Trụ kết thúc (Chỉ hiện khi gạt sang chế độ Khoảng trụ) */}
                            {formData.is_range && (
                                <div className="flex flex-col gap-1.5 animate-zoom-in">
                                    <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">Đến trụ kết thúc</label>
                                    <div className="flex gap-2 items-center border border-gray-300 rounded-lg p-2 bg-gray-50 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 focus-within:bg-white transition-all">
                                        <span className="font-bold text-gray-600 text-sm">Trụ</span>
                                        <input list="pole-list" className="w-16 md:w-20 bg-transparent font-bold text-blue-800 outline-none text-sm text-center border-b border-gray-400 focus:border-blue-600" value={formData.loc_poleCode_to} onChange={e => setFormData({...formData, loc_poleCode_to: e.target.value})} placeholder="Mã..." />
                                        <span className="font-bold text-gray-400">/</span>
                                        <input className="flex-1 bg-transparent font-bold text-blue-800 outline-none text-sm border-b border-gray-400 focus:border-blue-600" value={formData.loc_subCode_to} onChange={e => setFormData({...formData, loc_subCode_to: e.target.value})} placeholder="Số nhánh (nếu có)..." />
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Khung Real-time Preview (Đã chỉnh cỡ chữ, màu sắc và xóa dòng nhắc Word) */}
                        {(() => {
                            const truStart = formData.loc_poleCode || "[...]";
                            const subStart = formData.loc_subCode ? "/" + formData.loc_subCode : "";
                            const tuyen = formData.loc_lineName || "[...]";
                            const xa = formData.loc_commune || "[...]";
                            
                            let textDiaDiem = "";
                            if (formData.is_range) {
                                const truEnd = formData.loc_poleCode_to || "[...]";
                                const subEnd = formData.loc_subCode_to ? "/" + formData.loc_subCode_to : "";
                                textDiaDiem = `từ trụ ${truStart}${subStart} đến trụ ${truEnd}${subEnd}`;
                            } else {
                                textDiaDiem = `tại trụ ${truStart}${subStart}`;
                            }

                            return (
                                <div className="bg-gray-50 border-l-4 border-gray-400 p-4 rounded-r-lg mt-4">
                                    <p className="text-justify text-black font-normal text-[15px] leading-7">
                                        Vào hồi {formData.gioKhaoSat || "..."}, {textDiaDiem} tuyến {tuyen}, xã {xa}, tỉnh An Giang.
                                    </p>
                                </div>
                            );
                        })()}
                    </div>

                    <div className="mb-2 font-bold">Chúng tôi gồm:</div>
                    {/* Sửa lại datalist nhân viên để đọc từ Object */}
                    <datalist id="pole-list">{dbPoles.map(p => <option key={p.code} value={p.code} />)}</datalist>
                    <datalist id="line-list">{[...new Set(dbPoles.map(p => p.line_name))].map((l, i) => <option key={i} value={l} />)}</datalist>
                    <datalist id="profiles-list">{dbProfiles.map((p, i) => <option key={i} value={p.ho_ten} />)}</datalist>

                    <div className="mb-4 pl-4">
                        <div className="font-bold">1. Đại diện Đơn vị công tác:</div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pl-4 mt-2">
                            <div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300">
                                <div className="flex gap-2 items-center">
                                    <span className="font-semibold text-sm">1.1 Ông (Bà):</span>
                                    <input list="profiles-list" className="input-line flex-grow font-bold text-blue-800" value={formData.dvct_daiDien1} onChange={e => handleProfileChange('dvct_daiDien1', 'dvct_chucVu1', null, 'dvct_userId1', e.target.value)} placeholder="Nhập/Chọn tên..." />
                                    {formData.dvct_userId1 && <span title="Có tài khoản, có thể ký điện tử" className="text-green-500 text-xs">✓</span>}
                                </div>
                                <div className="flex gap-2 items-center"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line flex-grow bg-transparent" value={formData.dvct_chucVu1} onChange={e => setFormData({...formData, dvct_chucVu1: e.target.value})} placeholder="Chọn..." /></div>
                            </div>
                            <div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300">
                                <div className="flex gap-2 items-center">
                                    <span className="font-semibold text-sm">1.2 Ông (Bà):</span>
                                    <input list="profiles-list" className="input-line flex-grow font-bold text-blue-800" value={formData.dvct_daiDien2} onChange={e => handleProfileChange('dvct_daiDien2', 'dvct_chucVu2', null, 'dvct_userId2', e.target.value)} placeholder="Nhập/Chọn tên..." />
                                    {formData.dvct_userId2 && <span title="Có tài khoản, có thể ký điện tử" className="text-green-500 text-xs">✓</span>}
                                </div>
                                <div className="flex gap-2 items-center"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line flex-grow bg-transparent" value={formData.dvct_chucVu2} onChange={e => setFormData({...formData, dvct_chucVu2: e.target.value})} placeholder="Chọn..." /></div>
                            </div>
                        </div>
                    </div>

                    {/* --- MỤC 2: ĐẠI DIỆN QLVH --- */}
                    <div className="mb-4 pl-4">
                        <div className="font-bold">2. Đại diện (các) Đơn vị QLVH:</div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pl-4 mt-2">
                            
                            {/* Ô 2.1 */}
                            <div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300">
                                <div className="flex gap-2 items-center">
                                    <span className="font-semibold text-sm">2.1 Ông (Bà):</span>
                                    <input list="profiles-list" className="input-line flex-grow font-bold text-blue-800" value={formData.qlvh_daiDien1} onChange={e => handleProfileChange('qlvh_daiDien1', 'qlvh_chucVu1', 'qlvh_donVi1', 'qlvh_userId1', e.target.value)} placeholder="Nhập tên..." />
                                    {formData.qlvh_userId1 && <span title="Có tài khoản, có thể ký điện tử" className="text-green-500 text-xs">✓</span>}
                                </div>
                                <div className="flex gap-2"><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line bg-transparent" value={formData.qlvh_chucVu1} onChange={e => setFormData({...formData, qlvh_chucVu1: e.target.value})} /></div><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Đơn vị:</span><input list="unit-list" className="input-line bg-transparent" value={formData.qlvh_donVi1} onChange={e => setFormData({...formData, qlvh_donVi1: e.target.value})} /></div></div>
                            </div>

                            {/* Ô 2.2 */}
                            <div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300">
                                <div className="flex gap-2 items-center">
                                    <span className="font-semibold text-sm">2.2 Ông (Bà):</span>
                                    <input list="profiles-list" className="input-line flex-grow font-bold text-blue-800" value={formData.qlvh_daiDien2} onChange={e => handleProfileChange('qlvh_daiDien2', 'qlvh_chucVu2', 'qlvh_donVi2', 'qlvh_userId2', e.target.value)} placeholder="Nhập tên..." />
                                    {formData.qlvh_userId2 && <span title="Có tài khoản, có thể ký điện tử" className="text-green-500 text-xs">✓</span>}
                                </div>
                                <div className="flex gap-2"><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line bg-transparent" value={formData.qlvh_chucVu2} onChange={e => setFormData({...formData, qlvh_chucVu2: e.target.value})} /></div><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Đơn vị:</span><input list="unit-list" className="input-line bg-transparent" value={formData.qlvh_donVi2} onChange={e => setFormData({...formData, qlvh_donVi2: e.target.value})} /></div></div>
                            </div>

                            {/* Ô 2.3 */}
                            <div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300">
                                <div className="flex gap-2 items-center">
                                    <span className="font-semibold text-sm">2.3 Ông (Bà):</span>
                                    <input list="profiles-list" className="input-line flex-grow font-bold text-blue-800" value={formData.qlvh_daiDien3} onChange={e => handleProfileChange('qlvh_daiDien3', 'qlvh_chucVu3', 'qlvh_donVi3', 'qlvh_userId3', e.target.value)} placeholder="Nhập tên (nếu có)..." />
                                    {formData.qlvh_userId3 && <span title="Có tài khoản, có thể ký điện tử" className="text-green-500 text-xs">✓</span>}
                                </div>
                                <div className="flex gap-2"><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line bg-transparent" value={formData.qlvh_chucVu3} onChange={e => setFormData({...formData, qlvh_chucVu3: e.target.value})} /></div><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Đơn vị:</span><input list="unit-list" className="input-line bg-transparent" value={formData.qlvh_donVi3} onChange={e => setFormData({...formData, qlvh_donVi3: e.target.value})} /></div></div>
                            </div>

                        </div>
                    </div>

                    <div className="mb-4 pl-4"><div className="font-bold">3. Đại diện các đơn vị có liên quan:</div><textarea className="input-line pl-4 resize-none" rows="2" value={formData.dv_lienQuan} onChange={e => setFormData({...formData, dv_lienQuan: e.target.value})} placeholder="..."></textarea></div>


                  <div className="mb-4 text-justify text-black font-normal">Cùng nhau khảo sát thực tế, trao đổi và thống nhất phân công trách nhiệm thực hiện những nội dung để đảm bảo an toàn về điện cho Đơn vị công tác khi tiến hành công việc, cụ thể như sau:</div>

                    {/* WRAPPER BAO GỒM MỤC 4, 5, 6, 7 */}

                            </div>
                            <textarea 
                                className="input-line w-full resize-none font-medium text-blue-900" 
                                rows="2" 
                                value={formData.muc4_diaDiem} 
                                onChange={e => setFormData({...formData, muc4_diaDiem: e.target.value})}
                            ></textarea>
                        </div>

                        {/* --- MỤC 5 --- */}
                        <div className="mb-4">
                            <div className="flex flex-wrap items-center gap-2 mb-1">
                                <span className="font-bold">5. Nội dung công việc:</span>

                                    <option value="">-- Chọn mẫu --</option>

                                </select>
                                <button 
                                    onClick={() => {
                                        if(!selectedTaskTemplate) return;
                                        const newValue = formData.muc5_noiDung ? formData.muc5_noiDung + ", " + selectedTaskTemplate : selectedTaskTemplate;
                                        setFormData({...formData, muc5_noiDung: newValue});
                                    }}
                                    className="bg-blue-600 text-white px-3 py-1 rounded text-sm font-bold hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-1"
                                >
                                    <UI_Icons.Plus size={14}/> Dán
                                </button>
                            </div>
                            <textarea 
                                className="input-line w-full resize-none font-medium text-blue-900" 
                                rows="2" 
                                value={formData.muc5_noiDung} 
                                onChange={e => setFormData({...formData, muc5_noiDung: e.target.value})}
                            ></textarea>
                        </div>      

                        {/* --- MỤC 6 --- */}
                        <div>
                            <div className="flex flex-wrap items-center gap-2 mb-1">
                                <span className="font-bold">6. Phạm vi làm việc:</span>
                                
                                {/* Nút tự động điền Trụ/Tuyến (Giữ nguyên vì rất tiện) */}
                                <button 
                                    onClick={() => {
                                        const truStart = formData.loc_poleCode || "...";
                                        const subStart = formData.loc_subCode ? "/" + formData.loc_subCode : ""; 
                                        const tuyen = formData.loc_lineName || "...";
                                        let textAuto = "";
                                        if (formData.is_range) {
                                            const truEnd = formData.loc_poleCode_to || "...";
                                            const subEnd = formData.loc_subCode_to ? "/" + formData.loc_subCode_to : "";
                                            textAuto = `Từ trụ ${truStart}${subStart} đến trụ ${truEnd}${subEnd} tuyến ${tuyen}`;
                                        } else {
                                            textAuto = `Tại trụ ${truStart}${subStart} tuyến ${tuyen}`;
                                        }
                                        const cur = formData.muc6_phamVi;
                                        setFormData({
                                            ...formData, 
                                            muc6_phamVi: cur ? cur + " " + textAuto : textAuto
                                        });
                                    }}
                                    className="bg-blue-600 text-white px-2 py-0.5 rounded text-xs font-bold hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-1 shadow-sm"
                                    title="Tự động điền phạm vi trụ/tuyến"
                                >
                                    <UI_Icons.Plus size={12}/> Trụ/Tuyến
                                </button>
                            </div>
                            
                            <textarea 
                                className="input-line w-full resize-none font-medium text-blue-800" 
                                rows="2" 
                                value={formData.muc6_phamVi} 
                                onChange={e => setFormData({...formData, muc6_phamVi: e.target.value})}
                            ></textarea>
                        </div>
                    
                        {/* --- MỤC 7 --- */}
                        <div>
                            <span className="font-bold">7. Thời gian tiến hành công việc:</span>
                            <div className="flex flex-wrap items-center gap-2 mt-1">Từ <div className="mx-1"><TimeSelect value={formData.muc7_thoiGianTu} onChange={(val) => setFormData({...formData, muc7_thoiGianTu: val})} /></div>đến <div className="mx-1"><TimeSelect value={formData.muc7_thoiGianDen} onChange={(val) => setFormData({...formData, muc7_thoiGianDen: val})} /></div>, ngày <input type="date" className="border-b border-gray-300 font-bold bg-transparent outline-none px-1 text-blue-800" value={formData.muc7_ngay} onChange={e => setFormData({...formData, muc7_ngay: e.target.value})} /></div>
                        </div>
                    </div> {/* KẾT THÚC WRAPPER MỤC 4,5,6,7 */}

                    {/* --- MỤC 8 MỚI GỘP --- */}
                    <div className="mb-6">
                        <div className="font-bold mb-2">8. Đánh giá rủi ro / Trách nhiệm của các đơn vị liên quan:</div>
                        {/* Bọc bảng trong thẻ div cho phép trượt ngang trên Mobile */}
                        <div className="w-full overflow-x-auto pb-4 no-scrollbar">
                            <table className="w-full border-collapse table-fixed min-w-[800px] lg:min-w-full">
                            <thead>
                                <tr>
                                    <th className="w-10 border border-gray-300 bg-gray-100 p-2 text-center">STT</th>
                                    <th className="w-1/3 border border-gray-300 bg-gray-100 p-2 text-center">Công việc, vị trí và nhận diện mối nguy</th>
                                    <th className="w-1/3 border border-gray-300 bg-gray-100 p-2 text-center">Biện pháp an toàn</th>
                                    <th className="border border-gray-300 bg-gray-100 p-2 text-center">Đơn vị thực hiện</th>
                                    <th className="w-8 border border-gray-300 bg-gray-100 p-2"></th>
                                </tr>
                            </thead>
                            <tbody>
                                {formData.muc8_bangData.map((row, index) => (
                                    <tr key={index}>
                                        <td className="border border-gray-300 text-center font-bold">{index + 1}</td>
                                        

                                        {/* CỘT 2: CÔNG VIỆC VÀ MỐI NGUY (Đã nâng cấp Modal Tìm Kiếm & Accordion) */}
                                        <td className="border border-gray-300 p-2 align-top relative">
                                            <div className="flex flex-col gap-2 mb-2 pb-2 border-b border-gray-100 w-full max-w-full">
                                                
                                                {/* Nút dán kết hợp Mục 5 & Mục 6 */}
                                                <button 
                                                    onClick={() => {
                                                        const muc5 = formData.muc5_noiDung ? formData.muc5_noiDung.trim() : "";
                                                        let muc6 = formData.muc6_phamVi ? formData.muc6_phamVi.trim() : "";
                                                        if (muc6.length > 0) muc6 = muc6.charAt(0).toLowerCase() + muc6.slice(1);
                                                        
                                                        let textToAdd = "";
                                                        if (muc5 || muc6) {
                                                            let combined = `- ${muc5} ${muc6}`.trim();
                                                            if (!combined.endsWith('.')) combined += '.';
                                                            textToAdd = combined;
                                                        }
                                                        if (!textToAdd) return; 
                                                        
                                                        const newData = [...formData.muc8_bangData];
                                                        newData[index].congViec = newData[index].congViec ? `${newData[index].congViec}\n${textToAdd}` : textToAdd;
                                                        setFormData({...formData, muc8_bangData: newData});
                                                    }}
                                                    className="tag-btn text-xs self-start w-fit bg-green-50 text-green-700 border-green-200 shrink-0 mb-1"
                                                    title="Tự động ghép: - [Mục 5] [mục 6]"
                                                >
                                                    <UI_Icons.Plus size={14}/> Dán Nội dung công việc
                                                </button>

                                                {/* --- NÚT MỞ CỬA SỔ TÌM KIẾM --- */}
                                                <button 
                                                    onClick={() => {
                                                        const newData = [...formData.muc8_bangData];
                                                        newData[index].isModalOpen = true; 
                                                        setFormData({...formData, muc8_bangData: newData});
                                                    }}
                                                    className="bg-purple-600 text-white w-full py-2 rounded-lg text-sm font-bold hover:bg-purple-700 active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2"
                                                >
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                                    Chọn Mối nguy & Biện pháp
                                                </button>

                                                {/* --- MODAL CHỌN MỐI NGUY (ĐÃ NÂNG CẤP TABS TA/HA) --- */}
                                                {row.isModalOpen && (
                                                    <div className="fixed inset-0 z-[9999] bg-black/60 flex items-center justify-center p-4 animate-zoom-in" style={{ margin: 0 }} onClick={() => {
                                                        const newData = [...formData.muc8_bangData];
                                                        newData[index].isModalOpen = false; 
                                                        newData[index].searchRisk = ""; // Reset thanh tìm kiếm khi đóng
                                                        setFormData({...formData, muc8_bangData: newData});
                                                    }}>
                                                        
                                                        {/* Khung nội dung chính */}
                                                        <div className="bg-white border border-gray-200 rounded-xl flex flex-col shadow-2xl w-full max-w-3xl max-h-[85vh] overflow-hidden" onClick={e => e.stopPropagation()}>
                                                            
                                                            {/* Header của Popup */}
                                                            <div className="text-sm md:text-base font-bold text-white px-4 py-3 bg-blue-600 flex justify-between items-center shrink-0">
                                                                <span className="truncate pr-2 uppercase">CHỌN MỐI NGUY & BIỆN PHÁP</span>
                                                                <button 
                                                                    onClick={() => {
                                                                        const newData = [...formData.muc8_bangData];
                                                                        newData[index].isModalOpen = false;
                                                                        newData[index].searchRisk = "";
                                                                        setFormData({...formData, muc8_bangData: newData});
                                                                    }}
                                                                    className="hover:bg-red-500 hover:text-white bg-blue-700 p-1.5 rounded-lg cursor-pointer transition-colors shrink-0"
                                                                >
                                                                    <UI_Icons.X size={18}/>
                                                                </button>
                                                            </div>

                                                            {/* --- 3 TABS LỌC CẤP ĐIỆN ÁP --- */}
                                                            <div className="flex bg-white border-b border-gray-200 shrink-0">
                                                                <button 
                                                                    onClick={() => { const d=[...formData.muc8_bangData]; d[index].activeTab='ALL'; setFormData({...formData, muc8_bangData: d}); }} 
                                                                    className={`flex-1 py-2.5 text-sm font-bold text-center border-b-2 transition-colors ${(!row.activeTab || row.activeTab === 'ALL') ? 'border-blue-600 text-blue-700 bg-blue-50/50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`}
                                                                >
                                                                    ⚡ Tất cả
                                                                </button>
                                                                <button 
                                                                    onClick={() => { const d=[...formData.muc8_bangData]; d[index].activeTab='TA'; setFormData({...formData, muc8_bangData: d}); }} 
                                                                    className={`flex-1 py-2.5 text-sm font-bold text-center border-b-2 transition-colors ${row.activeTab === 'TA' ? 'border-red-500 text-red-600 bg-red-50/50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`}
                                                                >
                                                                    🔴 Trung Áp
                                                                </button>
                                                                <button 
                                                                    onClick={() => { const d=[...formData.muc8_bangData]; d[index].activeTab='HA'; setFormData({...formData, muc8_bangData: d}); }} 
                                                                    className={`flex-1 py-2.5 text-sm font-bold text-center border-b-2 transition-colors ${row.activeTab === 'HA' ? 'border-green-500 text-green-600 bg-green-50/50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`}
                                                                >
                                                                    🔵 Hạ Áp
                                                                </button>
                                                            </div>

                                                            {/* THANH TÌM KIẾM (SEARCH BAR) */}

                                                                <div className="relative">
                                                                    <input 
                                                                        type="text" 
                                                                        className="w-full border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm font-bold text-blue-900 shadow-inner transition-all"
                                                                        placeholder="Nhập loại công việc để tìm nhanh..."
                                                                        value={row.searchRisk || ""}
                                                                        onChange={e => {
                                                                            const newData = [...formData.muc8_bangData];
                                                                            newData[index].searchRisk = e.target.value; 
                                                                            setFormData({...formData, muc8_bangData: newData});
                                                                        }}
                                                                        autoFocus
                                                                    />
                                                                    <div className="absolute left-3 top-3 text-gray-400">
                                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            {/* PHẦN THÂN: DANH SÁCH LOẠI CÔNG VIỆC TÌM ĐƯỢC */}
                                                            <div className="overflow-y-auto p-3 flex flex-col gap-2.5 w-full bg-gray-100 flex-1 min-h-0">
                                                                {(() => {
                                                                    const currentTab = row.activeTab || 'ALL';

                                                                    // Lọc danh sách theo TỪ KHÓA và CẤP ĐIỆN ÁP
                                                                    const filteredRisks = riskLibrary.risks.filter(r => {
                                                                        const matchSearch = r.ten_moi_nguy.toLowerCase().includes((row.searchRisk || "").toLowerCase());
                                                                        const matchTab = currentTab === 'ALL' || r.cap_dien_ap === currentTab;
                                                                        const isChung = !r.cap_dien_ap; // Các mục Chung luôn hiện
                                                                        
                                                                        return matchSearch && (matchTab || isChung);
                                                                    });

                                                                    if (filteredRisks.length === 0) {
                                                                        return <div className="text-center text-gray-400 italic py-6">Không tìm thấy công việc phù hợp trong mục này.</div>;
                                                                    }

                                                                    return filteredRisks.map(r => (
                                                                        <div key={r.id} className="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm transition-all shrink-0">
                                                                            
                                                                            {/* Header của Nhóm Công Việc (Click để mở rộng) */}
                                                                            <div 
                                                                                className={`p-3 font-bold text-sm md:text-base cursor-pointer flex justify-between items-center transition-colors ${row.tempRiskId === r.id ? 'bg-blue-50 text-blue-700 border-b border-blue-100' : 'text-gray-700 hover:bg-gray-50'}`}
                                                                                onClick={() => {
                                                                                    const newData = [...formData.muc8_bangData];
                                                                                    newData[index].tempRiskId = row.tempRiskId === r.id ? null : r.id; 
                                                                                    setFormData({...formData, muc8_bangData: newData});
                                                                                }}
                                                                            >
                                                                                <span className="flex items-center gap-2">
                                                                                    <UI_Icons.FolderOpen size={16} />
                                                                                    {r.ten_moi_nguy}
                                                                                    {r.cap_dien_ap === 'TA' && <span className="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded border border-red-200 ml-1 shrink-0">TA</span>}
                                                                                    {r.cap_dien_ap === 'HA' && <span className="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded border border-green-200 ml-1 shrink-0">HA</span>}
                                                                                </span>
                                                                                <div className={`transform transition-transform shrink-0 ${row.tempRiskId === r.id ? 'rotate-180' : ''}`}>
                                                                                    {row.tempRiskId === r.id ? <UI_Icons.Minus size={18}/> : <UI_Icons.Plus size={18}/>}
                                                                                </div>
