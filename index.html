// (Đã xóa PendingSignPage cũ - tab Chờ Ký nay là filter trên danh sách chính, logic ký đã chuyển sang OtpSignModal)

    // --- COMPONENT TRANG HỒ SƠ CÁ NHÂN ---
    const ProfilePage = ({ isOpen, onClose, currentUserId, currentUser }) => {
        const [profile, setProfile] = useState(null);
        const [loading, setLoading] = useState(false);
        const [message, setMessage] = useState({ text: "", type: "" });
        const [sigFile, setSigFile] = useState(null);
        const [sigPreview, setSigPreview] = useState(null);
        const [uploadingImg, setUploadingImg] = useState(false);
        const [totpStep, setTotpStep] = useState("idle");
        const [totpSecret, setTotpSecret] = useState("");
        const [otpInput, setOtpInput] = useState("");
        const [verifying, setVerifying] = useState(false);

        useEffect(() => {
            if (isOpen && currentUserId) fetchProfile();
        }, [isOpen, currentUserId]);

        const fetchProfile = async () => {
            setLoading(true);
            const { data: profileData } = await supabase
                .from('profiles')
                .select('ho_ten, email, chuc_vu, don_vi, chu_ky_url')
                .eq('id', currentUserId)
                .maybeSingle();

            const { data: totpData } = await supabase
                .from('user_totp')
                .select('totp_enabled')
                .eq('user_id', currentUserId)
                .maybeSingle();

            if (profileData) setProfile({ 
                ...profileData, 
                totp_enabled: totpData?.totp_enabled || false 
            });
            setLoading(false);
        };

        const showMsg = (text, type = "success") => {
            setMessage({ text, type });
            setTimeout(() => setMessage({ text: "", type: "" }), 3500);
        };

        const handleSigFileChange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
            if (!allowedTypes.includes(file.type)) return showMsg("Chỉ chấp nhận file JPG, PNG, WEBP!", "error");
            const allowedExts = ['jpg', 'jpeg', 'png', 'webp'];
            const ext = file.name.split('.').pop().toLowerCase();
            if (!allowedExts.includes(ext)) return showMsg("Phần mở rộng file không hợp lệ!", "error");
            if (file.size > 2 * 1024 * 1024) return showMsg("File quá lớn! Tối đa 2MB.", "error");
            setSigFile(file);
            setSigPreview(URL.createObjectURL(file));
        };

        const handleUploadSignature = async () => {
            if (!sigFile) return;
            setUploadingImg(true);
            try {
                const ext = sigFile.name.split('.').pop();
                const filePath = `${currentUserId}/${currentUserId}.${ext}`;
                await supabase.storage.from('chu-ky').remove([filePath]);
                const { error: uploadError } = await supabase.storage
                    .from('chu-ky')
                    .upload(filePath, sigFile, { upsert: true });
                if (uploadError) throw uploadError;
                const { data: urlData } = supabase.storage.from('chu-ky').getPublicUrl(filePath);
                const { error: updateError } = await supabase
                    .from('profiles')
                    .update({ chu_ky_url: urlData.publicUrl })
                    .eq('id', currentUserId);
                if (updateError) throw updateError;
                setSigFile(null);
                setSigPreview(null);
                showMsg("Đã lưu chữ ký thành công!");
                fetchProfile();
            } catch (e) {
                showMsg("Lỗi upload: " + e.message, "error");
            } finally {
                setUploadingImg(false);
            }
        };

        const handleStartTOTP = async () => {
            if (!window.OTPAuth) return showMsg("Thư viện OTP chưa tải xong, thử lại!", "error");
            const secret = new OTPAuth.Secret({ size: 20 });
            const secretStr = secret.base32;
            setTotpSecret(secretStr);
            setOtpInput("");
            setTotpStep("qr");
            const otpauthUri = `otpauth://totp/KSHT:${currentUser}?secret=${secretStr}&issuer=KhaoSatHienTruong`;
            setTimeout(() => {
                const canvas = document.getElementById('qrcode-canvas');
                if (canvas && window.QRCode) {
                    QRCode.toCanvas(canvas, otpauthUri, { width: 200 }, (err) => {
                        if (err) console.error("QR error:", err);
                    });
                }
            }, 150);
        };

        const handleVerifyTOTP = async () => {
            if (otpInput.length !== 6) return showMsg("Nhập đủ 6 chữ số!", "error");
            setVerifying(true);
            try {
                const totp = new OTPAuth.TOTP({ secret: OTPAuth.Secret.fromBase32(totpSecret) });
                const delta = totp.validate({ token: otpInput, window: 3 });
                if (delta === null) { showMsg("Mã OTP không đúng! Thử lại.", "error"); setVerifying(false); return; }
                const { error } = await supabase
                    .from('user_totp')
                    .upsert({ 
                        user_id: currentUserId, 
                        totp_secret: totpSecret, 
                        totp_enabled: true 
                    }, { onConflict: 'user_id' });
                if (error) throw error;
                setTotpStep("idle");
                showMsg("Kích hoạt xác thực 2 lớp thành công!");
                fetchProfile();
            } catch (e) {
                showMsg("Lỗi: " + e.message, "error");
            } finally {
                setVerifying(false);
            }
        };

        const handleDisableTOTP = async () => {
            if (!confirm("Bạn chắc chắn muốn tắt xác thực 2 lớp?")) return;
            const { error } = await supabase
                .from('user_totp')
                .upsert({ 
                    user_id: currentUserId, 
                    totp_secret: null, 
                    totp_enabled: false 
                }, { onConflict: 'user_id' });
            if (!error) { showMsg("Đã tắt xác thực 2 lớp."); fetchProfile(); }
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-black/60 z-[10000] flex items-center justify-center p-4 animate-zoom-in" onClick={onClose}>
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[90vh] overflow-hidden" onClick={e => e.stopPropagation()}>
                    <div className="p-4 bg-blue-700 text-white flex justify-between items-center shrink-0">
                        <h3 className="font-bold text-lg flex items-center gap-2">
                            <UI_Icons.User size={20}/> Hồ Sơ Cá Nhân
                        </h3>
                        <button onClick={onClose} className="hover:bg-blue-800 p-1 rounded-full transition-colors"><UI_Icons.X size={20}/></button>
                    </div>

                    <div className="overflow-y-auto flex-1 p-5 space-y-5">
                        {message.text && (
                            <div className={`p-3 rounded-lg text-sm font-bold text-center ${message.type === 'error' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-green-100 text-green-700 border border-green-200'}`}>
                                {message.text}
                            </div>
                        )}
                        {loading ? <div className="text-center py-10 text-gray-400">Đang tải...</div> : (<>
                            <div className="bg-gray-50 rounded-lg p-4 border space-y-2">
                                <div className="font-bold text-gray-800 text-base">{profile?.ho_ten || "Chưa cập nhật"}</div>
                                <div className="text-sm text-gray-500">{currentUser}</div>
                                <div className="grid grid-cols-2 gap-2 pt-2 border-t border-gray-200">
                                    <div>
                                        <div className="text-xs font-bold text-gray-500 mb-1">Chức vụ</div>
                                        <input
                                            className="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-blue-500 font-medium"
                                            value={profile?.chuc_vu || ""}
                                            onChange={e => setProfile({...profile, chuc_vu: e.target.value})}
                                            placeholder="Nhập chức vụ..."
                                        />
                                    </div>
                                    <div>
                                        <div className="text-xs font-bold text-gray-500 mb-1">Đơn vị</div>
                                        <input
                                            className="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-blue-500 font-medium"
                                            value={profile?.don_vi || ""}
                                            onChange={e => setProfile({...profile, don_vi: e.target.value})}
                                            placeholder="Nhập đơn vị..."
                                        />
                                    </div>
                                </div>
                                <button
                                    onClick={async () => {
                                        const { error } = await supabase.from('profiles')
                                            .update({ chuc_vu: profile.chuc_vu, don_vi: profile.don_vi })
                                            .eq('id', currentUserId);
                                        if (error) showMsg("Lỗi cập nhật: " + error.message, "error");
                                        else showMsg("Đã cập nhật thông tin!");
                                    }}
                                    className="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 active:scale-95 transition-all text-sm"
                                >
                                    Lưu Thông Tin
                                </button>
                            </div>

                            {/* CHỮ KÝ */}
                            <div className="border rounded-lg overflow-hidden">
                                <div className="bg-orange-50 px-4 py-2 border-b flex items-center gap-2">
                                    <UI_Icons.Edit size={16} className="text-orange-600"/>
                                    <span className="font-bold text-orange-800 text-sm">Chữ Ký Điện Tử</span>
                                </div>
                                <div className="p-4 space-y-3">
                                    {profile?.chu_ky_url ? (
                                        <div className="text-center">
                                            <div className="text-xs text-gray-500 mb-2">Chữ ký hiện tại:</div>
                                            <div className="border border-gray-200 rounded-lg p-2 bg-gray-50 inline-block">
                                                <img src={profile.chu_ky_url} alt="Chữ ký" className="max-h-20 max-w-full object-contain"/>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center text-gray-400 italic text-sm py-2 bg-gray-50 rounded border border-dashed border-gray-300">Chưa có chữ ký</div>
                                    )}
                                    {sigPreview && (
                                        <div className="text-center">
                                            <div className="text-xs text-blue-600 font-bold mb-1">Xem trước:</div>
                                            <div className="border-2 border-blue-300 rounded-lg p-2 bg-blue-50 inline-block">
                                                <img src={sigPreview} alt="Preview" className="max-h-20 max-w-full object-contain"/>
                                            </div>
                                        </div>
                                    )}
                                    <label className="flex items-center justify-center gap-2 w-full border-2 border-dashed border-orange-300 rounded-lg p-3 cursor-pointer bg-orange-50 hover:bg-orange-100 transition-colors">
                                        <UI_Icons.Upload size={18} className="text-orange-600"/>
                                        <span className="text-sm font-bold text-orange-700">{sigFile ? sigFile.name : "Chọn ảnh chữ ký (PNG/JPG, tối đa 2MB)"}</span>
                                        <input type="file" accept="image/*" className="hidden" onChange={handleSigFileChange}/>
                                    </label>
                                    {sigFile && (
                                        <button onClick={handleUploadSignature} disabled={uploadingImg} className="w-full bg-orange-600 text-white font-bold py-2.5 rounded-lg hover:bg-orange-700 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2">
                                            {uploadingImg ? <><div className="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> Đang lưu...</> : <><UI_Icons.Save size={18}/> Lưu Chữ Ký</>}
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* TOTP */}
                            <div className="border rounded-lg overflow-hidden">
                                <div className="bg-green-50 px-4 py-2 border-b flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <UI_Icons.ShieldCheck size={16} className="text-green-600"/>
                                        <span className="font-bold text-green-800 text-sm">Xác Thực 2 Lớp (Google Authenticator)</span>
                                    </div>
                                    {profile?.totp_enabled && <span className="text-[11px] bg-green-200 text-green-800 font-bold px-2 py-0.5 rounded-full">ĐÃ BẬT</span>}
                                </div>
                                <div className="p-4 space-y-3">
                                    {!profile?.totp_enabled && totpStep === "idle" && (
                                        <div className="space-y-3">
                                            <p className="text-sm text-gray-600">Bật xác thực 2 lớp để có thể ký biên bản điện tử. Bạn cần cài app <b>Google Authenticator</b> trên điện thoại.</p>
                                            <button onClick={handleStartTOTP} className="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg hover:bg-green-700 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2">
                                                <UI_Icons.KeyRound size={18}/> Bắt Đầu Kích Hoạt
                                            </button>
                                        </div>
                                    )}
                                    {totpStep === "qr" && (
                                        <div className="space-y-4">
                                            <p className="text-sm text-gray-700"><b>Bước 1:</b> Mở Google Authenticator → Bấm dấu <b>+</b> → Quét mã QR bên dưới.</p>
                                            <div className="flex justify-center">
                                                <div className="border rounded-lg p-2 bg-white inline-block">
                                                    <canvas id="qrcode-canvas"></canvas>
                                                </div>
                                            </div>
                                            <div className="bg-gray-100 rounded p-2 text-center">
                                                <div className="text-xs text-gray-500 mb-1">Hoặc nhập thủ công vào app:</div>
                                                <div className="font-mono text-sm font-bold text-gray-800 tracking-wider break-all">{totpSecret}</div>
                                            </div>
                                            <p className="text-sm text-gray-700"><b>Bước 2:</b> Nhập mã 6 số từ app để xác nhận.</p>
                                            <input
                                                type="number"
                                                className="w-full border-2 border-green-300 rounded-lg p-3 text-center text-2xl font-bold tracking-widest outline-none focus:border-green-500"
                                                placeholder="000000"
                                                value={otpInput}
                                                onChange={e => setOtpInput(e.target.value.slice(0, 6))}
                                                onKeyDown={e => e.key === 'Enter' && handleVerifyTOTP()}
                                            />
                                            <button onClick={handleVerifyTOTP} disabled={verifying || otpInput.length !== 6} className="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg hover:bg-green-700 disabled:opacity-50 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2">
                                                {verifying ? <><div className="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> Đang xác minh...</> : <><UI_Icons.ShieldCheck size={18}/> Xác Nhận Mã OTP</>}
                                            </button>
                                            <button onClick={() => setTotpStep("idle")} className="w-full text-gray-500 text-sm hover:underline">Hủy</button>
                                        </div>
                                    )}
                                    {profile?.totp_enabled && totpStep === "idle" && (
                                        <div className="space-y-3">
                                            <div className="flex items-center gap-2 text-green-700 bg-green-50 p-3 rounded-lg border border-green-200">
                                                <UI_Icons.ShieldCheck size={20}/>
                                                <span className="text-sm font-bold">Xác thực 2 lớp đang hoạt động. Bạn có thể ký biên bản điện tử.</span>
                                            </div>
                                            <button onClick={handleDisableTOTP} className="text-sm text-red-500 hover:underline w-full text-center">Tắt xác thực 2 lớp</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </>)}
                    </div>

                    <div className="p-4 border-t bg-gray-50 flex justify-end shrink-0">
                        <button onClick={onClose} className="px-6 py-2 bg-gray-200 text-gray-800 font-bold rounded-lg hover:bg-gray-300 transition-colors">Đóng</button>
                    </div>
                </div>
            </div>
        );
    };

// --- COMPONENT TRANG QUẢN LÝ BÁO CÁO (ĐÃ CẬP NHẬT NÚT ĐĂNG XUẤT) ---
    const ReportListPage = ({ isOpen, onCreateNew, onLoad, onExport, onZoom, onLogout, onOpenCreateAccount, onOpenAccountManager, onOpenProfile, onSign, onCopy, showToast, pendingCount, currentUser, currentUserId, currentUserRole, dbProfiles }) => {
        const [activeMainTab, setActiveMainTab] = useState("bienban");
        const [reports, setReports] = useState([]);
        const [loading, setLoading] = useState(false);
        const [filterDate, setFilterDate] = useState(""); 
        const [filterCode, setFilterCode] = useState("");
        const [filterMaDinhDanh, setFilterMaDinhDanh] = useState("");
        const [downloadedIds, setDownloadedIds] = useState([]);
        const [previewImages, setPreviewImages] = useState(null);
        const [visibleCount, setVisibleCount] = useState(25);
        const [filterCreator, setFilterCreator] = useState("");
        const debounceRef = useRef(null);

        const fetchReportsDebounced = (code, date, ma) => {
            if (debounceRef.current) clearTimeout(debounceRef.current);
            debounceRef.current = setTimeout(() => {
                fetchReports(code, date, ma);
            }, 400);
        };

        useEffect(() => {
            const updateDownloadedStatus = () => {
                const downloaded = JSON.parse(localStorage.getItem('downloaded_reports') || '[]');
                setDownloadedIds(downloaded);
            };
            if (isOpen) {
                document.body.style.overflow = 'hidden'; 
                fetchReports();
                updateDownloadedStatus();
                window.addEventListener('storage', updateDownloadedStatus);
            } else {
                document.body.style.overflow = '';
            }
            return () => { document.body.style.overflow = ''; window.removeEventListener('storage', updateDownloadedStatus); }
        }, [isOpen]);

        // Realtime: khi có signature_requests thay đổi → tải lại để cập nhật tab Chờ Ký
        useEffect(() => {
            if (!isOpen || !currentUserId) return;
            const channel = supabase
                .channel('reportlist-sigreq-' + currentUserId)
                .on('postgres_changes', {
                    event: '*', schema: 'public', table: 'signature_requests',
                    filter: `user_id=eq.${currentUserId}`
                }, () => fetchReports())
                .subscribe();
            return () => supabase.removeChannel(channel);
        }, [isOpen, currentUserId]);

        const fetchReports = async (searchCode = filterCode, searchDate = filterDate, searchMa = filterMaDinhDanh) => {
            setLoading(true);
            try {
                let query = supabase
                    .from('bien_ban_khao_sat')
                    .select('*, signature_requests(id, user_id, vai_tro, thu_tu, trang_thai)')
                    .order('ngay_thuc_hien', { ascending: false, nullsFirst: false }) 
                    .order('created_at', { ascending: false });
                if (searchCode && searchCode.trim()) {
                    const kw = searchCode.trim();
                    query = query.or(`ma_tru.ilike.%${kw}%,ten_tuyen.ilike.%${kw}%`);
                }
                if (searchMa && searchMa.trim()) query = query.ilike('ma_dinh_danh', `%${searchMa.trim()}%`);
                if (searchDate) {
                    const startDate = new Date(searchDate); startDate.setHours(0, 0, 0, 0);
                    const endDate = new Date(searchDate); endDate.setHours(23, 59, 59, 999);
                    query = query.gte('created_at', startDate.toISOString()).lte('created_at', endDate.toISOString());
                }
                const { data, error } = await query;
                if (error) throw error;
                setReports(data || []);
            } catch (error) { showToast("Lỗi tải danh sách: " + error.message, "error"); } finally { setLoading(false); }
        };

        // Lọc danh sách theo tab đang active
        const baseReports = activeMainTab === "choky"
            ? reports.filter(r => (r.signature_requests || []).some(
                sr => sr.user_id === currentUserId && sr.trang_thai === 'cho_ky'
              ))
            : activeMainTab === "cuatoi"
            ? reports.filter(r => r.user_id === currentUserId)
            : reports;

        const visibleReports = filterCreator.trim()
            ? baseReports.filter(r => {
                const creator = dbProfiles.find(p => p.id === r.user_id);
                return creator?.ho_ten?.toLowerCase().includes(filterCreator.trim().toLowerCase());
              })
            : baseReports;

        const handleClearFilters = () => { setFilterCode(""); setFilterDate(""); setFilterMaDinhDanh(""); setFilterCreator(""); setVisibleCount(25); fetchReports("", "", ""); };
        
        // --- HÀM XÓA BIÊN BẢN (ĐÃ NÂNG CẤP XÓA SẠCH ẢNH TRÊN CLOUD) ---
        const handleDelete = async (report, e) => {
            e.stopPropagation();
            if(!confirm("Bạn có chắc muốn xóa biên bản này vĩnh viễn? Cảnh báo: Các hình ảnh đi kèm cũng sẽ bị xóa khỏi máy chủ!")) return;
            
            setLoading(true);
            try {
                // 1. Lấy danh sách ảnh từ biên bản chuẩn bị xóa
                const hinhAnh = report.du_lieu_form?.hinh_anh || [];
                
                // 2. Nếu có ảnh, tiến hành dọn rác trên Supabase Storage
                if (hinhAnh.length > 0) {
                    const bucketName = 'survey_images';
                    const pathsToDelete = hinhAnh.map(url => {
                        // URL dạng: .../public/survey_images/12345_abc.jpg -> Lấy phần "12345_abc.jpg"
                        const parts = url.split(`${bucketName}/`);
                        return parts.length > 1 ? parts.pop() : null;
                    }).filter(path => path !== null);

                    if (pathsToDelete.length > 0) {
                        const { error: storageError } = await supabase.storage.from(bucketName).remove(pathsToDelete);
                        if (storageError) console.warn("Lỗi dọn rác ảnh:", storageError);
                    }
                }

                // 3. Xóa dữ liệu trong Database
                const { error } = await supabase.from('bien_ban_khao_sat').delete().eq('id', report.id);
                if (error) throw error;
                
                fetchReports();
                showToast("Đã xóa biên bản thành công!");
            } catch (error) {
                showToast("Lỗi xóa: " + error.message, "error");
            } finally {
                setLoading(false);
            }
        };

        const handleEditClick = (id) => { onLoad(id); };
        
        const handleExportClick = (report) => { 
            if (onExport) {
                onExport(report);
                if (!downloadedIds.includes(report.id)) {
                    setDownloadedIds([...downloadedIds, report.id]);
                }
            }
        };
        
        const formatDateTime = (isoString) => formatVNDateTime(isoString);

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-gray-100 z-[9999] flex flex-col overflow-hidden" style={{ margin: 0, padding: 0 }}>
                {/* MODAL XEM ẢNH TRONG LIST */}
                <ImageGalleryModal images={previewImages} onClose={() => setPreviewImages(null)} onZoom={onZoom} />

                {/* HEADER (ĐÃ SỬA: THÊM NÚT ĐĂNG XUẤT) */}
                <div className="bg-white border-b px-3 py-2 shadow-sm flex items-center justify-between shrink-0 h-14 relative z-20">
                    <div className="flex items-center gap-2">
                        <h2 className="text-base font-bold text-blue-800 uppercase flex items-center gap-1">
                            <UI_Icons.NotebookPen size={18} /> KHẢO SÁT HIỆN TRƯỜNG
                        </h2>
                    </div>
                    
                    <div className="flex items-center gap-2">
                        {/* Hiển thị tên user trên màn hình lớn */}
                        <span className="text-xs font-bold text-gray-500 hidden sm:block mr-1">Xin chào, {currentUser} - Quyền: [{currentUserRole}]</span>
                        
                        {/* Nút Quản lý & Tạo TK - CHỈ HIỂN THỊ KHI LÀ ADMIN */}
                        {currentUserRole === 'admin' && (
                            <>
                                <button onClick={onOpenAccountManager} className="bg-purple-50 hover:bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full transition-colors border border-purple-200 font-bold text-xs flex items-center gap-1 shadow-sm">
                                    <UI_Icons.Users size={14}/> <span className="hidden md:inline">Danh sách TK</span>
                                </button>
                                <button onClick={onOpenCreateAccount} className="bg-green-50 hover:bg-green-100 text-green-700 px-3 py-1.5 rounded-full transition-colors border border-green-200 font-bold text-xs flex items-center gap-1 shadow-sm">
                                    <UI_Icons.UserPlus size={14}/> <span className="hidden md:inline">Tạo TK</span>
                                </button>
                            </>
                        )}

                        {/* NÚT ĐĂNG XUẤT */}
                        <button onClick={onOpenProfile} className="bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-full transition-colors border border-blue-200 font-bold text-xs flex items-center gap-1">
                            <UI_Icons.User size={14}/> <span className="hidden md:inline">Hồ Sơ</span>
                        </button>
                        <button onClick={onLogout} className="bg-gray-100 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-full transition-colors border border-gray-200 font-bold text-xs flex items-center gap-1">
                            Thoát
                        </button>

                        <button onClick={onCreateNew} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-full transition-colors shadow-md font-bold flex items-center gap-2 text-sm">
                            <UI_Icons.Plus size={18} strokeWidth={3} /> Tạo Mới
                        </button>
                    </div>
                </div>

                {/* FILTER BAR (Đã tối ưu Mobile: Tách 2 dòng khi màn hình nhỏ) */}
                <div className="bg-white p-2 md:p-3 border-b shrink-0 z-10 shadow-sm">
                    <div className="max-w-4xl mx-auto flex flex-col gap-2">
                        {/* --- TAB BAR (NEW): Biên Bản / Chờ Ký --- */}
                        <div className="flex bg-gray-100 p-1 rounded-lg shadow-inner border border-gray-200 gap-1">
                            <button
                                onClick={() => { setActiveMainTab("bienban"); setVisibleCount(25); }}
                                className={`flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-xs md:text-sm font-bold transition-all ${
                                    activeMainTab === "bienban"
                                        ? "bg-blue-600 text-white shadow-md ring-1 ring-blue-700"
                                        : "bg-transparent text-gray-500 hover:bg-white hover:text-blue-700"
                                }`}
                            >
                                <UI_Icons.NotebookPen size={16}/>
                                <span>Biên Bản</span>
                            </button>
                            <button
                                onClick={() => { setActiveMainTab("cuatoi"); setVisibleCount(25); }}
                                className={`flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-xs md:text-sm font-bold transition-all ${
                                    activeMainTab === "cuatoi"
                                        ? "bg-green-600 text-white shadow-md ring-1 ring-green-700"
                                        : "bg-transparent text-gray-500 hover:bg-white hover:text-green-700"
                                }`}
                            >
                                <UI_Icons.User size={16}/>
                                <span>Của Tôi</span>
                            </button>
                            <button
                                onClick={() => { setActiveMainTab("choky"); setVisibleCount(25); }}
                                className={`flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-xs md:text-sm font-bold transition-all relative ${
                                    activeMainTab === "choky"
                                        ? "bg-red-600 text-white shadow-md ring-1 ring-red-700"
                                        : "bg-transparent text-gray-500 hover:bg-white hover:text-red-600"
                                }`}
                            >
                                <UI_Icons.Edit size={16}/>
                                <span>Chờ Ký</span>
                                {pendingCount > 0 && (
                                    <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-0.5 ${
                                        activeMainTab === "choky"
                                            ? "bg-yellow-400 text-red-900"
                                            : "bg-red-500 text-white"
                                    }`}>
                                        {pendingCount}
                                    </span>
                                )}
                            </button>
                        </div>

                        <div className="flex gap-2">
                            <div className="flex-1 relative">
                                <input type="text" className="w-full border border-gray-300 rounded-lg pl-8 pr-2 py-2 outline-none focus:border-blue-500 font-bold text-gray-700 text-sm shadow-inner transition-colors" placeholder="Tìm theo mã trụ hoặc tên tuyến..." value={filterCode} onChange={(e) => { setFilterCode(e.target.value); fetchReportsDebounced(e.target.value, filterDate, filterMaDinhDanh); }} />
                                <div className="absolute left-2.5 top-2.5 text-gray-400"><UI_Icons.ZoomIn size={16}/></div>
                            </div>
                            <div className="relative w-44">
                                <input type="text" className="w-full border border-gray-300 rounded-lg pl-8 pr-2 py-2 outline-none focus:border-blue-500 font-mono text-gray-700 text-sm shadow-inner transition-colors" placeholder="Mã định danh..." value={filterMaDinhDanh} onChange={(e) => { setFilterMaDinhDanh(e.target.value); fetchReportsDebounced(filterCode, filterDate, e.target.value); }} />
                                <div className="absolute left-2.5 top-2.5 text-gray-400"><UI_Icons.Hash size={16}/></div>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <div className="flex-1 relative">
                                <input
                                    type="text"
                                    className="w-full border border-gray-300 rounded-lg pl-8 pr-2 py-2 outline-none focus:border-blue-500 font-medium text-gray-700 text-sm shadow-inner transition-colors"
                                    placeholder="Tìm theo người tạo..."
                                    value={filterCreator}
                                    onChange={(e) => { setFilterCreator(e.target.value); setVisibleCount(25); }}
                                />
                                <div className="absolute left-2.5 top-2.5 text-gray-400"><UI_Icons.User size={16}/></div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <input
                                type="date"
                                className="flex-none border border-gray-300 rounded-lg px-2 py-2 outline-none font-medium text-sm w-36 shadow-inner"
                                value={filterDate}
                                onChange={(e) => { setFilterDate(e.target.value); fetchReportsDebounced(filterCode, e.target.value, filterMaDinhDanh); }}
                            />
                            <button
                                onClick={handleClearFilters}
                                className="bg-gray-200 hover:bg-red-100 hover:text-red-600 text-gray-600 font-bold py-2 px-3 rounded-lg active:scale-95 transition-all shrink-0 flex items-center gap-1.5 border border-gray-300"
                                title="Xóa bộ lọc"
                            >
                                <UI_Icons.RotateCcw size={16}/> <span className="hidden md:inline text-sm">Reset</span>
                            </button>

                            {/* LEGEND MÀU SẮC TRẠNG THÁI KÝ */}
                            <div className="hidden sm:flex items-center gap-2 ml-auto flex-wrap">
                                <span className="flex items-center gap-1 text-xs text-gray-500">
                                    <span className="inline-block w-8 h-5 rounded bg-gray-200 border border-gray-300"></span>
                                    Chưa ký
                                </span>
                                <span className="flex items-center gap-1 text-xs text-gray-500">
                                    <span className="inline-block w-8 h-5 rounded bg-orange-200 border border-orange-300"></span>
                                    Ký một phần
                                </span>
                                <span className="flex items-center gap-1 text-xs text-gray-500">
                                    <span className="inline-block w-8 h-5 rounded bg-green-200 border border-green-300"></span>
                                    Đã ký đủ
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                {/* DANH SÁCH */}
                <div className="flex-1 overflow-y-auto bg-gray-100 p-2">
                    <div className="max-w-4xl mx-auto pb-4">
                        {loading ? (
                            <div className="text-center py-8 text-gray-500 text-sm flex flex-col items-center gap-2"><div className="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div> Đang tải...</div>
                        ) : visibleReports.length === 0 ? (
                            <div className="text-center py-10 bg-white rounded border border-gray-200 text-gray-400 italic text-sm">
                                {activeMainTab === "choky" 
                                    ? "🎉 Không có biên bản nào đang chờ bạn ký!"
                                    : activeMainTab === "cuatoi"
                                    ? "Bạn chưa tạo biên bản nào."
                                    : "Chưa có biên bản nào. Bấm \"Tạo Mới\" để bắt đầu."}
                            </div>
                        ) : (
                            <div className="bg-white rounded border border-gray-200 overflow-hidden shadow-sm">
                                <div className="divide-y divide-gray-100">
                                    {visibleReports.slice(0, visibleCount).map(r => {
                                        const isDownloaded = downloadedIds.includes(r.id);
                                        const btnClass = isDownloaded ? "bg-green-100 text-green-700 border-green-200 hover:bg-green-200" : "bg-white text-gray-700 border-gray-300 hover:bg-gray-100 hover:text-green-700 hover:border-green-300";
                                        const imgCount = r.du_lieu_form?.hinh_anh ? r.du_lieu_form.hinh_anh.length : 0;
                                        
                                        // Kiểm tra xem user hiện tại có phải là người tạo biên bản không
                                        const isOwner = r.user_id === currentUserId;

                                        // Kiểm tra có người KHÁC (không phải người tạo) đã ký chưa
                                        const othersSigned = (r.signature_requests || []).some(
                                            sr => sr.trang_thai === 'da_ky' && sr.user_id !== currentUserId
                                        );

                                        // Được sửa nếu: là chủ sở hữu VÀ chưa có ai khác ký
                                        const canEdit = isOwner && !othersSigned;

                                        // Tìm signature_request CỦA USER HIỆN TẠI đang chờ ký (nếu có)
                                        const myPendingSig = (r.signature_requests || []).find(
                                            sr => sr.user_id === currentUserId && sr.trang_thai === 'cho_ky'
                                        );

                                        // --- TRẠNG THÁI KÝ CỦA BIÊN BẢN (để tô màu badge ngày) ---
                                        const allSigs = r.signature_requests || [];
                                        const totalSigs = allSigs.length;
                                        const signedSigs = allSigs.filter(sr => sr.trang_thai === 'da_ky').length;
                                        
                                        let dateBadgeClass = "bg-gray-200 text-gray-700"; // Mặc định: chưa ai ký
                                        let dateBadgeTitle = totalSigs === 0 ? "Không yêu cầu ký" : "Chưa có chữ ký nào";
                                        
                                        if (totalSigs > 0 && signedSigs > 0 && signedSigs < totalSigs) {
                                            // Đã ký một phần
                                            dateBadgeClass = "bg-orange-200 text-orange-800 border border-orange-300";
                                            dateBadgeTitle = `Đã ký ${signedSigs}/${totalSigs} - Còn chờ ${totalSigs - signedSigs} người`;
                                        } else if (totalSigs > 0 && signedSigs === totalSigs) {
                                            // Đã ký đủ
                                            dateBadgeClass = "bg-green-200 text-green-800 border border-green-300";
                                            dateBadgeTitle = `Đã ký đủ ${signedSigs}/${totalSigs}`;
                                        }
                                        
                                        return (
                                            <div key={r.id} className="px-3 py-3 hover:bg-blue-50 transition-colors group cursor-default">
                                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 md:gap-2">
                                                    
                                                    {/* Phần Text (Nội dung) */}
                                                    <div className="flex-1 min-w-0 flex flex-col justify-center">
                                                        <div className="font-bold text-blue-800 text-[15px] leading-tight mb-1.5 line-clamp-2 md:truncate" title={r.ma_tru}>
                                                            {r.ma_tru || "---"}
                                                        </div>

                                                        <div className="flex items-center text-xs md:text-sm text-gray-600 gap-2">
                                                            <span 
                                                                className={`font-bold whitespace-nowrap shrink-0 px-1.5 py-0.5 rounded ${dateBadgeClass}`}
                                                                title={dateBadgeTitle}
                                                            >
                                                                {r.ngay_thuc_hien 
                                                                    ? r.ngay_thuc_hien.split('-').reverse().join('/') 
                                                                    : formatDateTime(r.created_at)}
                                                            </span>
                                                            <span className="text-gray-300 hidden md:inline">|</span>
                                                            <span className="truncate" title={r.ten_tuyen}>
                                                                {r.ten_tuyen || "(Chưa có nội dung)"}
                                                            </span>
                                                        </div>
                                                    </div>
                                                    
                                                    {/* Phần Nút Bấm */}
                                                    <div className="flex flex-col items-end justify-between gap-1 shrink-0 border-t border-gray-100 md:border-t-0 pt-2 md:pt-0 mt-1 md:mt-0">
                                                        <div className="flex items-center justify-end gap-2">

                                                        {imgCount > 0 ? (
                                                            <button onClick={() => setPreviewImages(r.du_lieu_form.hinh_anh)} className="flex items-center gap-1.5 px-3 py-1.5 bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 rounded-md text-xs font-bold active:scale-95 transition-transform shadow-sm" title="Xem ảnh hiện trường"><UI_Icons.Image size={14}/> {imgCount} Ảnh</button>
                                                        ) : (
                                                            <span className="flex items-center gap-1.5 px-1 py-1.5 text-gray-400 text-xs italic"><UI_Icons.Image size={14}/> 0 Ảnh</span>
                                                        )}
                                                        <div className="flex items-center gap-1.5">
                                                            {/* NÚT XEM + KÝ - chỉ hiện ở TAB "CHỜ KÝ" (khi user có yêu cầu chờ ký) */}
                                                            {activeMainTab === "choky" && myPendingSig && (
                                                                <>
                                                                    <button onClick={() => onLoad(r.id, true)} className="flex items-center gap-1 px-3 py-1.5 bg-gray-50 text-gray-700 hover:bg-gray-100 border border-gray-300 rounded-md text-xs font-bold active:scale-95 transition-transform shadow-sm" title="Xem biên bản trước khi ký">
                                                                        <UI_Icons.FileText size={14}/> Xem
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => onSign({ 
                                                                            ...myPendingSig, 
                                                                            bien_ban_id: r.id, 
                                                                            bien_ban_khao_sat: { ma_tru: r.ma_tru, ten_tuyen: r.ten_tuyen, ngay_thuc_hien: r.ngay_thuc_hien } 
                                                                        })} 
                                                                        className="flex items-center gap-1 px-3 py-1.5 bg-red-600 text-white hover:bg-red-700 rounded-md text-xs font-bold active:scale-95 transition-transform shadow-md"
                                                                    >
                                                                        <UI_Icons.Edit size={14}/> Ký
                                                                    </button>
                                                                </>
                                                            )}
                                                            {/* NÚT COPY - hiện ở TAB "BIÊN BẢN" và "CỦA TÔI" */}
                                                            {(activeMainTab === "bienban" || activeMainTab === "cuatoi") && (
                                                                <button
                                                                    onClick={() => onCopy(r.id)}
                                                                    className="flex items-center gap-1 px-3 py-1.5 bg-yellow-50 text-yellow-700 hover:bg-yellow-100 border border-yellow-200 rounded-md text-xs font-bold active:scale-95 transition-transform shadow-sm"
                                                                    title="Tạo biên bản mới từ biên bản này"
                                                                >

    const App = () => {

        };
        const showToast = (message, type = 'success', duration = 3500) => {
            const id = Date.now() + Math.random();

            setTimeout(() => removeToast(id), duration);
        };
        // ===== END TOAST STATE =====

        const [isAuthenticated, setIsAuthenticated] = useState(false);
        const [isCheckingAuth, setIsCheckingAuth] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);

        const [currentUserRole, setCurrentUserRole] = useState('user'); // State lưu quyền

        // Hàm tiện ích lấy thông tin Profile từ DB
        const fetchUserProfile = async (userId, emailFallback) => {
            const { data } = await supabase.from('profiles').select('*').eq('id', userId).maybeSingle();
            if (data) {
                setCurrentUser(data.ho_ten || emailFallback);
                setCurrentUserRole(data.role || 'user');

                setCurrentUserRole('user');
            }

        // --- 1. KIỂM TRA PHIÊN ĐĂNG NHẬP BẢO MẬT KHI MỞ APP ---
        useEffect(() => {
            const checkSession = async () => {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    setCurrentUserId(session.user.id);
                    await fetchUserProfile(session.user.id, session.user.email);
                    setIsAuthenticated(true);
                }
                setIsCheckingAuth(false);
            };
            checkSession();
        }, []);

        // --- 2. HÀM ĐĂNG NHẬP MỚI (DÙNG SUPABASE AUTH) ---
        const handleLogin = async (username, password) => {
            if(!username || !password) return alert("Vui lòng nhập đủ thông tin!");
            setIsCheckingAuth(true);
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: username,
                    password: password,
                });

                if (error || !data.user) {
                    alert("Sai tài khoản hoặc mật khẩu!");
                } else {
                    setCurrentUserId(data.user.id);
                    await fetchUserProfile(data.user.id, data.user.email);
                    setIsAuthenticated(true);
                }
            } catch (e) { 
                alert("Lỗi kết nối: " + e.message);
            }
            setIsCheckingAuth(false);
        };

        // --- 3. HÀM ĐĂNG XUẤT MỚI ---

                setCurrentUserId(null);

        // --- 1. CÁC HÀM TIỆN ÍCH (DATE HELPER) ---
        // Lấy ngày hôm nay chuẩn ISO (yyyy-mm-dd) cho input type="date"
        const getTodayISO = () => {

            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        // Chuyển đổi ngày từ ISO (yyyy-mm-dd) sang VN (dd/mm/yyyy) để xuất Word
        const formatDateVN = (isoDate) => {

        // --- 2. CẤU TRÚC DỮ LIỆU MẶC ĐỊNH (Quan trọng để sửa lỗi sửa 1 bị hết) ---

        // Đếm biên bản chờ ký của user hiện tại
        useEffect(() => {

        const [currentReportId, setCurrentReportId] = useState(null);

        // --- HÀM TỔNG HỢP: TẢI TOÀN BỘ DỮ LIỆU NỀN MỚI NHẤT ---

            // 4. Tải Mẫu nội dung

        const handlePoleChange = (e) => {

                loc_poleCode_to: selectedCode, 
                // ----------------------------------------------------

                // Logic cũ: Tự tìm tên tuyến (nếu có trong DB thì lấy, không thì giữ nguyên cái cũ để không bị xóa mất tuyến đã nhập)
                loc_lineName: found ? found.line_name : (prev.loc_lineName || "")
            })); 
        };

        const tags9a = [ 
        { label: "trụ", content: "trụ", inline: true },
        { label: "Trụ", content: "{tru_chinh}/", inline: true },
        { label: "tuyến", content: "tuyến", inline: true },

        { label: "Cắt 2FCO", content: "- Cắt 02 FCO trụ {tru} tuyến {tuyen}." }, 
        { label: "Cắt 3FCO", content: "- Cắt 03 FCO trụ {tru} tuyến {tuyen}." }, 
        { label: "TĐ HA", content: "- Thử điện, tiếp địa hạ áp 01 bộ tại trụ {tru} tuyến {tuyen}." }, 
        { label: "Tháo lèo", content: "- Tháo 03 nối rẽ trụ {tru} tuyến {tuyen}." }, 
        { label: "Khóa tủ", content: "- Khóa tủ CB trụ {tru} tuyến {tuyen}." },

        { label: "Cắt 3LBFCO", content: "- Cắt 03 LBFCO trụ {tru_chinh}/ tuyến {tuyen}" },
        { label: "Cắt MC", content: "- Cắt MC + 03 DS trụ {tru_chinh}/ tuyến {tuyen}." },
        { label: "Cắt LBS", content: "- Cắt LBS + 03 DS trụ {tru_chinh}/ tuyến {tuyen}." },
        ];

        const tags9b = [ { label: "Mẫu chuẩn", content: "- Chuẩn bị trang thiết bị, dụng cụ thi công.\n- Trang bị đầy đủ bảo hộ lao động, dụng cụ an toàn cá nhân.\n- Không được vượt khỏi phạm vi cho phép làm việc.\n- Trả điện đúng thời gian đăng ký." } ];

        // --- QUẢN LÝ LIST MẪU TỪ DB ---
        const [taskTemplates, setTaskTemplates] = useState([]);
        const [scopeTemplates, setScopeTemplates] = useState([]);
        const [showTemplateManager, setShowTemplateManager] = useState(false); // State mở modal
        const [selectedTaskTemplate, setSelectedTaskTemplate] = useState(""); // Biến giữ giá trị chọn Mục 5
        const [selectedScopeTemplate, setSelectedScopeTemplate] = useState(""); // Biến giữ giá trị chọn Mục 6


        const getContextData = () => { return { code: formData.loc_poleCode, sub: formData.loc_subCode, line: formData.loc_lineName }; };
        
const generateDiagramImage = async (data) => {
            if (!data || data.length === 0) return null;
            return new Promise((resolve) => {
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                
                // 1. Tính toán khung bao (giữ nguyên logic cũ)
                data.forEach(obj => { 
                    if (obj.type === 'line' || obj.type === 'arrow' || obj.type === 'measure_bracket') { minX = Math.min(minX, obj.x1, obj.x2); maxX = Math.max(maxX, obj.x1, obj.x2); minY = Math.min(minY, obj.y1, obj.y2); maxY = Math.max(maxY, obj.y1, obj.y2); }
                    else if (obj.type === 'rect_pvlv') { minX = Math.min(minX, obj.x); maxX = Math.max(maxX, obj.x + obj.width); minY = Math.min(minY, obj.y); maxY = Math.max(maxY, obj.y + obj.height); } 
                    else { const cx = obj.x !== undefined ? obj.x : obj.cx; const cy = obj.y !== undefined ? obj.y : obj.cy; const size = 40; minX = Math.min(minX, cx - size); maxX = Math.max(maxX, cx + size); minY = Math.min(minY, cy - size); maxY = Math.max(maxY, cy + size); } 
                });
                
                const padding = 50; minX -= padding; maxX += padding; minY -= padding; maxY += padding;
                const width = maxX - minX; const height = maxY - minY;

                // 2. TẠO SVG (QUAN TRỌNG: Đã xóa 'background-color: white' để nền trong suốt)
                let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="${minX} ${minY} ${width} ${height}">`; // <--- ĐÃ XÓA background-color
                
                // ... (Phần vẽ các đối tượng giữ nguyên như cũ) ...
                data.forEach(obj => {
                    if(obj.type === 'line' || obj.type === 'arrow') { 
                        const angle = Math.atan2(obj.y2 - obj.y1, obj.x2 - obj.x1) * 180 / Math.PI;
                        svgContent += `<g>`;
                        svgContent += `<line x1="${obj.x1}" y1="${obj.y1}" x2="${obj.x2}" y2="${obj.y2}" stroke="black" stroke-width="${obj.strokeWidth}" stroke-dasharray="${obj.dash ? '5,5' : 'none'}" />`; 
                        if (obj.type === 'arrow') {
                            svgContent += `<polygon points="0,0 -12,-5 -12,5" fill="black" transform="translate(${obj.x2}, ${obj.y2}) rotate(${angle})" />`;
                        }
                        svgContent += `</g>`;
                    }
                    if(obj.type === 'circle') svgContent += `<circle cx="${obj.cx}" cy="${obj.cy}" r="4" fill="black" />`;
                    if(obj.type === 'text') svgContent += `<text x="${obj.x}" y="${obj.y}" font-family="Times New Roman" font-size="${obj.fontSize}" transform="rotate(${obj.rotate||0}, ${obj.x}, ${obj.y})">${obj.text}</text>`; // Đổi font sang Times cho đẹp


                    if(obj.type === 'icon_device') { 
                        const isRot = obj.rotate === 90;
                        svgContent += `<g transform="translate(${obj.x}, ${obj.y})">`; 
                        
                        if(['FCO', 'LBFCO'].includes(obj.subType)) { 
                            svgContent += `<line x1="-14" y1="-14" x2="14" y2="14" stroke="black" stroke-width="2"/><path d="M -14 -14 A 12.5 12.5 0 0 1 0 0" fill="none" stroke="black" stroke-width="2"/><path d="M 0 0 A 12.5 12.5 0 0 0 14 14" fill="${obj.subType==='LBFCO'?'black':'none'}" stroke="black" stroke-width="2"/>`; 
                        } else if(obj.subType === 'Recloser') { 
                            svgContent += `<rect x="${isRot ? -12 : -16}" y="${isRot ? -16 : -12}" width="${isRot ? 24 : 32}" height="${isRot ? 32 : 24}" fill="white" stroke="black" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="black" stroke="none">R</text>`; 
                        } else if(obj.subType === 'LBS') { 
                            svgContent += `<circle cx="0" cy="0" r="14" fill="white" stroke="black" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="black" stroke="none">L</text>`; 
                        } else if(obj.subType === 'DS') { 
                            svgContent += `<line x1="${isRot ? 0 : -26}" y1="${isRot ? -26 : 0}" x2="${isRot ? 0 : -10}" y2="${isRot ? -10 : 0}" stroke="black" stroke-width="2"/><line x1="${isRot ? 0 : 10}" y1="${isRot ? 10 : 0}" x2="${isRot ? 0 : 26}" y2="${isRot ? 26 : 0}" stroke="black" stroke-width="2"/><line x1="${isRot ? 0 : -10}" y1="${isRot ? -10 : 0}" x2="${isRot ? 13 : 8}" y2="${isRot ? 8 : -13}" stroke="black" stroke-width="2"/>`; 
                        } else { 
                            svgContent += `<rect x="-15" y="-15" width="30" height="30" fill="white" stroke="black" stroke-width="2"/><line x1="-15" y1="-15" x2="15" y2="15" stroke="black" stroke-width="2"/><line x1="15" y1="-15" x2="-15" y2="15" stroke="black" stroke-width="2"/>`; 
                        }
                
                        if (['DS', 'LBS', 'Recloser'].includes(obj.subType)) {
                            svgContent += `<text x="${isRot ? 18 : 0}" y="${isRot ? 4 : -22}" text-anchor="${isRot ? "start" : "middle"}" font-family="Arial" font-size="12" font-weight="bold" fill="black" stroke="none">${obj.label}</text></g>`; 
                        } else {
                            svgContent += `<text x="18" y="4" font-family="Arial" font-size="12" font-weight="bold" fill="black" stroke="none">${obj.label}</text></g>`; 
                        }
                    }
                
                    if(obj.type === 'icon_load') { 
                        svgContent += `<g transform="translate(${obj.x}, ${obj.y})">`;
                        if(obj.subType === 'TBA') {
                            svgContent += `<circle cx="0" cy="0" r="13.5" fill="white" stroke="black" stroke-width="2"/><polygon points="0,-13.5 11.68,6.75 -11.68,6.75" fill="none" stroke="black" stroke-width="2"/>`;
                        } else { 
                            svgContent += `<rect x="-18" y="-25" width="36" height="50" fill="white" stroke="black" stroke-width="2"/>`; 
                        }
                        svgContent += `<text x="18" y="4" font-family="Arial" font-size="12" font-weight="bold" fill="black" stroke="none">${obj.label}</text></g>`;
                    }

                        createPara(`Biên bản này được lập thành ${sourceForm.soBan} bản và được tất cả mọi người dự họp là đại diện của các đơn vị có liên quan đến công việc đồng ý, thông qua để làm cơ sở tiến hành công việc sau này (nếu không thay đổi về những nội dung chính) và ký tên dưới đây.`, false, 24, AlignmentType.JUSTIFIED),

                            rows: [
